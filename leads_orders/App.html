<script>
/* ============================================================
   Leads & Orders — page script
   Board: one column per FMS step, one tile per lead/order.
   Green = on time · yellow = deadline close · red = overdue (always on top).
   ============================================================ */
var S = {
  me: null, flows: {}, boards: {}, ver: '', users: [], industries: [], warnPct: 30, scores: {},
  fid: 'L2O', view: 'board', f: {}, cf: {}, pin: null, flash: null, closedTab: 'won', closedAll: true, more: {},
  panel: null, perf: { range: '30', user: '' }, perfData: null, set: null, setTab: 'people', setFid: 'L2O',
  det: {}, perfCache: {}, expand: {}, closedOpen: false, dense: true, started: false, timers: false, lastScroll: 0
};
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function ls(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem('lo_' + k) || 'null'); localStorage.setItem('lo_' + k, JSON.stringify(v)); } catch (e) { return null; } }
function call(fn) {
  var args = [].slice.call(arguments, 1);
  return new Promise(function (res, rej) {
    PORTAL.run.withSuccessHandler(res).withFailureHandler(function (e) { rej(e); })[fn].apply(null, args);
  });
}
function errMsg(e) { return String((e && e.message) || e || 'Something went wrong.').replace(/^(Error|Exception):\s*/, ''); }
function toast(msg, kind) {
  var t = $('toast'); t.textContent = msg; t.className = 'toast on' + (kind ? ' ' + kind : '');
  clearTimeout(toast.t); toast.t = setTimeout(function () { t.className = 'toast'; }, kind === 'err' ? 6000 : 3800);
}
function fail(e) { toast(errMsg(e), 'err'); }

var IC = {
  board: '<path d="M3 5h4v14H3zM10 5h4v9h-4zM17 5h4v6h-4z"/>',
  me: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  team: '<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3.2-5.5 7-5.5s7 2 7 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M22 20c0-2.8-1.8-4.6-4.5-5.3"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  filter: '<path d="M3 5h18l-7 8v6l-4 2v-8z"/>',
  note: '<path d="M4 4h16v12H8l-4 4z"/>',
  cam: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  back: '<path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>',
  fu: '<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
  link: '<path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>',
  sheet: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 3v18"/>',
  chevl: '<path d="m15 18-6-6 6-6"/>',
  chevr: '<path d="m9 18 6-6-6-6"/>',
  bell: '<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
  phone: '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>'
};
function ic(n, st) { return '<svg class="ic" viewBox="0 0 24 24"' + (st ? ' style="' + st + '"' : '') + '>' + IC[n] + '</svg>'; }
function ini(n) { var p = String(n || '?').trim().split(/\s+/); return ((p[0] || '?')[0] + (p[1] ? p[1][0] : (p[0] || '')[1] || '')).toUpperCase(); }

/* ---------------------------------------------------------- dates & values */
var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function ist(ms) { var d = new Date(ms + W_OFF); return { y: d.getUTCFullYear(), m: d.getUTCMonth(), d: d.getUTCDate(), h: d.getUTCHours(), mi: d.getUTCMinutes() }; }
function fDate(ms) { if (!ms) return ''; var x = ist(ms); return ('0' + x.d).slice(-2) + ' ' + MON[x.m] + ' ' + String(x.y).slice(2); }
function fTime(ms) { if (!ms) return ''; var x = ist(ms), h = x.h % 12 || 12; return h + ':' + ('0' + x.mi).slice(-2) + (x.h < 12 ? ' am' : ' pm'); }
function fDT(ms) { return ms ? fDate(ms) + ', ' + fTime(ms) : ''; }
function isoDay(ms) { var x = ist(ms); return x.y + '-' + ('0' + (x.m + 1)).slice(-2) + '-' + ('0' + x.d).slice(-2); }
function fVal(fl, v) {
  if (v == null || v === '') return '';
  if (fl && (fl.t === 'date') && typeof v === 'number') { var x = ist(v); return x.h || x.mi ? fDT(v) : fDate(v); }
  if (fl && fl.t === 'datetime' && typeof v === 'number') return fDT(v);
  return String(v);
}

/* ---------------------------------------------------------- flow helpers */
function FL(fid) { return S.flows[fid || S.fid]; }
function stepsOf(fid) { return FL(fid).steps; }
function stepOf(fid, k) { var a = stepsOf(fid); for (var i = 0; i < a.length; i++) if (a[i].key === k) return a[i]; return null; }
function lab(fid, k) { var s = stepOf(fid, k); return s ? s.cfg.label : k; }
function mainSteps(fid) { return stepsOf(fid).filter(function (s) { return !s.cfg.side; }); }
function isLastMain(fid, k) { var m = mainSteps(fid); return m.length && m[m.length - 1].key === k && !stepOf(fid, k).cfg.side; }
function nextMain(fid, k) { var a = stepsOf(fid), i = a.map(function (s) { return s.key; }).indexOf(k); for (var j = i + 1; j < a.length; j++) if (!a[j].cfg.side) return a[j].key; return null; }
function leadsOf(fid) { return (S.boards[fid || S.fid] || {}).leads || []; }
/** The Order → Delivery board also shows the steps of its cycles (CYC). */
function boardFlows(fid) { return fid === 'O2D' && S.flows.CYC ? ['O2D', 'CYC'] : [fid]; }
function boardOf(fid) { return (S.flows[fid] && S.flows[fid].parent) || fid; }
function stepFid(k) { var fs = boardFlows(S.fid); for (var i = 0; i < fs.length; i++) if (stepOf(fs[i], k)) return fs[i]; return S.fid; }
function flowList() { return ['L2O', 'O2D'].concat(S.flows.CYC ? ['CYC'] : []); }
function numOf(v) { var n = parseFloat(String(v == null ? '' : v).replace(/,/g, '')); return isNaN(n) ? 0 : n; }
function fmtT(v) { var n = Math.round(numOf(v) * 100) / 100; return String(n); }
function cycN(id) { var m = /-C(\d+)$/.exec(String(id)); return m ? Number(m[1]) : 0; }
function cyclesOfOrder(id) { return leadsOf('CYC').filter(function (c) { return String(pick(c.b, 'Order No')).trim() === id; }).sort(function (a, b) { return cycN(a.id) - cycN(b.id); }); }
function findLead(fid, id) { var a = leadsOf(fid); for (var i = 0; i < a.length; i++) if (a[i].id === id) return a[i]; return null; }
function pick(o, h) { if (!o) return ''; if (o[h] != null) return o[h]; var k = String(h).toLowerCase().trim(); for (var x in o) if (x.toLowerCase().trim() === k) return o[x]; return ''; }
function refVal(lead, ref) {
  var i = ref.indexOf(':'), sk = ref.slice(0, i), h = ref.slice(i + 1);
  if (sk === 'base') return pick(lead.b, h);
  var s = lead.s[sk]; if (!s) return '';
  if (h === '@status') return s.s || '';
  return pick(s.f, h);
}
function refField(fid, ref) {
  var i = ref.indexOf(':'), sk = ref.slice(0, i), h = ref.slice(i + 1).toLowerCase();
  if (h === '@status') return { k: (stepOf(fid, sk) || {}).cfg ? lab(fid, sk) : sk, t: 'text' };
  var list = sk === 'base' ? FL(fid).base : ((stepOf(fid, sk) || {}).fields || []);
  for (var j = 0; j < list.length; j++) if (list[j].k.toLowerCase() === h) return list[j];
  return null;
}
function refLabel(fid, ref) {
  var i = ref.indexOf(':'), sk = ref.slice(0, i), h = ref.slice(i + 1);
  if (h === '@status') return lab(fid, sk);
  return nice(h);
}
function nice(h) {
  var map = { 'CONTACT PERSON': 'Contact', 'Contact Details': 'Phone', 'PRODUCT NAME': 'Product', 'QUANTITY': 'Qty', 'SOURCE': 'Source',
    'COUNTRY / CITY': 'Place', 'EXP. / DOM': 'Market', 'Product Category': 'Category', 'ATT. NAME': 'Owner', 'MAIL ID': 'E-mail',
    'Mines/Factory': 'Mine', 'Mat. Gr.': 'Material', 'QTY.': 'Qty', 'EST. DEL. Dt.': 'Est. delivery', 'SALES PER.': 'Sales person',
    'PARTY NAME': 'Party', 'Prev. Dt.': 'Ready by', 'EDD': 'EDD', 'TPT. NAME': 'Transporter', 'VEH.': 'Vehicle', 'WT.': 'Weight',
    'MOB.': 'Driver mob.', 'Balance WT.': 'Balance wt', 'Act. Date': 'Dispatched', 'Payment Term': 'Payment', 'Sample Status': 'Sample result',
    'DELIVERY STATUS': 'Sample delivery', 'DISPATCH DATE': 'Sample sent', 'Company Name': 'Company' };
  var k = String(h).trim().replace(/\s+/g, ' ');
  if (map[k]) return map[k];
  return /[a-z]/.test(k) || k.length < 4 ? k : k.charAt(0) + k.slice(1).toLowerCase();   // "REMARK" → "Remark"
}
function titleOf(lead, fid) {
  var f = FL(fid || S.fid), t = '';
  f.titles.forEach(function (h) { if (!t) t = String(pick(lead.b, h) || '').trim(); });
  return t || '(no name)';
}
function tileKeys(lead) { return lead.closed ? [] : (lead.cur ? [lead.cur] : []).concat(lead.side || []); }
function dueOf(fid, lead, k) {
  var st = stepOf(fid, k), x = (lead.s || {})[k] || {};
  if (!st) return 'none';
  return dueState(x.p, st.tat, Date.now(), FL(fid).cal, S.warnPct);
}
function dueText(fid, lead, k) {
  var x = lead.s[k] || {}, d = dueOf(fid, lead, k), now = Date.now();
  if (d === 'none') return 'No deadline';
  if (d === 'over') return 'Late ' + fmtDur(now - x.p);
  return fmtDur(x.p - now) + ' left';
}
function myNames() { return S.me.names || []; }
/** The person with access whose names match a sheet name (ATT. NAME / SALES PER.), if any. */
function userOfName(name) {
  var v = String(name || '').trim().toLowerCase();
  if (!v) return null;
  for (var i = 0; i < S.users.length; i++) if (S.users[i].u.toLowerCase() === v) return S.users[i];
  for (var j = 0; j < S.users.length; j++) if ((S.users[j].names || [S.users[j].n, S.users[j].u]).some(function (n) { return namesMatch(n, name); })) return S.users[j];
  return null;
}
function roleWord(u) { return { admin: 'Admin', manager: 'Manager', exec: 'Executive', leadgen: 'Lead Generator', ordergen: 'Order Generator' }[u.r] || u.rn || ''; }
var GEN = { leadgen: 'L2O', ordergen: 'O2D' };
/** People a lead / order can be given to (form-only roles never work one). */
function workers() { return S.users.filter(function (u) { return !GEN[u.r]; }); }
/** One label for a person everywhere (assign list, Owner filter): the Master App username written in the sheet. */
function userLabel(u) { return u.u + (u.n && u.n.toUpperCase() !== u.u.toUpperCase() ? ' — ' + u.n : '') + ' · ' + roleWord(u); }
/** Owner filter: everyone with access + names in the sheet that have no access yet. */
function ownerOpts(fid) {
  var m = {};
  workers().forEach(function (u) { m[u.u.toUpperCase()] = { v: u.u, t: userLabel(u), n: 0 }; });
  leadsOf(fid).forEach(function (l) {
    var o = String(l.owner || '').trim();
    if (!o) return;
    var u = userOfName(o), k = (u ? u.u : o).toUpperCase();
    m[k] = m[k] || { v: o, t: o + ' · no access', n: 0 };
    m[k].n++;
  });
  return Object.keys(m).map(function (k) { return m[k]; }).sort(function (a, b) { return a.v.localeCompare(b.v); });
}
function assignSelect(id, cur, withMe, extra) {
  var curU = cur ? userOfName(cur) : null;
  return '<select class="inp" id="' + id + '"' + (extra || '') + ' style="max-width:260px">' + (curU ? '' : '<option value="">' + esc(cur ? cur + ' (no access)' : '— pick —') + '</option>') +
    workers().map(function (u) { var on = curU ? curU.u === u.u : (withMe && u.u === S.me.username); return '<option value="' + esc(u.u) + '"' + (on ? ' selected' : '') + '>' + esc(userLabel(u)) + '</option>'; }).join('') + '</select>';
}
/** A step this person works: ticked as a doer, or answered by the lead owner. */
function myStep(st) {
  var un = S.me.username.toLowerCase();
  return st.cfg.ownerActs || (st.cfg.doers || []).some(function (d) { return String(d).toLowerCase() === un; });
}
function isOwner(lead) { return myNames().some(function (n) { return namesMatch(n, lead.owner); }); }
function canAct(fid, lead, k) {
  if (S.me.role !== 'exec') return true;
  var c = (stepOf(fid, k) || {}).cfg; if (!c) return false;
  var un = S.me.username.toLowerCase();
  if ((c.doers || []).some(function (d) { return String(d).toLowerCase() === un; })) return true;
  return c.ownerActs && isOwner(lead);
}
function ruleText(fid, k, rule) {
  if (rule === 'next') { var n = nextMain(fid, k); return n ? 'Moves to “' + lab(fid, n) + '”' : 'Finishes the ' + FL(fid).unit; }
  if (rule === 'stay') return 'Stays at this step — logged as a follow-up, the deadline keeps running';
  if (rule === 'won') return fid === 'L2O' ? 'Closes as WON — then turn it into an order' : 'Completes the order';
  if (rule === 'lost') return 'Closes as LOST';
  if (rule.indexOf('back:') === 0) return 'Goes back to “' + lab(fid, rule.slice(5)) + '” — that step starts again';
  return rule;
}
function ruleCls(rule) { return rule.indexOf('back:') === 0 ? 'back' : rule; }

/* ---------------------------------------------------------- start */
PORTAL.ready(function (u) { boot(u); });

function cacheKey(name) { return 'lo_cache_' + String(name || '').toLowerCase(); }
/**
 * 1) opened from the portal tile: the data is already inside the page (BOOT_DATA) → drawn at once;
 * 2) otherwise the last copy saved on this phone is drawn at once and refreshed in the background.
 */
function boot(u) {
  var name = (u && u.username) || '', first = window.BOOT_DATA;
  window.BOOT_DATA = null;
  if (first && first.me && first.me.username.toLowerCase() === name.toLowerCase()) { start(first); saveCache(); return; }
  var cached = null;
  try { cached = JSON.parse(localStorage.getItem(cacheKey(name)) || 'null'); } catch (e) {}
  if (cached && cached.me && cached.flows && cached.me.username.toLowerCase() === name.toLowerCase()) { start(cached); $('sync').className = 'sync busy'; }
  call('bootstrap').then(function (r) {
    if (!S.started) start(r);
    else { applyBoot(r); if (S.view === 'board') renderBoard(true); renderShell(); }
    $('sync').className = 'sync';
    saveCache();
  }).catch(function (e) { if (!S.started) $('bootMsg').textContent = errMsg(e); else $('sync').className = 'sync off'; });
}
function start(r) {
  applyBoot(r);
  S.started = true;
  $('boot').hidden = true; $('app').hidden = false;
  if (GEN[S.me.role]) { renderGen(); return; }
  var v = ls('view'); if (v && navItems().some(function (x) { return x.k === v; })) S.view = v;
  var f = ls('fid'); if (f && S.flows[f]) S.fid = f;
  S.f = ls('filters') || {};
  S.dense = ls('dense') !== false;
  renderShell(); render();
  startTimers();
}
/** Keeps the last data on this device so the next open draws instantly (never blocks the page). */
function saveCache() {
  if (!S.me) return;
  clearTimeout(saveCache.t);
  saveCache.t = setTimeout(function () {
    var k = cacheKey(S.me.username);
    try {
      localStorage.setItem(k, JSON.stringify({ me: S.me, flows: Object.keys(S.flows).map(function (x) { return S.flows[x]; }),
        boards: Object.keys(S.boards).map(function (x) { return S.boards[x]; }), ver: S.ver, users: S.users, industries: S.industries,
        warnPct: S.warnPct, scores: S.scores, hub: S.hub }));
    } catch (e) { try { localStorage.removeItem(k); } catch (e2) {} }
  }, 600);
}
function applyBoot(r) {
  S.lists = r.lists || null;
  S.me = r.me; S.users = r.users || []; S.industries = r.industries || []; S.warnPct = r.warnPct; S.scores = r.scores; S.ver = r.ver;
  (r.flows || []).forEach(function (f) { wCal(f.cal); S.flows[f.fid] = f; });
  setBoards(r.boards);
  S.hub = r.hub || S.hub;
  if (S.hub) $('hubLink').href = S.hub.replace(/\?app=.*$/, '');
}
function setBoards(list) { (list || []).forEach(function (b) { S.boards[b.fid] = b; }); buildIndex(); }

function navItems() {
  var a = [{ k: 'board', t: 'Pipeline', i: 'board' }, { k: 'me', t: 'My performance', i: 'me' }, { k: 'rem', t: 'Reminders', i: 'bell' }];
  if (S.me && S.me.role !== 'exec') a.push({ k: 'team', t: 'Team performance', i: 'team' });
  if (S.me && S.me.role === 'admin') a.push({ k: 'settings', t: 'Settings', i: 'gear' });
  return a;
}
function renderShell() {
  var items = navItems();
  $('nav').innerHTML = items.map(function (x) { return '<button class="nav-i' + (S.view === x.k ? ' on' : '') + '" data-nav="' + x.k + '">' + ic(x.i) + '<span class="tip">' + x.t + '</span></button>'; }).join('');
  $('bnav').innerHTML = items.map(function (x) { return '<button class="' + (S.view === x.k ? 'on' : '') + '" data-nav="' + x.k + '">' + ic(x.i) + '<span>' + x.t.replace('performance', '').trim() + '</span></button>'; }).join('');
  $('meAv').innerHTML = '<span data-ggm-photo="' + esc(S.me.username) + '">' + esc(ini(S.me.name)) + '</span>';
  $('meAv').title = S.me.name + ' · ' + S.me.roleName;
}

/* ---------------------------------------------------------- live updates + screen time */
var ACT = { last: Date.now(), acc: 0 };
function startTimers() {
  if (S.timers) return;
  S.timers = true;
  ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(function (ev) { window.addEventListener(ev, function () { ACT.last = Date.now(); }, { passive: true, capture: true }); });
  document.addEventListener('scroll', function () { ACT.last = S.lastScroll = Date.now(); }, { passive: true, capture: true });
  setInterval(function () { if (document.visibilityState === 'visible' && Date.now() - ACT.last < 180000) ACT.acc += 5; }, 5000);
  setInterval(function () { sync(false); }, 45000);
  setTimeout(function () { S.pingOpens = 1; sync(false); }, 3000);
  document.addEventListener('visibilitychange', function () { sync(false); });
  window.addEventListener('resize', function () { clearTimeout(S.rz); S.rz = setTimeout(function () { if ((S.view === 'me' || S.view === 'team') && S.perfData) drawPerf(S.perfData); }, 200); });
}
function sync(force) {
  var secs = ACT.acc, opens = S.pingOpens || 0;
  ACT.acc = 0; S.pingOpens = 0;
  $('sync').className = 'sync busy';
  return call('ping', secs, force ? '' : S.ver, opens).then(function (r) {
    $('sync').className = 'sync';
    S.ver = r.ver;
    if (!r.same) { (r.flows || []).forEach(function (f) { wCal(f.cal); S.flows[f.fid] = f; }); setBoards(r.boards); saveCache(); }
    refreshBoardSoon();
  }).catch(function () { ACT.acc += secs; S.pingOpens = opens; $('sync').className = 'sync off'; });
}
/** Redraw for new data / passing time — but never while someone is scrolling, typing or has a filter open. */
function refreshBoardSoon() {
  if (S.view !== 'board') return;
  var a = document.activeElement, typing = a && a.closest && a.closest('#ribbon,#pop,#searchBox,#modal');
  if (typing || !$('pop').hidden || Date.now() - S.lastScroll < 4000) { clearTimeout(refreshBoardSoon.t); refreshBoardSoon.t = setTimeout(refreshBoardSoon, 3000); return; }
  renderBoard(true);
}
/* ---------------------------------------------------------- render: top + views */
function render() {
  renderShell();
  var board = S.view === 'board';
  $('flowSeg').hidden = !board; $('searchBox').hidden = !board; $('newBtn').hidden = !board;
  $('pageTitle').textContent = { board: 'Pipeline', me: 'My performance', team: 'Team performance', settings: 'Settings', rem: 'Reminders' }[S.view];
  if (board) { renderFlowSeg(); renderBoard(); }
  else if (S.view === 'me' || S.view === 'team') renderPerf();
  else if (S.view === 'settings') renderSettings();
  else if (S.view === 'rem') { if (S.rem) drawRem(); renderRem(false); }
}
function renderFlowSeg() {
  $('flowSeg').innerHTML = ['L2O', 'O2D'].map(function (fid) {
    var open = 0, red = 0;
    boardFlows(fid).forEach(function (bf) { leadsOf(bf).forEach(function (l) { tileKeys(l).forEach(function (k) { open++; if (dueOf(bf, l, k) === 'over') red++; }); }); });
    return '<button class="' + (S.fid === fid ? 'on' : '') + '" data-flow="' + fid + '">' + esc(S.flows[fid].title) + ' <span class="n">' + open + '</span>' + (red ? '<span class="r">' + red + '</span>' : '') + '</button>';
  }).join('');
  $('newBtn').textContent = S.fid === 'L2O' ? '+ New lead' : '+ New order';
}

/* ---------------------------------------------------------- filters */

/* ---------------------------------------------------------- photos (shrunk on the phone before upload) */
function shrink(file, max, q) {
  return new Promise(function (res, rej) {
    var r = new FileReader();
    r.onload = function () {
      var img = new Image();
      img.onload = function () {
        var s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', q));
      };
      img.onerror = function () { rej(new Error('Not an image: ' + file.name)); };
      img.src = r.result;
    };
    r.onerror = function () { rej(new Error('Could not read ' + file.name)); };
    r.readAsDataURL(file);
  });
}
function readPhotos(files) {
  return Promise.all([].slice.call(files, 0, 8).map(function (f) {
    return Promise.all([shrink(f, 1400, .82), shrink(f, 220, .6)]).then(function (a) { return { data: a[0], thumb: a[1], caption: '' }; });
  }));
}

/** "Prakash Traders" ≈ "Prakash Trader, merut" ≈ "prakash trader": a name with the noise taken out. */
function normName(s) {
  return String(s || '').toLowerCase().replace(/m\/s|\b(pvt|private|ltd|limited|the|co|company)\b/g, ' ')
    .split(/[^a-z0-9]+/).filter(String).map(function (w) { return w.length > 3 ? w.replace(/s$/, '') : w; }).join('');
}

  var p = [], i, j;
  for (j = 0; j <= b.length; j++) p[j] = j;
  for (i = 1; i <= a.length; i++) {
    var prev = p[0]; p[0] = i;
    for (j = 1; j <= b.length; j++) { var t = p[j]; p[j] = Math.min(p[j] + 1, p[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = t; }
  }
  return p[b.length];
}
/** Existing names that look like a typo / variant of v (none when v is already in the list as typed). */
function nearNames(v, list) {
  var up = String(v).trim().toUpperCase(), n = normName(v);
  if (n.length < 3 || list.some(function (x) { return String(x).trim().toUpperCase() === up; })) return [];
  var score = function (m) {
    var lo = Math.min(m.length, n.length), hi = Math.max(m.length, n.length);

    return m === n ? 0 : (lo >= 5 && (m.indexOf(n) > -1 || n.indexOf(m) > -1)) ? 1 : (lo >= 6 && editDist(m, n) <= Math.max(1, Math.floor(hi / 7))) ? 2 : -1;
  };
  return list.map(function (x) {
    var a = score(normName(x)), b = score(normName(String(x).split(/[,(]/)[0]));   // "Krishna Udhyog, Jaipur" → also "Krishna Udhyog"
    var s = a < 0 ? b : b < 0 ? a : Math.min(a, b);
    return s < 0 ? null : { v: x, s: s };
  }).filter(Boolean).sort(function (a, b) { return a.s - b.s || a.v.localeCompare(b.v); }).slice(0, 4).map(function (x) { return x.v; });

    kpi('Won / lost', k.won + ' / ' + k.lost, k.conv == null ? '' : k.conv + '% won') +

    d.breakdown.map(function (b) { return '<tr><td>' + esc(b.label) + '</td><td class="num">' + b.count + '</td><td class="num ' + (b.pts >= 0 ? 'pos' : 'neg') + '">' + (b.pts > 0 ? '+' : '') + b.pts + '</td><td class="hint">' + esc(b.last.join(' · ')) + '</td></tr>'; }).join('') +

      (e.st && S.flows[e.f] ? esc(lab(e.f, e.st)) + ' — ' : '') + esc(e.a.toLowerCase()) + (e.v ? ': ' + esc(e.v) : '') + '</div><div class="m">' + esc(fDT(e.t)) + '</div></div></div>'; }).join('') : '<div class="empty">Nothing in this period.</div>') + '</div>';

function teamHtml(d) {
  var rows = d.team, max = Math.max.apply(null, rows.map(function (r) { return Math.abs(r.score); }).concat([1]));
  var T = rows.reduce(function (a, r) { a.score += r.score; a.done += r.done; a.open += r.open; a.over += r.over; a.won += r.won; a.lost += r.lost; a.secs += r.secsPerDay; if (r.onTimePct != null) { a.ot += r.onTimePct * r.done; a.otn += r.done; } return a; },
    { score: 0, done: 0, open: 0, over: 0, won: 0, lost: 0, secs: 0, ot: 0, otn: 0 });
  var active = rows.filter(function (r) { return r.days; }).length;
  // open tiles of the whole pipeline, each counted once (summing people counts a tile twice when two people share a step,
  // and never counts tiles of owners without access)
  T.open = 0; T.over = 0;
  flowList().forEach(function (fid) { leadsOf(fid).forEach(function (l) { tileKeys(l).forEach(function (k) { T.open++; if (dueOf(fid, l, k) === 'over') T.over++; }); }); });
  return '<div class="kpis">' + kpi('Team score', (T.score > 0 ? '+' : '') + T.score, active + ' of ' + rows.length + ' people active', 'feature') +
    kpi('Steps done', T.done, T.otn ? Math.round(T.ot / T.otn) + '% on time' : '') + kpi('Open now', T.open, '<span class="neg">' + T.over + ' overdue</span> · both boards', T.over ? 'bad' : '') +
    kpi('Won / lost', T.won + ' / ' + T.lost, T.won + T.lost ? Math.round(100 * T.won / (T.won + T.lost)) + '% won' : '') +
    kpi('Screen time', hrs(active ? T.secs / active : 0), 'a day, per active person') + '</div>' +
    '<div class="card"><div class="card-h"><h3>People</h3><span class="sub">tap a person for their dashboard · open / late = tiles waiting on them now</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Person</th><th>Score</th><th class="num">+</th><th class="num">−</th><th class="num">Steps</th><th class="num">On time</th><th class="num">Open / late</th><th class="num">Won / lost</th><th class="num">Screen/day</th><th>Last seen</th></tr></thead><tbody>' +
    rows.map(function (r) {
      var w = Math.round(70 * Math.abs(r.score) / max);
      return '<tr class="click" data-puser="' + esc(r.u) + '"><td><span style="display:inline-flex;gap:8px;align-items:center"><span class="av" style="width:26px;height:26px;font-size:10px" data-ggm-photo="' + esc(r.u) + '">' + esc(ini(r.n)) + '</span><b>' + esc(r.n) + '</b></span></td>' +
        '<td><span style="display:inline-flex;align-items:center;gap:6px"><span style="display:inline-block;height:8px;border-radius:4px;width:' + w + 'px;background:' + (r.score >= 0 ? 'var(--ok)' : 'var(--bad)') + '"></span><b>' + r.score + '</b></span></td>' +
        '<td class="num pos">+' + r.pos + '</td><td class="num neg">' + r.neg + '</td><td class="num">' + r.done + '</td><td class="num">' + (r.onTimePct == null ? '—' : r.onTimePct + '%') + '</td>' +
        '<td class="num">' + r.open + ' / <span class="' + (r.over ? 'neg' : '') + '">' + r.over + '</span></td><td class="num">' + r.won + ' / ' + r.lost + '</td><td class="num">' + hrs(r.secsPerDay) + '</td><td class="hint">' + (r.last ? esc(fDT(r.last)) : 'never') + '</td></tr>';
    }).join('') + '</tbody></table></div></div>' + '<div style="margin-top:14px">' + pipelineHtml(null) + '</div>';
}
function axisDates(days, W, H, pad) {
  var n = days.length, step = Math.max(1, Math.ceil(n / 8)), bw = (W - pad * 2) / n, s = '';
  var lastTick = Math.floor((n - 1) / step) * step;   // the end date only when it does not run into the previous label
  days.forEach(function (d, i) { if (i % step === 0 || (i === n - 1 && (i - lastTick) * bw >= 44)) s += '<text x="' + (pad + bw * i + bw / 2) + '" y="' + (H - 4) + '" font-size="10" text-anchor="middle" fill="currentColor" opacity=".55">' + d.d.slice(8) + ' ' + MON[Number(d.d.slice(5, 7)) - 1] + '</text>'; });
  return s;
}
function chartScore(days) {
  var W = chartW(false), H = 220, pad = 26, n = days.length || 1, bw = (W - pad * 2) / n;
  var max = Math.max.apply(null, days.map(function (d) { return Math.max(d.pos, -d.neg); }).concat([5]));
  var mid = 18 + (H - 40) / 2, sc = ((H - 40) / 2) / max, s = '', line = [];
  days.forEach(function (d, i) {
    var x = pad + bw * i + bw * .15, w = Math.max(2, bw * .7);
    if (d.pos) s += '<rect x="' + x + '" y="' + (mid - d.pos * sc) + '" width="' + w + '" height="' + (d.pos * sc) + '" rx="2" fill="var(--ok)"/>';
    if (d.neg) s += '<rect x="' + x + '" y="' + mid + '" width="' + w + '" height="' + (-d.neg * sc) + '" rx="2" fill="var(--bad)"/>';
    line.push((pad + bw * i + bw / 2) + ',' + (mid - (d.pos + d.neg) * sc));
  });
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" style="color:var(--ink)"><line x1="' + pad + '" x2="' + (W - pad) + '" y1="' + mid + '" y2="' + mid + '" stroke="var(--line)"/>' + s +
    '<polyline points="' + line.join(' ') + '" fill="none" stroke="var(--charcoal)" stroke-width="2" stroke-linejoin="round"/>' +
    '<text x="2" y="' + (mid - max * sc + 10) + '" font-size="10" fill="currentColor" opacity=".55">+' + max + '</text><text x="2" y="' + (mid + max * sc - 2) + '" font-size="10" fill="currentColor" opacity=".55">−' + max + '</text>' + axisDates(days, W, H, pad) + '</svg>';
}
function chartSteps(days) {
  var W = chartW(true), H = 200, pad = 18, n = days.length || 1, bw = (W - pad * 2) / n;
  var max = Math.max.apply(null, days.map(function (d) { return d.onTime + d.late; }).concat([3])), sc = (H - 40) / max, base = H - 22, s = '';
  days.forEach(function (d, i) {
    var x = pad + bw * i + bw * .15, w = Math.max(2, bw * .7), y = base;
    if (d.onTime) { s += '<rect x="' + x + '" y="' + (y - d.onTime * sc) + '" width="' + w + '" height="' + (d.onTime * sc) + '" fill="var(--ok)" rx="1.5"/>'; y -= d.onTime * sc; }
    if (d.late) s += '<rect x="' + x + '" y="' + (y - d.late * sc) + '" width="' + w + '" height="' + (d.late * sc) + '" fill="var(--warn)" rx="1.5"/>';
  });
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" style="color:var(--ink);height:200px"><line x1="' + pad + '" x2="' + (W - pad) + '" y1="' + base + '" y2="' + base + '" stroke="var(--line)"/>' + s +
    '<text x="2" y="' + (base - max * sc + 9) + '" font-size="10" fill="currentColor" opacity=".55">' + max + '</text>' + axisDates(days, W, H, pad) + '</svg>';
}
function chartTime(days) {
  var W = chartW(true), H = 200, pad = 18, n = days.length || 1, bw = (W - pad * 2) / n;
  var maxM = Math.max.apply(null, days.map(function (d) { return d.secs / 60; }).concat([30])), maxO = Math.max.apply(null, days.map(function (d) { return d.opens; }).concat([3]));
  var base = H - 22, sc = (H - 40) / maxM, so = (H - 40) / maxO, s = '', pts = [];
  days.forEach(function (d, i) {
    var x = pad + bw * i + bw * .15, w = Math.max(2, bw * .7), m = d.secs / 60;
    if (m) s += '<rect x="' + x + '" y="' + (base - m * sc) + '" width="' + w + '" height="' + (m * sc) + '" fill="var(--amber)" rx="1.5"/>';
    pts.push((pad + bw * i + bw / 2) + ',' + (base - d.opens * so));
  });
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" style="color:var(--ink);height:200px"><line x1="' + pad + '" x2="' + (W - pad) + '" y1="' + base + '" y2="' + base + '" stroke="var(--line)"/>' + s +
    '<polyline points="' + pts.join(' ') + '" fill="none" stroke="var(--charcoal)" stroke-width="1.6"/>' +
    '<text x="2" y="' + (base - maxM * sc + 9) + '" font-size="10" fill="currentColor" opacity=".55">' + hrs(maxM * 60) + '</text>' + axisDates(days, W, H, pad) + '</svg>';
}

function remQuick(q) {
  var now = Date.now(), x = ist(now), d, t;
  if (q === '1h') { var m = now + 3600000, y = remIso(m); d = y.d; t = y.t; }

  $('remD').value = d; $('remT').value = t;

    $('modal').classList.remove('on'); toast(r.msg, 'ok');
