/** Correct the name of an item the store does not keep. Only offered while
 *  the item is unlisted — once it is on the list the name is the key its
 *  whole ledger is filed under, and only Stock may change it. */
function relabelDialog(ind){
  var c = showModal('<h3 class="modal-title">'+te('Correct the item name')+'</h3>'+
    '<p class="modal-sub">'+esc(ind.id)+' · '+esc(ind.site||'')+'</p>'+
    '<p class="muted" style="margin-top:0">'+
      te('Nobody keeps this item yet, so the name is still yours to fix. Write it the way the store says it.')+
    '</p>'+
    '<label class="field"><span class="field-label">'+te('Item name *')+'</span>'+
      '<input class="input" id="rName" value="'+esc(ind.partName||'')+'"></label>'+
    '<label class="field"><span class="field-label">'+te('Part number')+'</span>'+
      '<input class="input" id="rPart" value="'+esc(ind.partNumber||'')+'"></label>'+
    '<label class="field"><span class="field-label">'+te('Remarks')+'</span>'+
      '<input class="input" id="rNote" placeholder="'+te('Why the name changed')+'"></label>'+
    '<div class="modal-actions">'+
      '<button class="btn btn-ghost" data-close="modal">'+te('Cancel')+'</button>'+
      '<button class="btn btn-primary btn-3d" id="rGo">'+te('Save the name')+'</button>'+
    '</div>');
  c.querySelector('#rGo').addEventListener('click', function(){
    var name = c.querySelector('#rName').value.trim();
    if (!name) return toast(t('The item needs a name.'), 'err');
    busy(true);
    api('relabelItem', { indentId: ind.id, name: name,
                         partNumber: c.querySelector('#rPart').value.trim(),
                         remarks: c.querySelector('#rNote').value.trim() })
      .then(function(r){
        busy(false); closeOverlay('modal');
        toast(r.listed ? t('Renamed — and it matches an item you already keep')
                       : t('Name corrected'), 'ok');
        invalidateViews();
        openIndent(ind.id, true);
      }).catch(function(e){ busy(false); toast(e.message, 'err'); });
  });
}

/** Put the indent's item on this site's list. It carries the indent's own
 *  number so the administrator deciding it can see what it is for, and the
 *  indent itself never waits on that decision. */
function listItemDialog(ind){
  var site = ind.site || mySite();
  var c = showModal('<h3 class="modal-title">'+te('Add it to the item list')+'</h3>'+
    '<p class="modal-sub">'+esc(site)+' · '+esc(ind.id)+'</p>'+
    '<label class="field"><span class="field-label">'+te('Item name *')+'</span>'+
      '<input class="input" id="nName" value="'+esc(ind.partName||'')+'"></label>'+
    '<div class="row two">'+
      '<label class="field"><span class="field-label">'+te('Part number *')+'</span>'+
        '<input class="input" id="nPart" value="'+esc(ind.partNumber||'')+'"></label>'+
      '<label class="field"><span class="field-label">'+te('Unit')+'</span>'+
        '<select class="input" id="nUnit">'+ unitOptions(ind.unit||'') +'</select></label>'+
    '</div>'+
    '<label class="field"><span class="field-label">'+te('Section *')+'</span>'+
      '<select class="input" id="nSection">'+sectionOptions(site, ind.section||'')+'</select></label>'+
    '<label class="field"><span class="field-label">'+te('Opening stock')+'</span>'+
      '<input class="input" id="nOpen" inputmode="decimal" value="0">'+
      '<span class="muted">'+te('What is on the shelf right now, before this indent moves anything.')+'</span></label>'+
    '<div class="row two">'+
      '<label class="field"><span class="field-label">'+te('Lead time (days)')+'</span>'+
        '<input class="input" id="nLead" inputmode="decimal" value=""></label>'+
      '<label class="field"><span class="field-label">'+te('Safety stock')+'</span>'+
        '<input class="input" id="nSafety" inputmode="decimal" value=""></label>'+
    '</div>'+
    '<label class="field"><span class="field-label">'+te('Maximum order quantity')+'</span>'+
      '<input class="input" id="nMax" inputmode="decimal" value="">'+
      '<span class="muted">'+te('Above this an indent needs the administrator. Blank means no ceiling.')+'</span></label>'+
    '<div class="modal-actions">'+
      '<button class="btn btn-ghost" data-close="modal">'+te('Cancel')+'</button>'+
      '<button class="btn btn-primary btn-3d" id="nGo">'+te('Add item')+'</button>'+
    '</div>');
  c.querySelector('#nGo').addEventListener('click', function(){
    var p = {
      site: site, indentId: ind.id,
      name       : c.querySelector('#nName').value.trim(),
      partNumber : c.querySelector('#nPart').value.trim(),
      unit       : c.querySelector('#nUnit').value,
      section    : c.querySelector('#nSection').value,
      initialStock: c.querySelector('#nOpen').value.trim() || 0,
      leadDays   : c.querySelector('#nLead').value.trim() || 0,
      safetyStock: c.querySelector('#nSafety').value.trim() || 0,
      maxOrderQty: c.querySelector('#nMax').value.trim() || 0
    };
    if (!p.partNumber) return toast(t('Part number is required for a new item.'), 'err');
    if (!p.section)    return toast(t('Choose which section keeps this item.'), 'err');
    busy(true);
    api('addItem', p).then(function(r){
      busy(false); closeOverlay('modal');
      toast((r && r.pending) ? (r.message || t('Sent to the administrator to approve.'))
                             : t('Item added'), 'ok');
      STOCK.site = '';
      invalidateViews();
      openIndent(ind.id, true);
    }).catch(function(e){ busy(false); toast(e.message, 'err'); });
  });
}

function wireDrawer(d){
  var root = el('drawerPanel');
  clearPhotos();
  wirePhotos(root);
  var picked = null;
  var mode = 'COMPETITIVE';

  on(root, '[data-followup]', 'click', function(e,t){ followupDialog(t.getAttribute('data-followup')); });

  /* ---- the restocking close-out: yes/no, then a name and a number ----
     "No" is the ordinary answer and needs nothing, so the button is alive
     from the moment the panel opens. "Yes" is an issue off the shelf, and
     the same rule the server enforces is enforced here, so the button is
     dead before it is pressed rather than after. */
  var giveSeg = root.querySelector('#aGiveSeg');
  if (giveSeg){
    var giveBox  = root.querySelector('#aGiveBox');
    var giveTo   = root.querySelector('#aGiveTo');
    var giveQty  = root.querySelector('#aGiveQty');
    var giveWhy  = root.querySelector('#aGiveWhy');
    var giveNote = root.querySelector('#aGiveNote');
    var closeBtn = root.querySelector('#aCloseBtn');
    var ceiling  = giveQty ? Number(giveQty.getAttribute('data-max')) || 0 : 0;
    var rUnit    = d.indent.unit || '';

    var checkGive = function(){
      var giving = giveSeg.querySelector('[data-give="1"]').classList.contains('on');
      var stop = '';
      if (giving){
        var who = String(giveTo.value || '').trim();
        var raw = String(giveQty.value || '').trim();
        var n = raw === '' ? NaN : Number(raw);
        if (!who)                          stop = t('Choose who it is going to.');
        else if (raw === '')               stop = t('Enter how much they are taking.');
        else if (isNaN(n) || !isFinite(n)) stop = t('The quantity must be a number.');
        else if (n <= 0)                   stop = t('Enter a quantity above zero, or answer No if nothing is going out.');
        else if (n > ceiling)              stop = t('There is only') + ' ' + qty(ceiling) + ' ' +
                                                  t(rUnit) + ' ' + t('on the shelf. You cannot give out') +
                                                  ' ' + qty(n) + '.';
        if (!stop && giveNote){
          giveNote.textContent = qty(ceiling - n) + ' ' + t(rUnit) + ' ' + t('would stay on the shelf');
        }
      } else if (giveNote){
        giveNote.textContent = t('It can be more or less than this indent ordered — but never more than the shelf holds.') +
                               ' ' + t('At most') + ' ' + qty(ceiling) + ' ' + t(rUnit) + '.';
      }
      if (closeBtn){
        closeBtn.disabled = !!stop;
        closeBtn.classList.toggle('is-off', !!stop);
        closeBtn.textContent = giving && !stop
          ? t('Issue and close') : t('Close this indent');
      }
      if (giveWhy){
        giveWhy.textContent = stop;
        giveWhy.classList.toggle('show', !!stop);
      }
    };

    on(giveSeg, '[data-give]', 'click', function(e, btn){
      giveSeg.querySelectorAll('[data-give]').forEach(function(b){ b.classList.remove('on'); });
      btn.classList.add('on');
      var giving = btn.getAttribute('data-give') === '1';
      giveBox.classList.toggle('hidden', !giving);
      if (!giving){ giveTo.value = ''; giveQty.value = ''; }
      checkGive();
    });
    if (giveTo)  giveTo.addEventListener('change', checkGive);
    if (giveQty){ giveQty.addEventListener('input', checkGive); giveQty.addEventListener('change', checkGive); }
    checkGive();
  }

  on(root, '[data-relabel]', 'click', function(e,t){ relabelDialog(d.indent); });
  on(root, '[data-listit]',  'click', function(e,t){ listItemDialog(d.indent); });

  /* ---- the store's two numbers, checked as they are typed ----
     The same four rules the server enforces, so the button is dead
     before it is pressed rather than after. */
  var issueBox = root.querySelector('#aIssue');
  var orderBox = root.querySelector('#aOrder');
  if (issueBox || orderBox){
    var shelfEl = root.querySelector('#aShelf');
    var listed  = shelfEl && shelfEl.getAttribute('data-listed') === '1';
    var onShelf = shelfEl ? Number(shelfEl.getAttribute('data-stock')) || 0 : 0;
    var btn     = root.querySelector('#aStoreBtn');
    var why     = root.querySelector('#aWhy');
    var unit    = (d.indent.stockNow && d.indent.stockNow.unit) || d.indent.unit || '';

    var checkStore = function(){
      var iRaw = issueBox ? String(issueBox.value).trim() : '';
      var oRaw = orderBox ? String(orderBox.value).trim() : '';
      var i = iRaw === '' ? 0 : Number(iRaw);
      var o = oRaw === '' ? 0 : Number(oRaw);
      var stop = '';

      if (isNaN(i) || !isFinite(i))      stop = t('Issue now must be a number.');
      else if (isNaN(o) || !isFinite(o)) stop = t('Order must be a number.');
      else if (i < 0)                    stop = t('Issue now cannot be negative.');
      else if (o < 0)                    stop = t('Order cannot be negative.');
      else if (i === 0 && o === 0)       stop = t('Put a quantity in one of the boxes. Leave "Issue now" at 0 to order without issuing.');
      else if (i > 0 && !listed)         stop = t('This item is not on the stock list, so nothing can be issued from it.');
      else if (i > onShelf)              stop = t('Only') + ' ' + qty(onShelf) + ' ' + t(unit) + ' ' +
                                                t('on the shelf — issue that much at most, and order the rest.');

      if (btn){
        btn.disabled = !!stop;
        btn.classList.toggle('is-off', !!stop);
        btn.textContent = stop ? t('Issue and order')
          : (o === 0 ? t('Issue') + ' ' + qty(i) + ' ' + t('from stock')
          : (i === 0 ? t('Send') + ' ' + qty(o) + ' ' + t('to purchase')
                     : t('Issue') + ' ' + qty(i) + ' ' + t('and order') + ' ' + qty(o)));
      }
      if (why){ why.textContent = stop; why.classList.toggle('show', !!stop); }
    };
    if (issueBox) issueBox.addEventListener('input', checkStore);
    if (orderBox) orderBox.addEventListener('input', checkStore);
    checkStore();
  }

  on(root, '[data-pick]', 'keydown', function(e, tile){
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); tile.click(); }
  });
  on(root, '[data-pick]', 'click', function(e,t){
    root.querySelectorAll('[data-pick]').forEach(function(q){ q.classList.remove('sel'); });
    t.classList.add('sel'); picked = t.getAttribute('data-pick');
  });

  /* The counter-purchase quantity, watched as it is typed. Buying fewer
     than the indent asked for is ordinary and is spelled out — "8 bought of
     20, 12 remaining" — so nobody has to work out the shortfall in their
     head. Buying more is not a shortfall but a decision to stock up with
     cash outside every approval the indent passed, so the button dies. */
  function wireShopQty(box, ind){
    var qtyBox = box.querySelector('#sQty');
    var note   = box.querySelector('#sQtyNote');
    if (!qtyBox) return;
    var asked = Number(ind.quantity) || 0;
    var unit  = ind.unit || '';

    function check(){
      var raw = String(qtyBox.value).trim();
      var n = raw === '' ? asked : Number(raw);
      var stop = '';
      if (isNaN(n) || !isFinite(n)) stop = t('Quantity must be a number.');
      else if (n <= 0)              stop = t('Quantity must be more than zero.');
      else if (n > asked)           stop = t('The indent is for') + ' ' + qty(asked) + ' ' + t(unit) +
                                           ' — ' + t('you cannot buy more than was asked for.');

      if (note){
        if (stop){
          note.textContent = stop;
          note.style.color = '#BE123C';
        } else if (n < asked){
          note.textContent = qty(n) + ' ' + t('bought out of') + ' ' + qty(asked) + ', ' +
                             qty(asked - n) + ' ' + t('remaining');
          note.style.color = '#B45309';
        } else {
          note.textContent = t('The whole indent, bought over the counter.');
          note.style.color = '';
        }
      }
      var pb = root.querySelector('#purchaseBtn');
      if (pb){
        pb.disabled = !!stop;
        pb.classList.toggle('is-off', !!stop);
      }
    }
    qtyBox.addEventListener('input', check);
    qtyBox.addEventListener('change', check);
    check();
  }

  on(root, '[data-mode]', 'click', function(e, btn){
    if (btn.disabled) return;                 // a route the item's ceiling has shut
    root.querySelectorAll('[data-mode]').forEach(function(b){ b.classList.remove('on'); });
    btn.classList.add('on'); mode = btn.getAttribute('data-mode');
    var pb0 = root.querySelector('#purchaseBtn');
    if (pb0){ pb0.disabled = false; pb0.classList.remove('is-off'); }
    drawModeBox();
    var pb = root.querySelector('#purchaseBtn');
    if (pb) pb.textContent = mode === 'SHOP' ? t('Bought — send to station')
          : mode === 'DIRECT' ? t('Confirm purchase') : t('Send for approval');
  });
  function drawModeBox(){
    var box = root.querySelector('#modeBox'); if (!box) return;
    var vendorOpts = '<option value="">Select or type a new vendor…</option>' +
      (S.masters.vendors||[]).map(function(v){ return '<option value="'+esc(v.name)+'">'+esc(v.name)+'</option>'; }).join('');
    var vlistHtml = '<datalist id="vlist">'+(S.masters.vendors||[]).map(function(v){
        return '<option value="'+esc(v.name)+'">'; }).join('')+'</datalist>';
    var limit = Number(S.masters.directLimit || 0);
    var limitNote = limit > 0
      ? 'Anything above '+money(limit)+' still needs the admin to approve it.'
      : 'No approval needed — this goes straight to logistics.';

    if (mode === 'DIRECT'){
      box.innerHTML = vlistHtml +
        '<div class="route-note direct">⚡ <b>'+te('Your own authority.')+'</b> '+esc(limitNote)+'</div>'+
        '<div class="row two">'+
        '<label class="field"><span class="field-label">'+te('Vendor *')+'</span>'+
          '<input class="input" id="dVendor" list="vlist" placeholder="'+te('Vendor name')+'"></label>'+
        '<label class="field"><span class="field-label">'+te('Total amount *')+'</span>'+
          '<input class="input" id="dAmount" type="number" min="0" step="0.01" placeholder="0"></label></div>'+
        '<div class="row two"><label class="field"><span class="field-label">'+te('Brand')+'</span>'+
          '<input class="input" id="dBrand"></label>'+
        '<label class="field"><span class="field-label">'+te('Delivery days')+'</span>'+
          '<input class="input" id="dDays" type="number" min="0"></label></div>';
    } else if (mode === 'SHOP'){
      box.innerHTML = vlistHtml +
        '<div class="route-note direct">🛍️ <b>'+te('You already have the goods.')+'</b> '+
        'No approval, no ETA, no dispatch chasing — this jumps straight to '+
        '<b>Send to station</b>. Both photos are compulsory: they are the only record of the purchase.'+
        (limit > 0 ? ' Your limit is '+money(limit)+'.' : '')+'</div>'+
        '<div class="row two">'+
          '<label class="field"><span class="field-label">'+te('Shop / vendor *')+'</span>'+
            '<input class="input" id="sShop" list="vlist" placeholder="'+te('Where you bought it')+'"></label>'+
          '<label class="field"><span class="field-label">'+te('Amount paid *')+'</span>'+
            '<input class="input" id="sAmount" type="number" min="0" step="0.01"></label></div>'+
        '<div class="row three">'+
          '<label class="field"><span class="field-label">'+te('Quantity bought')+'</span>'+
            '<input class="input" id="sQty" inputmode="decimal" value="'+esc(d.indent.quantity)+'" '+
            'max="'+esc(String(d.indent.quantity))+'">'+
            '<span class="muted" id="sQtyNote">'+te('The shop may have had fewer. You can buy less than the indent asked for, never more.')+'</span></label>'+
          '<label class="field"><span class="field-label">'+te('Bill / cash memo no.')+'</span>'+
            '<input class="input" id="sBillNo"></label>'+
          '<label class="field"><span class="field-label">'+te('Brand')+'</span>'+
            '<input class="input" id="sBrand"></label></div>'+
        '<div class="row two">'+
          photoField('shopBill', '🧾 Bill photo *', 'The cash memo or invoice')+
          photoField('shopMaterial', '📦 Goods photo *', 'What you bought')+
        '</div>';
      wirePhotos(box);
      wireShopQty(box, d.indent);
    } else {
      box.innerHTML = '<datalist id="vlist">'+(S.masters.vendors||[]).map(function(v){
          return '<option value="'+esc(v.name)+'">'; }).join('')+'</datalist>'+
        '<div id="qRows"></div>'+
        '<button class="btn btn-ghost btn-sm" type="button" id="addQuote">+ Add another vendor</button>';
      var rows = box.querySelector('#qRows');
      var MAXQ = 5;
      function addRow(){
        var n = rows.querySelectorAll(':scope > .card').length + 1;
        if (n > MAXQ){ toast(t('Five quotations is the maximum'),'warn'); return; }
        rows.appendChild(h('<div class="card" style="padding:14px;margin-bottom:11px">'+
          '<div class="section-title" style="margin:0 0 10px">Quotation '+n+'</div>'+
          '<div class="row two">'+
            '<label class="field"><span class="field-label">'+te('Vendor *')+'</span>'+
              '<input class="input qv" list="vlist" placeholder="'+te('Vendor name')+'"></label>'+
            '<label class="field"><span class="field-label">'+te('Total amount *')+'</span>'+
              '<input class="input qt" type="number" min="0" step="0.01"></label></div>'+
          '<div class="row three">'+
            '<label class="field"><span class="field-label">'+te('Brand')+'</span><input class="input qb"></label>'+
            '<label class="field"><span class="field-label">'+te('Rate / unit')+'</span><input class="input qp" type="number" min="0" step="0.01"></label>'+
            '<label class="field"><span class="field-label">'+te('Delivery days')+'</span><input class="input qd" type="number" min="0"></label></div>'+
          '</div>'));
      }
      addRow(); addRow();
      box.querySelector('#addQuote').addEventListener('click', addRow);
    }
  }
  drawModeBox();

  var destSel = root.querySelector('#aDest');
  if (destSel) destSel.addEventListener('change', function(){
    root.querySelector('#hubBox').classList.toggle('hidden', destSel.value !== 'VIA_HUB');
  });

  var cancelBtn = root.querySelector('#cancelBtn');
  if (cancelBtn) cancelBtn.addEventListener('click', function(){
    promptDialog('Cancel indent ' + d.indent.id, 'Why are you cancelling it?', 'Reason', function(reason){
      return api('cancelIndent', { indentId:d.indent.id, remarks:reason }).then(function(){
        toast(t('Indent cancelled'),'ok'); closeOverlay('drawer');
        invalidateViews(); render(S.view, { fresh:true });
      });
    });
  });

  on(root, '[data-do]', 'click', function(e, btn){
    var act = btn.getAttribute('data-do');
    var id  = d.indent.id;
    var rem = (root.querySelector('#aRemarks') || {}).value || '';
    var call, msg;

    try {
      if (act === 'STORE'){
        var iv = (root.querySelector('#aIssue')||{}).value;
        var ov = (root.querySelector('#aOrder')||{}).value;
        var iN = String(iv||'').trim() === '' ? 0 : Number(iv);
        var oN = String(ov||'').trim() === '' ? 0 : Number(ov);
        call = api('storeAction', { indentId:id, issueQty:iv, orderQty:ov, remarks:rem });
        msg = oN === 0
          ? [t('Issued from stock'), t('The requester now has to confirm receipt')]
          : (iN === 0
              ? [t('Sent to purchase'), t('The purchase team has been queued')]
              : [t('Part issued, rest ordered'),
                 qty(iN) + ' ' + t('handed over now') + ' · ' + qty(oN) + ' ' + t('on order')]);
      }
      else if (act === 'PURCHASE' && mode === 'SHOP'){
        var sp = {
          indentId:id, remarks:rem,
          vendorName:(root.querySelector('#sShop')||{}).value,
          amount:(root.querySelector('#sAmount')||{}).value,
          quantity:(root.querySelector('#sQty')||{}).value,
          billNo:(root.querySelector('#sBillNo')||{}).value,
          brand:(root.querySelector('#sBrand')||{}).value,
          billPhoto: photo('shopBill'), materialPhoto: photo('shopMaterial')
        };
        if (!safeVal(sp.vendorName)) throw new Error(t('Enter the shop or vendor name.'));
        if (!Number(sp.amount)) throw new Error(t('Enter what you paid.'));
        if (!sp.billPhoto) throw new Error(t('Attach a photo of the bill.'));
        if (!sp.materialPhoto) throw new Error(t('Attach a photo of the goods.'));
        call = api('shopPurchase', sp);
        msg = [t('Purchase recorded'), t('Straight to send-to-station — no approval needed')];
      }
      else if (act === 'PURCHASE'){
        var p = { indentId:id, mode:mode, remarks:rem };
        if (mode === 'DIRECT'){
          p.vendorName = (root.querySelector('#dVendor')||{}).value;
          p.amount     = (root.querySelector('#dAmount')||{}).value;
          p.brand      = (root.querySelector('#dBrand')||{}).value;
          p.deliveryDays = (root.querySelector('#dDays')||{}).value;
          if (!p.vendorName) throw new Error(t('Enter the vendor name.'));
          if (!Number(p.amount)) throw new Error(t('Enter the purchase amount.'));
        } else {
          p.quotes = [];
          root.querySelectorAll('#qRows > .card').forEach(function(c){
            var v = c.querySelector('.qv').value.trim();
            var tot = c.querySelector('.qt').value;
            if (!v && !tot) return;
            p.quotes.push({ vendorName:v, totalAmount:tot, brand:c.querySelector('.qb').value,
                            pricePerUnit:c.querySelector('.qp').value, deliveryDays:c.querySelector('.qd').value });
          });
          if (!p.quotes.length) throw new Error(t('Fill in at least one quotation.'));
        }
        call = api('purchaseSubmit', p);
        msg = mode === 'DIRECT'
          ? [t('Purchase confirmed'), 'No approval needed — set the ETA next']
          : [t('Sent for approval'), t('The admin has been queued to choose')];
      }
      else if (act === 'APPROVE'){
        call = api('adminDecision', { indentId:id, decision:'APPROVE', quotationId:picked, remarks:rem });
        msg = [t('Approved'), t('Purchase can now set the ETA')];
      }
      else if (act === 'SEND_BACK'){
        call = api('adminDecision', { indentId:id, decision:'SEND_BACK', remarks:rem });
        msg = [t('Sent back'), t('Purchase will re-quote')];
      }
      else if (act === 'REJECT'){
        call = api('adminDecision', { indentId:id, decision:'REJECT', remarks:rem });
        msg = [t('Indent rejected'), ''];
      }
      else if (act === 'SET_ETA'){
        var eta = (root.querySelector('#aEta')||{}).value;
        if (!eta) throw new Error(t('Pick the estimated arrival date and time.'));
        call = api('setEta', { indentId:id, eta:new Date(eta).toISOString(),
          destinationType:(root.querySelector('#aDest')||{}).value,
          secondaryLocation:(root.querySelector('#aHub')||{}).value,
          transitEta:(root.querySelector('#aTransit')||{}).value
            ? new Date(root.querySelector('#aTransit').value).toISOString() : '',
          // whichever of the three slots were actually filled, in order
          photos: ['eta1','eta2','eta3'].map(photo).filter(Boolean),
          remarks:rem });
        msg = [t('ETA locked in'), t('The store team is watching for it')];
      }
      else if (act === 'DISPATCH'){
        call = api('dispatchUpdate', { indentId:id,
          dispatchStatus:(root.querySelector('#aDispatch')||{}).value, remarks:rem,
          billPhoto: photo('bill'), materialPhoto: photo('material') });
        msg = [t('Dispatch confirmed'), t('Now with the store to receive')];
      }
      else if (act === 'RECEIVE'){
        var qcA = (root.querySelector('#aQc')||{}).value;
        if (!qcA) throw new Error(t('Choose the quality along with the quantity.'));
        if (qcA !== 'PERFECT' && !rem) throw new Error(t('Describe the problem in the remarks.'));
        call = api('receiveCheck', { indentId:id, receivedQty:(root.querySelector('#aQty')||{}).value,
          qcResult:qcA, location:(root.querySelector('#aLoc')||{}).value, remarks:rem,
          photo: photo('receipt') });
        msg = d.indent.viaHub
          ? ['Checked in at the hub', 'Now send it on to the plant']
          : ['Received & checked', 'Straight to the requester — no station leg'];
      }
      else if (act === 'STATION'){
        var veh = (root.querySelector('#aVehicle')||{}).value;
        if (!veh) throw new Error(t('Enter the vehicle or dispatch details.'));
        call = api('sendToStation', { indentId:id, vehicleDetails:veh, remarks:rem });
        msg = [t('On its way to the plant'), t('It gets checked again on arrival')];
      }
      else if (act === 'PLANT_RECEIVE'){
        var qcB = (root.querySelector('#aQc')||{}).value;
        if (!qcB) throw new Error(t('Choose the quality along with the quantity.'));
        if (qcB !== 'PERFECT' && !rem) throw new Error(t('Describe the problem in the remarks.'));
        call = api('plantReceive', { indentId:id, qcResult:qcB,
          receivedQty:(root.querySelector('#aQty')||{}).value,
          location:(root.querySelector('#aLoc')||{}).value, remarks:rem,
          photo: photo('receipt') });
        msg = [t('Plant receipt recorded'), t('The requester can now confirm')];
      }
      else if (act === 'CONFIRM' && root.querySelector('#aGiveSeg')){
        var seg = root.querySelector('#aGiveSeg');
        var giving = seg.querySelector('[data-give="1"]').classList.contains('on');
        var payload = { indentId:id, givingAway: giving, remarks:rem };
        if (giving){
          payload.issuedToName = (root.querySelector('#aGiveTo')||{}).value;
          payload.receivedQty  = (root.querySelector('#aGiveQty')||{}).value;
          if (!String(payload.issuedToName||'').trim()) throw new Error(t('Choose who it is going to.'));
          if (String(payload.receivedQty||'').trim() === '') throw new Error(t('Enter how much they are taking.'));
        }
        call = api('confirmRequest', payload).then(function(res){
          msg = res.gaveAway
            ? [t('Indent closed'), qty(res.takenQty) + ' ' + t(d.indent.unit||'') + ' ' +
               t('issued to') + ' ' + res.issuedTo]
            : [t('Indent closed'), t('Nothing went out — it all stayed on the shelf')];
          return res;
        });
        msg = [t('Indent closed'), t('Full cycle complete')];
      }
      else if (act === 'CONFIRM'){
        var tookEl = root.querySelector('#aTook');
        var took = (tookEl||{}).value;
        if (String(took).trim() === '') throw new Error(t('Enter how much you are taking.'));
        if (isNaN(Number(took)) || Number(took) < 0) throw new Error(t('That is not a valid quantity.'));
        var cap = tookEl ? Number(tookEl.getAttribute('data-max')) : NaN;
        if (!isNaN(cap) && Number(took) > cap){
          throw new Error(t('You can take at most') + ' ' + qty(cap) + ' ' + t(d.indent.unit||'') + '.');
        }
        call = api('confirmRequest', { indentId:id, receivedQty:took, remarks:rem })
          .then(function(res){
            msg = res.leftOnShelf
              ? [t('Indent closed'), res.leftOnShelf + ' ' + t(d.indent.unit||'') + ' ' + t('left on the shelf')]
              : [t('Indent closed'), t('Full cycle complete')];
            return res;
          });
        msg = [t('Indent closed'), t('Full cycle complete')];
      }
      else return;
    } catch(ex){ toast(ex.message,'err'); return; }

    btn.disabled = true; busy(true);
    S._selfChange = true;
    clearTimeout(S._selfTimer);
    S._selfTimer = setTimeout(function(){ S._selfChange = false; }, 8000);
    var node = root.querySelector('.step.now .step-node');
    call.then(function(){
      busy(false);
      if (node) node.classList.add('flip');
      celebrate(msg[0], msg[1]);
      invalidateViews();
      closeOverlay('drawer');
      // refresh straight away, behind the celebration, instead of after it
      render(S.view, { silent:true, fresh:true }).then(function(){
        clearTimeout(S._selfTimer);
        S._selfChange = false;
        S.syncedVersion = S.version;
      });
    }).catch(function(ex){
      clearTimeout(S._selfTimer); S._selfChange = false;
      busy(false); btn.disabled = false; toast(ex.message, 'err');
    });
  });
}

/* ==================================================================
   Dialogs
   ================================================================== */
function showModal(html){
  var card = freshNode('modalCard', 'div', 'modal-card');
  card.innerHTML = html;
  el('modal').classList.remove('hidden');
  return card;
}
function confirmDialog(title, sub, run){
  var c = showModal('<h3 class="modal-title">'+esc(title)+'</h3><p class="modal-sub">'+esc(sub)+'</p>'+
    '<div class="modal-actions"><button class="btn btn-ghost" data-close="modal">'+te('Back')+'</button>'+
    '<button class="btn btn-rose btn-3d" id="okBtn">'+te('Yes, do it')+'</button></div>');
  c.querySelector('#okBtn').addEventListener('click', function(){
    busy(true);
    Promise.resolve(run()).then(function(){ closeOverlay('modal'); })
      .catch(function(e){ toast(e.message,'err'); })
      .then(function(){ busy(false); });
  });
}
function promptDialog(title, sub, label, run){
  var c = showModal('<h3 class="modal-title">'+esc(title)+'</h3><p class="modal-sub">'+esc(sub)+'</p>'+
    '<label class="field"><span class="field-label">'+esc(label)+'</span>'+
    '<textarea class="input" id="pVal"></textarea></label>'+
    '<div class="modal-actions"><button class="btn btn-ghost" data-close="modal">'+te('Cancel')+'</button>'+
    '<button class="btn btn-primary btn-3d" id="okBtn">'+te('Confirm')+'</button></div>');
  c.querySelector('#okBtn').addEventListener('click', function(){
    busy(true);
    Promise.resolve(run(c.querySelector('#pVal').value))
      .then(function(){ closeOverlay('modal'); })
      .catch(function(e){ toast(e.message,'err'); })
      .then(function(){ busy(false); });
  });
}

/* ---------------- PC: log a follow-up ---------------- */
function followupDialog(indentId){
  busy(true);
  api('getIndent', { indentId:indentId }).then(function(d){
    busy(false);
    var i = d.indent;
    var stepOpts = d.timeline.map(function(s){
      var tag = s.status === 'PENDING' ? ' ← stuck here' : s.status === 'DONE' ? ' (done)' :
                s.status === 'SKIPPED' ? ' (skipped)' : '';
      return '<option value="'+esc(s.key)+'"'+(s.status==='PENDING'?' selected':'')+'>'+
             s.no+'. '+esc(stageName(s.name))+tag+'</option>';
    }).join('');
    /* Whoever is holding this indent up goes to the top of the list — on a
       Newai indent that is the Newai storekeeper, not all four sites' worth
       of them. The rest stay underneath, because a follow-up call can
       legitimately go to anybody. */
    var owners = i.owners || [];
    var ownerIds = {};
    owners.forEach(function(p){ ownerIds[p.id] = true; });
    function personOpt(p){
      return '<option value="'+esc(p.name + (p.phone ? ' — ' + p.phone : ''))+'">';
    }
    var people = owners.map(personOpt).join('') +
      (S.masters.people||[]).filter(function(p){ return !ownerIds[p.id]; }).map(personOpt).join('');
    var vendors = (S.masters.vendors||[]).map(function(v){
      return '<option value="'+esc(v.name + (v.phone ? ' — ' + v.phone : ''))+'">';
    }).join('');

    var c = showModal(
      '<h3 class="modal-title">'+te('Log a follow-up')+'</h3>'+
      '<p class="modal-sub">'+esc(i.id)+' · '+esc(i.partName)+' · '+esc(siteText(i))+'</p>'+
      (owners.length
        ? '<div class="route-note direct">📞 <b>'+te('Holding it right now')+':</b> '+
            owners.map(function(p){
              return esc(p.name) + (p.phone ? ' <span class="muted">'+esc(p.phone)+'</span>' : '');
            }).join(', ')+
          '</div>'
        : '')+
      '<label class="field"><span class="field-label">'+te('Which step are you following up on? *')+'</span>'+
        '<select class="input" id="fStage">'+stepOpts+'</select></label>'+
      '<div class="row two">'+
        '<label class="field"><span class="field-label">'+te('Whom did you contact? *')+'</span>'+
          '<input class="input" id="fWhom" list="whomList" placeholder="'+te('Name')+'">'+
          '<datalist id="whomList">'+people+vendors+'</datalist></label>'+
        '<label class="field"><span class="field-label">'+te('Their phone')+'</span>'+
          '<input class="input" id="fPhone" placeholder="'+te('Optional')+'"></label>'+
      '</div>'+
      '<div class="row two">'+
        '<label class="field"><span class="field-label">'+te('How')+'</span>'+
          '<select class="input" id="fMode">'+['CALL','WHATSAPP','SMS','EMAIL','IN PERSON']
            .map(function(o){return '<option value="'+esc(o)+'">'+te(o)+'</option>';}).join('')+'</select></label>'+
        '<label class="field"><span class="field-label">'+te('Outcome')+'</span>'+
          '<select class="input" id="fOutcome">'+
            ['PENDING','PROMISED','DISPATCHED','NO RESPONSE','ESCALATED','RESOLVED']
            .map(function(o){return '<option value="'+esc(o)+'">'+te(o)+'</option>';}).join('')+'</select></label>'+
      '</div>'+
      '<label class="field"><span class="field-label">'+te('What did they say? *')+'</span>'+
        '<textarea class="input" id="fNotes" placeholder="'+te('Write their answer here')+'"></textarea></label>'+
      '<label class="check"><input type="checkbox" id="fRemind">'+
        '<span><b>'+te('Set a reminder for the next follow-up')+'</b>'+
        '<span>'+te('Your phone gets a notification with your note at the time you pick.')+'</span></span></label>'+
      '<div id="remBox" class="hidden" style="margin-top:14px">'+
        '<div class="card" style="background:linear-gradient(180deg,#F3EDFF,#fff);border:2px solid #8B5CF6">'+
          '<div class="section-title" style="margin:0 0 12px;color:#7C3AED">🔔 Reminder</div>'+
          '<label class="field"><span class="field-label">'+te('Remind me on *')+'</span>'+
            '<input class="input" id="fRemAt" type="datetime-local"></label>'+
          '<div style="display:flex;gap:7px;flex-wrap:wrap;margin:-6px 0 13px">'+
            [['+2 h',2],['+4 h',4],['Tomorrow 10 am',-1],['+2 days',48]].map(function(q){
              return '<button type="button" class="btn btn-ghost btn-sm" data-quick="'+q[1]+'">'+q[0]+'</button>';
            }).join('')+'</div>'+
          '<label class="field" style="margin-bottom:0"><span class="field-label">'+te('What do you have to do then? *')+'</span>'+
            '<textarea class="input" id="fRemNote" placeholder="'+te('e.g. Call Vinod again and get the Metso quote')+'"></textarea></label>'+
        '</div></div>'+
      '<div class="modal-actions"><button class="btn btn-ghost" data-close="modal">'+te('Cancel')+'</button>'+
      '<button class="btn btn-violet btn-3d" id="fSave">'+te('Save follow-up')+'</button></div>'
    );

    var chk = c.querySelector('#fRemind'), box = c.querySelector('#remBox');
    chk.addEventListener('change', function(){
      box.classList.toggle('hidden', !chk.checked);
      if (chk.checked && !c.querySelector('#fRemAt').value) setQuick(2);
    });
    function setQuick(hrs){
      var d2 = new Date();
      if (Number(hrs) === -1){ d2.setDate(d2.getDate()+1); d2.setHours(10,0,0,0); }
      else d2 = new Date(Date.now() + Number(hrs)*3600e3);
      var pad = function(n){ return String(n).padStart(2,'0'); };
      c.querySelector('#fRemAt').value = d2.getFullYear()+'-'+pad(d2.getMonth()+1)+'-'+pad(d2.getDate())+
        'T'+pad(d2.getHours())+':'+pad(d2.getMinutes());
    }
    on(c, '[data-quick]', 'click', function(e,t){ e.preventDefault(); setQuick(t.getAttribute('data-quick')); });

    c.querySelector('#fWhom').addEventListener('change', function(){
      var v = c.querySelector('#fWhom').value;
      var m = v.match(/—\s*(\d[\d\s\-]*)$/);
      if (m && !c.querySelector('#fPhone').value){
        c.querySelector('#fPhone').value = m[1].trim();
        c.querySelector('#fWhom').value = v.split('—')[0].trim();
      }
    });

    c.querySelector('#fSave').addEventListener('click', function(){
      var p = {
        indentId: i.id,
        stageKey: c.querySelector('#fStage').value,
        calledWhom: c.querySelector('#fWhom').value.trim(),
        calledWhomPhone: c.querySelector('#fPhone').value.trim(),
        contactMode: c.querySelector('#fMode').value,
        outcome: c.querySelector('#fOutcome').value,
        notes: c.querySelector('#fNotes').value.trim(),
        reminderSet: chk.checked
      };
      if (chk.checked){
        var v = c.querySelector('#fRemAt').value;
        if (!v){ toast(t('Pick the reminder date and time'),'err'); return; }
        p.reminderAt = new Date(v).toISOString();
        p.reminderNote = c.querySelector('#fRemNote').value.trim();
      }
      busy(true);
      api('addFollowup', p).then(function(r){
        busy(false); closeOverlay('modal');
        if (r.warning) toast(r.warning, 'warn');
        celebrate(t('Follow-up saved'), p.reminderSet ? 'Reminder set — your phone will alert you' : '');
        invalidateViews();
        if (S.drawerId === i.id) refreshDrawer(i.id); else render(S.view, { silent:true, fresh:true });
      }).catch(function(e){ busy(false); toast(e.message,'err'); });
    });
  }).catch(function(e){ busy(false); toast(e.message,'err'); });
}

function userDialog(u){
  // NOTE: the option VALUES stay in English — they are codes the server
  // matches on. Only the labels are translated.
  var roles = ['ADMIN','STORE','PURCHASE','PC','USER'];
  var sites = (S.masters.sites || []);
  var langs = (S.masters.languages || [{code:'EN',native:'English'},{code:'HI',native:'हिन्दी'}]);
  var role  = u ? u.role : 'USER';

  function siteOptions(forRole){
    var bound = ['USER','STORE'].indexOf(forRole) !== -1;
    if (!bound){
      return '<option value="ALL">'+te('All sites')+'</option>';
    }
    return '<option value="">'+te('— not set —')+'</option>'+
      sites.map(function(x){
        return '<option'+(u && u.site === x ? ' selected' : '')+'>'+esc(x)+'</option>';
      }).join('');
  }

  var c = showModal('<h3 class="modal-title">'+te(u ? 'Edit user' : 'Add user')+'</h3>'+
    '<p class="modal-sub">'+te(u ? 'Leave the PIN blank to keep the current one.'
                                 : 'They sign in with this ID and PIN.')+'</p>'+
    '<div class="row two">'+
      '<label class="field"><span class="field-label">'+te('User ID *')+'</span>'+
        '<input class="input" id="uId" '+(u?'readonly':'')+' value="'+esc(u?u.id:'')+'"></label>'+
      '<label class="field"><span class="field-label">'+te('Full name *')+'</span>'+
        '<input class="input" id="uName" value="'+esc(u?u.name:'')+'"></label></div>'+
    '<div class="row two">'+
      '<label class="field"><span class="field-label">'+te('Role *')+'</span><select class="input" id="uRole">'+
        roles.map(function(r){
          return '<option value="'+r+'"'+(role===r?' selected':'')+'>'+te(r)+'</option>';
        }).join('')+
      '</select></label>'+
      '<label class="field"><span class="field-label">'+te('Site *')+'</span>'+
        '<select class="input" id="uSite">'+siteOptions(role)+'</select>'+
        '<span class="muted" id="uSiteHint"></span></label></div>'+
    '<div class="row two">'+
      '<label class="field"><span class="field-label">'+te('Phone')+'</span><input class="input" id="uPhone" value="'+esc(u?u.phone:'')+'"></label>'+
      '<label class="field"><span class="field-label">'+te('Google e-mail (needed for reminders)')+'</span>'+
        '<input class="input" id="uEmail" value="'+esc(u?u.email:'')+'"></label></div>'+
    '<div class="row two">'+
      '<label class="field"><span class="field-label">'+te('Language')+'</span><select class="input" id="uLang">'+
        langs.map(function(l){
          return '<option value="'+esc(l.code)+'"'+((u&&u.lang===l.code)?' selected':'')+'>'+esc(l.native)+'</option>';
        }).join('')+
      '</select></label>'+
      '<label class="field"><span class="field-label">'+te('Status')+'</span><select class="input" id="uActive">'+
        '<option value="true"'+(!u||u.active?' selected':'')+'>'+te('Active')+'</option>'+
        '<option value="false"'+(u&&!u.active?' selected':'')+'>'+te('Deactivated')+'</option></select></label></div>'+
    '<label class="field"><span class="field-label">'+te('PIN')+'</span>'+
      '<input class="input" id="uPin" placeholder="'+te(u?'unchanged':'1234')+'"></label>'+
    '<div class="modal-actions"><button class="btn btn-ghost" data-close="modal">'+te('Cancel')+'</button>'+
    '<button class="btn btn-primary btn-3d" id="okBtn">'+te('Save user')+'</button></div>');

  function syncSite(){
    var r = c.querySelector('#uRole').value;
    var bound = ['USER','STORE'].indexOf(r) !== -1;
    c.querySelector('#uSite').innerHTML = siteOptions(r);
    c.querySelector('#uSite').disabled = !bound;
    c.querySelector('#uSiteHint').textContent = bound
      ? t('They can only raise and handle indents for this site.')
      : t('This role works across all four sites.');
  }
  c.querySelector('#uRole').addEventListener('change', syncSite);
  syncSite();

  c.querySelector('#okBtn').addEventListener('click', function(){
    busy(true);
    api('saveUser', {
      id:c.querySelector('#uId').value.trim(), name:c.querySelector('#uName').value.trim(),
      role:c.querySelector('#uRole').value, site:c.querySelector('#uSite').value,
      lang:c.querySelector('#uLang').value,
      phone:c.querySelector('#uPhone').value.trim(), email:c.querySelector('#uEmail').value.trim(),
      pin:c.querySelector('#uPin').value.trim(), active:c.querySelector('#uActive').value === 'true'
    }).then(function(){ closeOverlay('modal'); toast(t('User saved'),'ok'); invalidateViews(); render(S.view, { fresh:true }); })
      .catch(function(e){ toast(e.message,'err'); })
      .then(function(){ busy(false); });
  });
}

/* ==================================================================
   Celebration
   ================================================================== */
function celebrate(title, sub){
  el('celebrateTitle').textContent = title;
  el('celebrateSub').textContent = sub || '';
  var c = el('celebrate');
  c.classList.remove('hidden');
  confettiBurst();
  setTimeout(function(){ c.classList.add('hidden'); }, 1300);
}
function confettiBurst(){
  var cv = el('confetti');
  var ctx = null;
  try { ctx = cv.getContext && cv.getContext('2d'); } catch (e) { ctx = null; }
  if (!ctx) return;                     // canvas unavailable — the badge still animates
  var W = cv.width = window.innerWidth, H = cv.height = window.innerHeight;
  var colours = ['#6366F1','#14B8A6','#0EA5E9','#8B5CF6','#F59E0B','#10B981','#F43F5E','#D946EF'];
  var bits = [];
  for (var i = 0; i < 130; i++){
    bits.push({
      x: W/2 + (Math.random()-0.5)*160, y: H/2 + (Math.random()-0.5)*80,
      vx: (Math.random()-0.5)*13, vy: -Math.random()*15 - 4,
      s: 5 + Math.random()*8, r: Math.random()*Math.PI,
      vr: (Math.random()-0.5)*0.32, c: colours[(Math.random()*colours.length)|0],
      shape: Math.random() > 0.5 ? 'r' : 'c'
    });
  }
  var frames = 0;
  (function loop(){
    ctx.clearRect(0,0,W,H);
    bits.forEach(function(b){
      b.x += b.vx; b.y += b.vy; b.vy += 0.42; b.vx *= 0.995; b.r += b.vr;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r);
      ctx.fillStyle = b.c; ctx.globalAlpha = Math.max(0, 1 - frames/95);
      if (b.shape === 'r') ctx.fillRect(-b.s/2, -b.s/2, b.s, b.s * 0.62);
      else { ctx.beginPath(); ctx.arc(0, 0, b.s/2, 0, Math.PI*2); ctx.fill(); }
      ctx.restore();
    });
    if (++frames < 95) requestAnimationFrame(loop);
    else ctx.clearRect(0,0,W,H);
  })();
}
