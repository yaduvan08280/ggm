  });

  var mute = root.querySelector('#tgMute');
  if (mute) mute.addEventListener('click', function(){
    busy(true);
    api('telegramMute', { muted: /Mute/.test(mute.textContent) })
      .then(function(){ busy(false); invalidateViews(); render('notify', { fresh:true }); })
      .catch(function(e){ busy(false); toast(e.message,'err'); });
  });

  var unlink = root.querySelector('#tgUnlink');
  if (unlink) unlink.addEventListener('click', function(){
    confirmDialog('Disconnect Telegram?', 'You will stop getting notifications on your phone.', function(){
      return api('telegramUnlink').then(function(){ toast(t('Disconnected'),'ok'); render('notify'); });
    });
  });

  var save = root.querySelector('#tgSave');
  if (save) save.addEventListener('click', function(){
    var p = { enabled: root.querySelector('#tgOn').checked,
              appUrl: root.querySelector('#tgUrl').value.trim() };
    var tok = root.querySelector('#tgToken').value.trim();
    if (tok) p.botToken = tok;
    busy(true);
    api('tgConfig', p).then(function(){ busy(false); toast(t('Saved'),'ok'); invalidateViews(); render('notify', { fresh:true }); })
      .catch(function(e){ busy(false); toast(e.message,'err'); });
  });

  var reset = root.querySelector('#tgReset');
  if (reset) reset.addEventListener('click', function(){
    confirmDialog('Stop all bot chatter?',
      'Removes the webhook and throws away every message Telegram still has queued. '+
      'Use this if the bot is repeating itself. Nobody gets disconnected.', function(){
      return api('tgReset').then(function(r){
        toast('Reset done — ' + r.dropped + ' queued message(s) dropped', 'ok');
        invalidateViews(); render('notify', { fresh:true });
      });
    });
  });

  var saveEv = root.querySelector('#tgSaveEvents');
  if (saveEv) saveEv.addEventListener('click', function(){
    var evs = {};
    root.querySelectorAll('[data-ev]').forEach(function(c){ evs[c.getAttribute('data-ev')] = c.checked; });
    busy(true);
    api('tgConfig', { events: evs }).then(function(){ busy(false); toast(t('Saved'),'ok'); })
      .catch(function(e){ busy(false); toast(e.message,'err'); });
  });
}

/* ==================================================================
   Wiring per view
   ================================================================== */
function wire(view, root){
  on(root, '[data-go]', 'click', function(e,t){ render(t.getAttribute('data-go')); });
  on(root, '[data-open]', 'click', function(e,t){
    if (e.target.closest('[data-act],[data-followup],[data-resched],[data-cancelrem]')) return;
    openIndent(t.getAttribute('data-open'));
  });
  on(root, '[data-act]', 'click', function(e,t){ e.stopPropagation(); openIndent(t.getAttribute('data-act'), true); });
  on(root, '[data-followup]', 'click', function(e,t){ e.stopPropagation(); followupDialog(t.getAttribute('data-followup')); });
  on(root, '[data-resched]', 'click', function(e,t){ e.stopPropagation(); rescheduleDialog(t.getAttribute('data-resched')); });
  on(root, '[data-cancelrem]', 'click', function(e,t){
    e.stopPropagation();
    confirmDialog('Cancel this reminder?', 'You will not be notified about it.', function(){
      return api('cancelReminder', { reminderId: t.getAttribute('data-cancelrem') })
        .then(function(){ toast(t('Reminder cancelled'),'ok'); invalidateViews(); render(S.view, { fresh:true }); });
    });
  });
  on(root, '[data-scope]', 'click', function(e,t){ listState.scope = t.getAttribute('data-scope'); render(S.view); });
  on(root, '[data-unfilter]', 'click', function(e,t){
    var k = t.getAttribute('data-unfilter');
    if (k === 'all') clearListFilters(); else listState[k] = '';
    render(S.view);
  });
  on(root, '[data-tile]', 'click', function(e,t){
    var go = {};
    try { go = JSON.parse(t.getAttribute('data-tile')); } catch(x){ return; }
    clearListFilters();
    pcFilter.health = '';
    if (go.view === 'pcboard'){
      pcFilter.health = go.health || '';
    } else {
      listState.scope  = go.scope  || '';
      listState.health = go.health || '';
      listState.status = go.status || '';

  var q = root.querySelector('#q');

  var hq = root.querySelector('#hq');
  if (hq) debounceInput(hq, function(v){ histFilter.q = v; render(S.view); });

  if (view === 'new') wireNewForm(root);
  if (view === 'notify') wireNotify(root);
  if (view === 'vendors'){
    var b = root.querySelector('#addVendorBtn');
    if (b) b.addEventListener('click', vendorDialog);
  }
  /* The date range bar is the same on three screens, so it is wired once.
     A preset redraws straight away; a custom span waits until both ends
     are filled in, otherwise the server would only refuse it. */
  var RANGE_STATE = { 'data-stockrange':[stockFilter,'stock'],
                      'data-ledgerrange':[ledgerFilter,'ledger'],
                      'data-moverange':[moveFilter,'movements'] };
  Object.keys(RANGE_STATE).forEach(function(attr){
    var pair = RANGE_STATE[attr], st = pair[0], v = pair[1];
    on(root, '['+attr+']', 'click', function(e,t){
      st.range = t.getAttribute(attr);
      if (st.range !== 'CUSTOM'){ st.from = ''; st.to = ''; }
      render(v, { fresh:true });
    });
  });
  on(root, '[data-rangefrom],[data-rangeto]', 'change', function(e,t){
    var attr = t.getAttribute('data-rangefrom') || t.getAttribute('data-rangeto');
    var pair = RANGE_STATE[attr];
    if (!pair) return;
    var st = pair[0];
    if (t.hasAttribute('data-rangefrom')) st.from = t.value; else st.to = t.value;
    if (st.from && st.to) render(pair[1], { fresh:true });
  });

  if (view === 'stock'){
    var ai = root.querySelector('#addItemBtn');
    if (ai) ai.addEventListener('click', function(){ itemDialog(null); });
    on(root, '[data-edititem]', 'click', function(e,t){
      itemDialog(JSON.parse(t.getAttribute('data-edititem')));
    });
    on(root, '[data-stocksite]', 'click', function(e,t){
      stockFilter.site = t.getAttribute('data-stocksite');
      stockFilter.bands = []; stockFilter.section = '';
      render('stock', { fresh:true });

    // the tiles are buttons, so the keyboard must reach them too
    on(root, '[data-band]', 'keydown', function(e,t){
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); t.click(); }
    });
    on(root, '[data-band]', 'click', function(e,t){
      var b = t.getAttribute('data-band');

      else toggleStockBand(b);

    on(root, '[data-unband]', 'click', function(e,t){
      var b = t.getAttribute('data-unband');

    var ss2 = root.querySelector('#sSection');
    if (ss2) ss2.addEventListener('change', function(){

  if (view === 'ledger'){
    on(root, '[data-ledgersite]', 'click', function(e,t){
      ledgerFilter.site = t.getAttribute('data-ledgersite');
      ledgerFilter.code = '';                  // item codes do not cross sites
      render('ledger', { fresh:true });

    var li = root.querySelector('#lItem');

    });

  if (view === 'movements'){
    on(root, '[data-movesite]', 'click', function(e,t){
      moveFilter.site = t.getAttribute('data-movesite');
      render('movements', { fresh:true });
    });
    var mq = root.querySelector('#mq');
    if (mq) debounceInput(mq, function(v){ moveFilter.q = v; render('movements', { fresh:true }); });
  }
  if (view === 'reorder'){
    on(root, '[data-reordersite]', 'click', function(e,t){
      reorderFilter.site = t.getAttribute('data-reordersite');
      render('reorder', { fresh:true });
    });
    on(root, '[data-reorderitem]', 'click', function(e,t){
      var it = {};
      try { it = JSON.parse(t.getAttribute('data-reorderitem')); } catch(x){ return; }
      PREFILL = it;                            // the new-indent form picks this up
      render('new');
    });
  }
  if (view === 'transfers'){
    var stb = root.querySelector('#sendTrfBtn');
    if (stb) stb.addEventListener('click', function(){
      // the dialog needs this site's item list, so make sure it is loaded
      busy(true);
      api('transfers', {}).then(function(d){
        return loadStock(d.site).then(function(){ busy(false); sendTransferDialog(d); });
      }).catch(function(e){ busy(false); toast(e.message, 'err'); });
    });
    on(root, '[data-receivetrf]', 'click', function(e, n){
      receiveTransferDialog(JSON.parse(n.getAttribute('data-receivetrf')));
    });
    on(root, '[data-canceltrf]', 'click', function(e, n){
      cancelTransferDialog(n.getAttribute('data-canceltrf'));
    });
    on(root, '[data-trfsite]', 'click', function(e, n){
      trfFilter.site = n.getAttribute('data-trfsite');
      render('transfers', { fresh:true });
    });
    var tq = root.querySelector('#tq');
    if (tq) debounceInput(tq, function(v){ trfFilter.q = v; render('transfers', { fresh:true }); });
  }
  if (view === 'itemreq'){
    on(root, '[data-reqstatus]', 'click', function(e,t){
      itemReqFilter.status = t.getAttribute('data-reqstatus');
      render('itemreq', { fresh:true });
    });
    on(root, '[data-approveitem]', 'click', function(e,t){
      decideItemDialog(t.getAttribute('data-approveitem'), true);
    });
    on(root, '[data-rejectitem]', 'click', function(e,t){
      decideItemDialog(t.getAttribute('data-rejectitem'), false);
    });
  }
  if (view === 'users'){
    var a = root.querySelector('#addUserBtn');
    if (a) a.addEventListener('click', function(){ userDialog(null); });
    on(root, '[data-edituser]', 'click', function(e,t){
      userDialog(JSON.parse(t.getAttribute('data-edituser')));
    });

  if (view === 'settings'){
    on(root, '.role-toggle', 'click', function(e, b){
      var now = !b.classList.contains('on');
      b.classList.toggle('on', now);
      b.setAttribute('aria-pressed', now);
    });
    var st = root.querySelector('#saveTat');
    if (st) st.addEventListener('click', function(){
      var map = {}, roles = {};
      root.querySelectorAll('[data-tat]').forEach(function(i){ map[i.getAttribute('data-tat')] = Number(i.value)||0; });
      root.querySelectorAll('.role-toggle').forEach(function(b){
        var k = b.getAttribute('data-stage');
        roles[k] = roles[k] || [];
        if (b.classList.contains('on')) roles[k].push(b.getAttribute('data-role'));
      });
      busy(true);
      api('saveStages', { tat: map, roles: roles })
        .then(function(r){
          if (S.masters && r && r.stages) S.masters.stages = r.stages;
          invalidateViews();
          toast(t('Steps saved'),'ok');

        .catch(function(e){ toast(e.message,'err'); })
        .then(function(){ busy(false); });

    var ss = root.querySelector('#saveSettings');
    if (ss) ss.addEventListener('click', function(){
      var items = [];

      busy(true);
      api('saveSettings', { items: items }).then(function(){ toast(t('Settings saved'),'ok'); })
        .catch(function(e){ toast(e.message,'err'); })
        .then(function(){ busy(false); });
    });
  }
}
function debounceInput(input, fn){
  var timer;
  input.addEventListener('input', function(){
    clearTimeout(timer);
    var v = input.value;
    timer = setTimeout(function(){ fn(v); }, 420);
  });
}

/* ---------------- new-indent form ---------------- */
/** What the reorder list handed over, to be poured into the next new
 *  indent form and then forgotten. */
var PREFILL = null;

function wireNewForm(root){
  clearPhotos();
  wirePhotos(root);

  var form = root.querySelector('#newForm');
  if (!form) return;                       // the "no site yet" card has no form

  function currentSite(){
    var sel = root.querySelector('#siteSel');
    if (sel) return sel.value;
    var fixed = root.querySelector('#siteFixed');
    return fixed ? fixed.getAttribute('data-site') : mySite();
  }

  // stock list for whichever site the form is on. The unit dropdown is
  // rebuilt once it arrives, because the site's own unit names ("Ltr",
  // "Pcs") are only known then.
  function refreshUnits(){
    var u = root.querySelector('#unitSel');
    if (!u) return;
    var keep = u.value;
    u.innerHTML = unitOptions(keep);
    if (keep) selectUnit(u, keep);
  }
  loadStock(currentSite()).then(function(){ refreshUnits(); fillItemList(); applyPrefill(); itemSync('name'); });

  /* Arriving from the reorder list: the item, its unit, its section and the
     suggested quantity are already known, so the form opens filled in and
     the person only has to look it over. It is used once and dropped, so a
     later visit to this screen starts blank. */
  function applyPrefill(){
    if (!PREFILL) return;
    var pre = PREFILL; PREFILL = null;
    function set(field, v){
      var n = form.elements[field];
      if (n && v !== undefined && v !== '') n.value = v;
    }
    var siteSel2 = root.querySelector('#siteSel');
    if (siteSel2 && pre.site){
      siteSel2.value = pre.site;
      var sec2 = root.querySelector('#sectionSel');
      if (sec2) sec2.innerHTML = sectionOptions(pre.site, pre.section);
    }
    set('partName', pre.name);
    set('partNumber', pre.partNumber);
    // both came from the item list itself, so neither should be rewritten
    ['partName','partNumber'].forEach(function(k){
      var n = form.elements[k];
      if (n && n.value) n.dataset.touched = '1';
    });
    set('quantity', pre.qty ? qty(pre.qty) : '');
    set('description', t('Raised from the reorder list — the shelf is at or below its reorder point.'));
    var u2 = root.querySelector('#unitSel');
    if (u2 && pre.unit){ selectUnit(u2, pre.unit); u2.dataset.touched = '1'; }
    var sec3 = root.querySelector('#sectionSel');
    if (sec3 && pre.section){ sec3.value = pre.section; sec3.dataset.touched = '1'; }
    fillItemList();
  }

  /* Either box drives the other. `touched` marks a box the person typed in
     themselves, so filling one in never overwrites what they wrote in the
     other — it only fills a box they left alone. */
  function pairUp(id, which){
    var box = root.querySelector('#' + id);
    if (!box) return;
    var deb = null;
    box.addEventListener('input', function(){
      box.dataset.touched = box.value.trim() ? '1' : '';
      clearTimeout(deb);
      deb = setTimeout(function(){ itemSync(which); }, 120);
    });
    box.addEventListener('change', function(){ itemSync(which); });
  }
  pairUp('partName',   'name');
  pairUp('partNumber', 'part');

  var secSel = root.querySelector('#sectionSel');
  if (secSel) secSel.addEventListener('change', function(){
    // naming a section is a choice the item must not override; clearing it
    // back to the site itself is the opposite — it says "you decide"
    secSel.dataset.touched = secSel.value ? '1' : '';
    fillItemList();
    itemSync('name');
  });

  var unitSel = root.querySelector('#unitSel');
  if (unitSel){
    unitSel.addEventListener('change', function(){
      unitSel.dataset.touched = '1';               // their choice wins from here on
      var hint = root.querySelector('#unitHint');
      if (hint) hint.textContent = '';
    });
  }

  var siteSel = root.querySelector('#siteSel');
  if (siteSel){
    siteSel.addEventListener('change', function(){
      var sec = root.querySelector('#sectionSel');
      if (sec){ sec.innerHTML = sectionOptions(siteSel.value); sec.dataset.touched = ''; }
      loadStock(siteSel.value).then(function(){ refreshUnits(); fillItemList(); itemSync('name'); });
    });
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var f = e.target, p = {};
    ['partName','partNumber','quantity','unit','priority','section','description'].forEach(function(k){
      p[k] = f.elements[k] ? f.elements[k].value.trim() : '';
    });
    p.site = currentSite();
    if (photo('indent')) p.photo = photo('indent');
    var btn = root.querySelector('#newBtn');
    btn.disabled = true; btn.querySelector('span').textContent = t('Submitting…');
    busy(true);
    api('createIndent', p).then(function(d){
      busy(false);
      celebrate(t('Indent raised'), d.indentId + ' ' + t('has gone to the store team'));
      invalidateViews();
      var still = sessionGuard();
      setTimeout(function(){ if (still()) render('mine', { fresh:true }); }, 900);
    }).catch(function(ex){
      busy(false); toast(ex.message, 'err');
      btn.disabled = false; btn.querySelector('span').textContent = t('Submit indent');
    });
  });
}

/* ==================================================================
   Photo fields — reusable, with in-browser downscaling so a 6 MB phone
   snap travels as ~200 KB instead of blowing the request size limit.
   ================================================================== */
var PHOTOS = {};                       // key -> {data, mimeType, name}

function photoField(key, label, hint){
  return '<div class="field"><span class="field-label">'+esc(label)+'</span>'+
    '<div class="photo-drop" data-photo="'+esc(key)+'">'+
      '<div class="photo-inner"><div style="font-size:26px">📷</div>'+
      '<div style="font-weight:700;margin-top:5px">'+te('Tap to attach')+'</div>'+
      (hint ? '<div class="muted">'+esc(hint)+'</div>' : '')+'</div>'+
    '</div>'+
    '<input type="file" accept="image/*" capture="environment" data-photoinput="'+esc(key)+'" style="display:none">'+
  '</div>';
}

/** Wire every photo field inside `root`. Safe to call on a fresh node only. */
function wirePhotos(root){
  on(root, '[data-photo]', 'click', function(e, t){
    var key = t.getAttribute('data-photo');
    var inp = root.querySelector('[data-photoinput="'+key+'"]');
    if (inp) inp.click();
  });
  root.querySelectorAll('[data-photoinput]').forEach(function(inp){
    inp.addEventListener('change', function(){
      var key = inp.getAttribute('data-photoinput');
      var f = inp.files && inp.files[0];
      if (!f) return;
      if (!/^image\//.test(f.type)){ toast(t('That is not an image file'),'err'); inp.value=''; return; }
      if (f.size > 50 * 1024 * 1024){ toast(t('That photo is over 50 MB — please use a smaller one'),'err'); inp.value=''; return; }
      var box = root.querySelector('[data-photo="'+key+'"]');
      box.classList.add('busy');
      shrinkImage(f).then(function(out){
        PHOTOS[key] = { data: out.base64, mimeType: out.mimeType, name: f.name || 'photo.jpg' };
        box.classList.remove('busy');
        box.classList.add('has');
        box.querySelector('.photo-inner').innerHTML =
          '<img src="'+out.dataUrl+'" alt="">'+
          '<div style="font-weight:700;margin-top:8px">'+esc(f.name || 'photo')+'</div>'+
          '<div class="muted">'+Math.round(out.bytes/1024)+' KB · tap to change</div>';
      }).catch(function(){
        box.classList.remove('busy');
        toast(t('Could not read that photo'),'err');
      });
    });
  });
}

function clearPhotos(){ PHOTOS = {}; }
function photo(key){ return PHOTOS[key] || null; }

/** Downscale to at most 1600px on the long edge and re-encode as JPEG. */
function shrinkImage(file){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onerror = rej;
    fr.onload = function(){
      var dataUrl = String(fr.result);
      var img = new Image();
      img.onerror = function(){
        // no decoder (or a canvas-less environment) — send the original bytes
        var b64 = dataUrl.split(',')[1] || '';
        res({ base64:b64, mimeType:file.type||'image/jpeg', dataUrl:dataUrl, bytes:b64.length*0.75 });
      };
      img.onload = function(){
        try {
          var MAX = 1600;
          var w = img.width, h = img.height;
          var scale = Math.min(1, MAX / Math.max(w, h));
          var cv = document.createElement('canvas');
          cv.width = Math.max(1, Math.round(w * scale));
          cv.height = Math.max(1, Math.round(h * scale));
          var cx = cv.getContext('2d');
          if (!cx) throw new Error('no canvas');
          cx.drawImage(img, 0, 0, cv.width, cv.height);
          var out = cv.toDataURL('image/jpeg', 0.82);
          var b64 = out.split(',')[1];
          res({ base64:b64, mimeType:'image/jpeg', dataUrl:out, bytes:b64.length*0.75 });
        } catch(e){
          var b0 = dataUrl.split(',')[1] || '';
          res({ base64:b0, mimeType:file.type||'image/jpeg', dataUrl:dataUrl, bytes:b0.length*0.75 });
        }
      };
      img.src = dataUrl;
    };
    fr.readAsDataURL(file);
  });
}

/* ==================================================================
   Indent drawer
   ================================================================== */
var _drawerSeq = 0;
/* An indent opened again while NOTHING has changed anywhere (same data
   version) goes up at once from memory, and is re-checked quietly behind it.
   Any change at all — anyone's — retires the copy, so it is never stale. */
var DRAWER_CACHE = {};
function rememberDrawer(id, d){ if (S.version) DRAWER_CACHE[id] = { v: String(S.version), d: d }; }

function paintDrawer(id, d, focusAction){
  S.drawerId = id;
  // a brand-new node each time: listeners from the previous indent
  // cannot survive and fire against the wrong record
  var wasOpen = !el('drawer').classList.contains('hidden');
  var panel = freshNode('drawerPanel', 'aside', 'drawer-panel');
  panel.removeAttribute('data-loading');
  if (wasOpen) panel.style.animation = 'none';   // already on screen: no re-entry slide
  var html = drawerHtml(d);
  panel.setAttribute('data-html', html);
  panel.innerHTML = html;
  if (!wasOpen) el('drawer').classList.remove('hidden');
  wireDrawer(d);
  if (focusAction){
    var a = el('drawerPanel').querySelector('#actionPanel');
    if (a) setTimeout(function(){ a.scrollIntoView({ behavior:'smooth', block:'center' }); }, 380);
  }
}

function openIndent(id, focusAction){
  var seq = ++_drawerSeq;
  var hit = DRAWER_CACHE[id];
  if (hit && S.version && hit.v === String(S.version)){
    paintDrawer(id, hit.d, focusAction);
    refreshDrawer(id);
    return;
  }
  // If a different indent is already on screen, clear it at once. Leaving the
  // previous one visible while the new data loads makes people act on the
  // wrong record.
  if (!el('drawer').classList.contains('hidden') && S.drawerId !== id){
    var wait = freshNode('drawerPanel', 'aside', 'drawer-panel');
    wait.style.animation = 'none';
    wait.innerHTML = drawerSkeleton(id);
  }
  // Whatever is on screen right now is one fetch out of date. Say so, so that
  // neither a person nor a script can act on a stale view.
  el('drawerPanel').setAttribute('data-loading', '1');
  S.drawerId = id;
  busy(true);
  api('getIndent', { indentId:id }).then(function(d){
    busy(false);                             // balance the busy(true) above, always
    rememberDrawer(id, d);
    if (seq !== _drawerSeq) return;          // a newer open won the race
    paintDrawer(id, d, focusAction);
  }).catch(function(e){
    busy(false);
    if (seq !== _drawerSeq) return;
    var pn = el('drawerPanel'); if (pn) pn.removeAttribute('data-loading');
    toast(e.message,'err');
  });
}
function closeOverlay(which){
  var n = el(which); if (n) n.classList.add('hidden');
  if (which === 'drawer'){ S.drawerId = null; _drawerSeq++; }
}

      '<div style="font-size:11.5px;font-weight:800;letter-spacing:.09em;opacity:.85">'+esc(id)+'</div>'+
      '<div style="font-size:22px;font-weight:800;margin-top:3px">'+te('Loading…')+'</div>'+
    '</div>'+
    '<div class="drawer-body">'+
      '<div class="skel" style="height:132px"></div>'+
      '<div class="skel" style="height:88px;margin-top:14px"></div>'+
      '<div class="skel" style="height:88px;margin-top:14px"></div>'+
    '</div>';
}

      '<div style="font-size:22px;font-weight:800;margin-top:3px;letter-spacing:-.02em">'+esc(i.partName)+'</div>'+

        '<span class="chip" style="background:rgba(255,255,255,.22);color:#fff">'+esc(statusLabel(i.status))+'</span>'+

            '<div class="shot-meta">'+esc(a.stageName)+'</div>'+
            '<div class="shot-meta">'+esc(a.by)+' · '+fmtDT(a.at)+'</div>'+

      (d.stock.length ? '<div class="section-title">'+te('Stock movement')+'</div>'+
        '<div class="tablewrap"><table><thead><tr><th>'+te('When')+'</th><th>'+te('Type')+'</th><th>'+te('Qty')+'</th><th>'+te('Where')+'</th><th>By</th></tr></thead><tbody>'+
        d.stock.map(function(s){ return '<tr><td>'+fmtDT(s.at)+'</td><td>'+esc(s.type)+'</td><td>'+esc(s.qty)+'</td>'+
          '<td>'+esc(s.location)+'</td><td>'+esc(s.actor)+'</td></tr>'; }).join('')+'</tbody></table></div>' : '')+
      (canFollowUp() ? '<div class="section-title">'+te('Follow-ups')+'</div>'+

function canFollowUp(){ return S.user.role === 'PC' || S.user.role === 'ADMIN'; }

/** The live shelf figure for this indent's item, as an HTML value. */
function stockLine(s){
  if (!s) return '';
  if (!s.known){
    return '<span class="stock-tag new">'+te('New item — not on the stock list')+'</span>';
  }
  var band = s.band || 'HEALTHY';
  var cls = band === 'OUT' ? 'out'
          : (band === 'CRITICAL' || band === 'LOW' || band === 'WATCH') ? 'low' : 'ok';
  var body = qty(s.stock) + ' ' + te(s.unit) +
             (s.section ? ' · ' + esc(s.section) : '') +
             (s.reorderPoint ? ' · ' + te('reorder at') + ' ' + qty(s.reorderPoint) : '');
  return '<span class="stock-tag '+cls+'">'+ body +
         (band === 'HEALTHY' ? '' : ' · ' + te(bandOf(band).word)) + '</span>';
}

function detailsCard(d){
  var i = d.indent, kv = [];
  kv.push([t('Raised by'), i.requestedBy + ' · ' + fmtDT(i.timestamp)]);
  // the storekeeper is the one deciding whether to issue, so put the shelf
  // figure right under who asked for it
  if (i.stockNow) kv.push([t('In stock now') + ' · ' + esc(i.stockNow.site || i.site),
                           stockLine(i.stockNow), true]);
  if (i.requestedQty && String(i.requestedQty).trim() !== String(i.quantity).trim()){
    kv.push([t('Asked for'), i.requestedQty + ' ' + t(i.unit||'')]);
    kv.push([t('Ordered'), i.quantity + ' ' + t(i.unit||'') + ' — ' + t('the store raised it to keep stock in hand')]);
  }
  if (i.requesterReceivedQty !== '' && i.requesterReceivedQty !== undefined){
    if (i.restocking){
      // a restocking indent went onto the shelf; this says what left it again
      kv.push([t('Issued to'), i.issuedToName
        ? (esc(i.issuedToName) + ' · ' + qty(i.requesterReceivedQty) + ' ' + te(i.unit||''))
        : '<span class="muted">' + te('nobody — it all stayed on the shelf') + '</span>', true]);
    } else {
      var kept = Number(i.quantity) - Number(i.requesterReceivedQty);
      kv.push([t('Taken by the requester'), i.requesterReceivedQty + ' ' + t(i.unit||'') +
        (kept > 0 ? ' · ' + qty(kept) + ' ' + t('left on the shelf') : '')]);
    }
  }
  /* Both halves of a split, each linking to the other. A shortfall nobody
     can find is the same as a shortfall nobody recorded. */
  if (i.parent){
    kv.push([t('Carried over from'),
      '<button class="btn btn-ghost btn-sm" data-open="'+esc(i.parent.id)+'">'+esc(i.parent.id)+'</button> '+
      '<span class="muted">'+esc(i.splitReason || '')+'</span>', true]);
  }
  if (i.remainders && i.remainders.length){
    kv.push([t(i.remainders.length === 1 ? 'The rest went to' : 'The rest went to'),
      i.remainders.map(function(r){
        return '<button class="btn btn-ghost btn-sm" data-open="'+esc(r.id)+'">'+esc(r.id)+'</button> '+
               '<span class="muted">'+qty(r.quantity)+' '+te(r.unit||'')+' · '+
               esc(statusLabel(r.status))+'</span>';
      }).join('<br>'), true]);
  }
  if (i.partNumber) kv.push([t('Part number'), i.partNumber]);
  if (i.description) kv.push([t('Purpose'), i.description]);
  if (i.priority && i.priority !== 'NORMAL') kv.push([t('Priority'), i.priority]);
  if (i.storeAction) kv.push([t('Store action'), statusLabel(i.storeAction) + (i.issuedQty ? ' · ' + i.issuedQty : '')]);
  if (i.purchaseMode) kv.push([t('Purchase mode'), statusLabel(i.purchaseMode) + (i.purchaser ? ' · ' + i.purchaser : '')]);
  if (i.finalVendor) kv.push([t('Vendor'), i.finalVendor + (i.finalAmount ? ' · ' + money(i.finalAmount) : '')]);
  if (i.approvedBy) kv.push([
      i.approvalRoute === 'DIRECT_NO_APPROVAL' ? 'Purchased under own authority'
    : i.approvalRoute === 'SHOP_PURCHASE'      ? 'Counter purchase'
    : 'Approved by',
      i.approvedBy + ' · ' + fmtDT(i.approvedAt)]);
  if (i.shopName) kv.push([t('Shop'), i.shopName + (i.shopBillNo ? ' · bill ' + i.shopBillNo : '')]);
  if (i.eta) kv.push([t('Expected arrival'), fmtDT(i.eta)]);
  if (i.destinationType) kv.push([t('Route'), i.destinationType === 'VIA_HUB'
      ? ('Via ' + i.secondaryLocation + (i.transitEta ? ' (transit ' + fmtDT(i.transitEta) + ')' : '') + ' → ' + i.primaryLocation)
      : ('Direct to ' + (i.primaryLocation || i.plant))]);
  if (i.dispatchStatus) kv.push([t('Dispatch'), i.dispatchStatus]);
  if (i.vehicleDetails) kv.push([t('Vehicle'), i.vehicleDetails]);
  if (i.billPhotoUrl || i.materialPhotoUrl) kv.push([t('Dispatch photos'),
      [i.billPhotoUrl ? 'bill' : '', i.materialPhotoUrl ? 'material' : '']
        .filter(Boolean).join(' + ') + ' attached']);
  if (i.firstReceiptLocation) kv.push([i.viaHub ? 'First check (hub)' : 'Receipt check',
      i.firstReceiptLocation + ' · ' + i.firstReceivedQty + ' · ' + i.firstQcResult +
      (i.firstQcRemarks ? ' — ' + i.firstQcRemarks : '') +
      (i.firstReceivedAt ? ' · ' + fmtDT(i.firstReceivedAt) : '')]);
  if (i.viaHub && i.finalReceiptLocation) kv.push([t('Second check (plant)'),
      i.finalReceiptLocation + ' · ' + i.receivedQty + ' · ' + i.qcResult +
      (i.qcRemarks ? ' — ' + i.qcRemarks : '')]);
  if (!i.viaHub && !i.firstReceiptLocation && i.receivedQty) kv.push([t('Received qty'), i.receivedQty]);
  if (!i.viaHub && !i.firstReceiptLocation && i.qcResult)
      kv.push([t('Quality'), i.qcResult + (i.qcRemarks ? ' — ' + i.qcRemarks : '')]);
  if (i.confirmedBy) kv.push([t('Closed by'), i.confirmedBy]);
  if (i.totalCycleMins !== '') kv.push([t('Total time taken'), fmtDur(i.totalCycleMins)]);
  if (i.totalDelayMins !== '' && Number(i.totalDelayMins) > 0) kv.push([t('Total delay'), fmtDur(i.totalDelayMins)]);
  if (i.remarks) kv.push([t('Remarks'), i.remarks]);

  // a third element marks a value that is already safe HTML
  return '<div class="card"><dl class="kv">'+ kv.map(function(r){
      return '<dt>'+esc(r[0])+'</dt><dd>'+(r[2] ? r[1] : esc(r[1]))+'</dd>';
    }).join('') +'</dl>'+
    (i.photoUrl ? '<div style="margin-top:14px"><a class="btn btn-ghost btn-sm" target="_blank" href="'+esc(i.photoUrl)+'">'+te('View photo')+'</a></div>' : '')+
    '</div>';
}

function stepHtml(s){
  var cls = s.status === 'DONE' ? 'done' : s.status === 'PENDING' ? 'now' : s.status === 'SKIPPED' ? 'skip' : '';
  if (s.status === 'PENDING' && s.delayMins > 0) cls += ' late';
  var icon = s.status === 'DONE' ? '✓' : s.status === 'SKIPPED' ? '–' : s.no;
  var times = '';
  if (s.enteredAt) times += '<span class="tstamp">Started <b>'+fmtDT(s.enteredAt)+'</b></span>';
  if (s.plannedAt && s.status !== 'SKIPPED') times += '<span class="tstamp">Due <b>'+fmtDT(s.plannedAt)+'</b></span>';
  if (s.completedAt) times += '<span class="tstamp good">Done <b>'+fmtDT(s.completedAt)+'</b></span>';
  if (s.durationMins !== null && s.durationMins !== undefined && s.status !== 'NOT_STARTED' && s.status !== 'SKIPPED')
    times += '<span class="tstamp">'+(s.status==='DONE'?'Took ':'Sitting ')+'<b>'+fmtDur(s.durationMins)+'</b></span>';
  if (s.delayMins > 0) times += '<span class="tstamp late">'+fmtDur(s.delayMins)+' late</span>';

  return '<div class="step '+cls+'" data-step="'+esc(s.key)+'">'+
    '<div class="spine"></div>'+
    '<div class="step-node">'+icon+'</div>'+
    '<div class="step-body">'+
      '<div class="step-name">'+esc(stageName(s.name))+
        (s.ownerRoles && s.ownerRoles.length ? s.ownerRoles : [s.ownerRole]).map(function(r){
          return '<span class="role-pill role-'+esc(r)+'">'+esc(t(r))+'</span>';
        }).join('')+
        (s.completedBy ? '<span class="muted" style="font-weight:600">by '+esc(s.completedBy)+'</span>' : '')+
        (s.status === 'SKIPPED' ? '<span class="pill h-CLOSED">'+te('Skipped')+'</span>' : '')+
      '</div>'+
      (times ? '<div class="step-times">'+times+'</div>'
             : '<div class="muted" style="margin-top:5px">'+
               (s.status === 'SKIPPED' ? 'Not needed for this route' : 'Not reached yet')+'</div>')+
      (s.note ? '<div class="step-note">“'+esc(s.note)+'”</div>' : '')+
    '</div></div>';
}

function quoteHtml(q, selectable){

    (q.remarks ? '<div class="muted" style="margin-top:7px">'+esc(q.remarks)+'</div>' : '')+

}

function followupHtml(f){

/* ==================================================================
   Action panels (one per stage)
   ================================================================== */
/* ------------------------------------------------------------------
   One vendor, one tile, everything on it.
   ------------------------------------------------------------------
   The admin is choosing between vendors, and a choice made on a vendor
   name and a total alone is not a choice — it is a guess. So every field
   the purchase team filled in shows here: the brand, how many, the rate
   per unit, what it comes to, how long it takes and whatever note they
   left, plus who entered it and when. Two badges do the arithmetic
   nobody should have to do in their head — which is cheapest, and which
   arrives first — because those are almost never the same tile.
   ------------------------------------------------------------------ */
function quoteTile(q, ind, cheapest, fastest, howMany){
  var qtyN   = Number(q.quantity) || Number(ind.quantity) || 0;
  var rate   = Number(q.pricePerUnit) || (qtyN ? q.totalAmount / qtyN : 0);
  var days   = Number(q.deliveryDays);
  var isBest = howMany > 1 && q.totalAmount === cheapest;
  var isFast = howMany > 1 && isFinite(days) && days > 0 && days === fastest && !isBest;
  var over   = (howMany > 1 && cheapest > 0 && q.totalAmount > cheapest)
                 ? q.totalAmount - cheapest : 0;

  function row(label, value){
    if (value === '' || value === undefined || value === null) return '';
    return '<div class="q-line"><span>'+te(label)+'</span><b>'+value+'</b></div>';
  }

  return '<div class="quote'+(isBest?' best':'')+'" data-pick="'+esc(q.id)+'" '+
           'role="button" tabindex="0">'+
    '<div class="quote-top">'+
      '<div><div class="quote-vendor">'+esc(q.vendor)+'</div>'+
        (q.brand ? '<div class="muted">'+esc(q.brand)+'</div>' : '')+
      '</div>'+
      '<div style="text-align:right">'+
        '<div class="quote-amt">'+money(q.totalAmount)+'</div>'+
        (over > 0 ? '<div class="muted">+'+money(over)+' '+te('over the lowest')+'</div>' : '')+
      '</div>'+
    '</div>'+
    (isFast ? '<span class="pill h-ON_TIME" style="margin:8px 0 0">'+te('Arrives first')+'</span>' : '')+
    '<div class="q-lines">'+
      row('Quantity', qty(qtyN) + ' ' + te(ind.unit || ''))+
      row('Rate per unit', rate ? money(Math.round(rate * 100) / 100) : '')+
      row('Total', money(q.totalAmount))+
      row('Delivery', (isFinite(days) && days > 0)
            ? (qty(days) + ' ' + te(days === 1 ? 'day' : 'days'))
            : (q.deliveryDays ? esc(q.deliveryDays) : '<span class="muted">'+te('not stated')+'</span>'))+
      row('Note', q.remarks ? esc(q.remarks) : '')+
    '</div>'+
    '<div class="muted" style="margin-top:9px;font-size:11.5px">'+
      te('Entered by')+' '+esc(q.createdBy || '—')+
      (q.createdAt ? ' · '+fmtDT(q.createdAt) : '')+
    '</div>'+
  '</div>';
}

function actionPanel(d){
  var i = d.indent, k = i.currentStage;
  var stepName = (k === 'CONFIRM_REQUEST' && i.restocking)
    ? t('Close the restocking indent') : stage(k).name;
  var head = '<div class="card" style="border:2px solid #6366F1;background:linear-gradient(180deg,#EEF0FF,#fff)">'+
    '<div class="section-title" style="margin:0 0 12px;color:#4F46E5">'+
      te('Step')+' '+i.currentStageNo+' · '+esc(stepName)+' — '+te('your action')+'</div>';
  var end = '</div>';

  if (k === 'STORE_VERIFY'){
    /* One decision, two numbers. Pre-filled with the sensible split: hand
       over as much as the shelf can cover, order whatever is short. */
    var sn    = i.stockNow || { known:false, stock:0, unit:i.unit };
    var want  = Number(i.quantity) || 0;
    var have  = sn.known ? Number(sn.stock) || 0 : 0;
    var canIssue = sn.known ? Math.min(want, have) : 0;
    var mustOrder = Math.max(0, want - canIssue);

    return head +
      '<p class="muted" style="margin-top:0">'+te('Hand over what you have and order what you do not. Either box may be 0.')+'</p>'+
      '<div class="shelf-read '+(sn.known ? (have > 0 ? 'ok' : 'out') : 'new')+'" id="aShelf" '+
        'data-listed="'+(sn.known?'1':'0')+'" data-stock="'+esc(String(have))+'">'+
        (sn.known
          ? te('On the shelf at') + ' ' + esc(i.site || '') + ': <b>' + qty(have) + ' ' + te(sn.unit||'') + '</b>'
          : '⚠ ' + te('This item is not on the stock list, so nothing can be issued from it.'))+
      '</div>'+
      /* An item nobody has listed is the store's to name and to file. Once
         it IS listed the name is the key its whole ledger hangs off, so the
         rename disappears and only Stock can change it. */
      (sn.known ? '' :
        '<div class="toolbar" style="margin:-6px 0 14px">'+
          '<button class="btn btn-ghost btn-sm" data-relabel="'+esc(i.id)+'">'+
            te('Correct the name')+'</button>'+
          '<button class="btn btn-primary btn-sm btn-3d" data-listit="'+esc(i.id)+'">'+
            te('+ Add it to the item list')+'</button>'+
          '<span class="muted">'+te('Adding it lets the stock be tracked from here on. The indent carries on either way.')+'</span>'+
        '</div>')+
      '<div class="row two">'+
        '<label class="field"><span class="field-label">'+te('Issue now from the shelf')+'</span>'+
          '<input class="input" id="aIssue" inputmode="decimal" value="'+esc(String(canIssue))+'"'+
          (sn.known ? '' : ' disabled')+'>'+
          '<span class="muted">'+te('Handed over today. Cannot be more than the shelf holds.')+'</span></label>'+
        '<label class="field"><span class="field-label">'+te('Order from purchase')+'</span>'+
          '<input class="input" id="aOrder" inputmode="decimal" value="'+esc(String(sn.known?mustOrder:want))+'">'+
          '<span class="muted">'+te('Sent on to the purchase team. Raise it to keep stock in hand.')+'</span></label>'+
      '</div>'+
      '<label class="field"><span class="field-label">'+te('Remarks')+'</span>'+
        '<textarea class="input" id="aRemarks" placeholder="'+te('Anything the next person should know')+'"></textarea></label>'+
      '<button class="btn btn-emerald btn-3d btn-block" data-do="STORE" id="aStoreBtn">'+
        te('Issue and order')+'</button>'+
      '<div class="why" id="aWhy"></div>' + end;
  }

  if (k === 'PURCHASE_MODE'){
    /* The item's own ceiling, against the WHOLE indent — never against the
       slice somebody means to buy today, or a 200-unit order with a ceiling
       of 50 could be walked through the shop four times over. Above it the
       purchase team has no authority of its own, so both self-service routes
       are shut and only quotations remain. */
    var ceil = (i.stockNow && Number(i.stockNow.maxOrderQty)) || 0;
    var want = Number(i.quantity) || 0;
    var capped = ceil > 0 && want > ceil;
    var shut = capped
      ? ' disabled title="'+te('Over the maximum order quantity for this item')+'"' : '';

    return head +
    (capped
      ? '<div class="route-note hub" id="capNote">🔒 <b>'+
          te('This indent is over the item\'s maximum order quantity.')+'</b> '+
          te('It is for')+' '+qty(want)+' '+te(i.unit||'')+', '+te('and the ceiling is')+' '+
          qty(ceil)+'. '+
          te('Neither a direct purchase nor a counter purchase is open to you here — raise quotations and let the administrator approve it.')+
        '</div>'
      : '')+
    '<div class="seg" style="margin-bottom:14px">'+
      '<button class="on" data-mode="COMPETITIVE">'+te('Compare quotes')+'</button>'+
      '<button data-mode="DIRECT" class="'+(capped?'is-off':'')+'"'+shut+'>'+te('Direct purchase')+'</button>'+
      '<button data-mode="SHOP" class="'+(capped?'is-off':'')+'"'+shut+'>🛍️ '+te('Direct from shop')+'</button></div>'+
    '<div id="modeBox"></div>'+
    '<label class="field" style="margin-top:6px"><span class="field-label">'+te('Remarks')+'</span>'+
      '<textarea class="input" id="aRemarks"></textarea></label>'+
    '<button class="btn btn-primary btn-3d" data-do="PURCHASE" id="purchaseBtn">'+te('Send for approval')+'</button>' + end;
  }

  if (k === 'ADMIN_APPROVAL'){
    var pend = d.quotes.filter(function(q){ return q.status === 'PENDING'; });
    var min = Math.min.apply(null, pend.map(function(q){ return q.totalAmount; }));
    var fastest = Math.min.apply(null, pend.map(function(q){
      var n = Number(q.deliveryDays); return isFinite(n) && n > 0 ? n : Infinity;
    }));
    return head +
      '<p class="muted" style="margin-top:0">'+
        te('Everything the purchase team entered, one tile per vendor. Pick the one you are approving.')+
      '</p>'+
      '<div class="grid" style="gap:11px">'+ pend.map(function(q){
        return quoteTile(q, i, min, fastest, pend.length);
      }).join('') +'</div>'+
      '<label class="field" style="margin-top:14px"><span class="field-label">'+te('Remarks')+'</span>'+
        '<textarea class="input" id="aRemarks" placeholder="'+te('Why this vendor')+'"></textarea></label>'+
      '<div style="display:flex;gap:10px;flex-wrap:wrap">'+
        '<button class="btn btn-emerald btn-3d" data-do="APPROVE">'+te('Approve selected')+'</button>'+
        '<button class="btn btn-amber btn-3d" data-do="SEND_BACK">'+te('Send back for re-quote')+'</button>'+
        '<button class="btn btn-rose btn-3d" data-do="REJECT">'+te('Reject indent')+'</button>'+
      '</div>' + end;
  }

  if (k === 'SET_ETA') return head +
    '<div class="row two">'+
      '<label class="field"><span class="field-label">'+te('Estimated arrival *')+'</span>'+
        '<input class="input" id="aEta" type="datetime-local" required></label>'+
      '<label class="field"><span class="field-label">'+te('Route')+'</span>'+
        '<select class="input" id="aDest"><option value="DIRECT_TO_PLANT">'+te('Direct to plant')+'</option>'+
        '<option value="VIA_HUB">'+te('Via an intermediate hub')+'</option></select></label>'+
    '</div>'+
    '<div id="hubBox" class="hidden"><div class="row two">'+
      '<label class="field"><span class="field-label">'+te('Hub name *')+'</span>'+
        '<input class="input" id="aHub" placeholder="'+te('e.g. Jaipur office')+'"></label>'+
      '<label class="field"><span class="field-label">'+te('Hub arrival (transit ETA)')+'</span>'+
        '<input class="input" id="aTransit" type="datetime-local"></label></div></div>'+
    '<div class="section-title" style="margin-top:4px">'+te('Photos')+'</div>'+
    '<p class="muted" style="margin:-6px 0 12px">'+
      te('The transport docket, the lorry number plate, the packing list — whatever you have. All optional.')+
    '</p>'+
    '<div class="row three">'+
      photoField('eta1', '📷 '+t('Photo 1'), t('e.g. the transport docket'))+
      photoField('eta2', '📷 '+t('Photo 2'), t('e.g. the lorry number plate'))+
      photoField('eta3', '📷 '+t('Photo 3'), t('e.g. the packing list'))+
    '</div>'+
    '<label class="field"><span class="field-label">'+te('Remarks')+'</span><textarea class="input" id="aRemarks"></textarea></label>'+
    '<button class="btn btn-violet btn-3d" data-do="SET_ETA">'+te('Save ETA & route')+'</button>' + end;

  if (k === 'FOLLOW_UP') return head +
    '<label class="field"><span class="field-label">'+te('Dispatch status')+'</span>'+
      '<select class="input" id="aDispatch">'+
        ['Dispatched','In transit','Sample delivered','Partially dispatched','Delayed by vendor']
        .map(function(o){return '<option value="'+esc(o)+'">'+te(o)+'</option>';}).join('')+
      '</select></label>'+
    '<div class="row two">'+
      photoField('bill',     '🧾 Bill / invoice photo', 'The vendor bill or challan')+
      photoField('material', '📦 Material photo',       'What was actually dispatched')+
    '</div>'+
    '<label class="field"><span class="field-label">'+te('Remarks')+'</span><textarea class="input" id="aRemarks"></textarea></label>'+
    '<button class="btn btn-sky btn-3d" data-do="DISPATCH">'+te('Confirm dispatch')+'</button>' + end;

  if (k === 'RECEIVE_CHECK'){
    var atHub = i.viaHub;
    var where = atHub ? (i.secondaryLocation || 'the hub') : (i.primaryLocation || i.plant);
    return head +
      '<div class="route-note '+(atHub?'hub':'direct')+'">'+
        (atHub
          ? '🚚 Routed <b>via ' + esc(i.secondaryLocation) + '</b>. This is the <b>first</b> check — '+
            'do it at the hub. It will be checked again when it reaches ' + esc(i.primaryLocation || i.plant) + '.'
          : '🏭 Shipped <b>direct to ' + esc(where) + '</b>. This is the <b>only</b> check — '+
            'there is no station leg for this consignment.')+
      '</div>'+
      '<div class="row two">'+
        '<label class="field"><span class="field-label">'+te('Quantity received *')+'</span>'+
          '<input class="input" id="aQty" value="'+esc(i.quantity)+'"></label>'+
        '<label class="field"><span class="field-label">'+te('Quality *')+'</span>'+
          '<select class="input" id="aQc"><option value="">'+te('Choose…')+'</option>'+
          '<option>'+te('PERFECT')+'</option><option>'+te('PARTIAL')+'</option><option>'+te('DEFECTIVE')+'</option></select></label></div>'+
      '<label class="field"><span class="field-label">'+(atHub?'Received at (hub)':'Received at')+'</span>'+
        '<input class="input" id="aLoc" value="'+esc(where)+'"></label>'+
      photoField('receipt', '📸 Photo of the goods received',
                 atHub ? 'As unloaded at the hub' : 'As unloaded at the plant')+
      '<label class="field"><span class="field-label">'+te('Remarks (required if not perfect)')+'</span>'+
        '<textarea class="input" id="aRemarks" placeholder="'+te('Condition, shortfall, damage…')+'"></textarea></label>'+
      '<button class="btn btn-amber btn-3d" data-do="RECEIVE">'+
        (atHub ? 'Record hub receipt &amp; check' : 'Record receipt &amp; check')+'</button>' + end;
  }

  if (k === 'SEND_TO_STATION') return head +
    '<div class="route-note hub">📦 Checked at <b>'+esc(i.firstReceiptLocation || i.secondaryLocation)+'</b>'+
      (i.firstReceivedQty ? ' — '+esc(i.firstReceivedQty)+' received, '+esc(i.firstQcResult||'')  : '')+
      '. Now send it on to '+esc(i.primaryLocation || i.plant)+'.</div>'+
    '<label class="field"><span class="field-label">'+te('Vehicle / dispatch details *')+'</span>'+
      '<input class="input" id="aVehicle" placeholder="'+te('e.g. RJ14 GA 4471 — driver Ramesh')+'" required></label>'+
    '<label class="field"><span class="field-label">'+te('Remarks')+'</span><textarea class="input" id="aRemarks"></textarea></label>'+
    '<button class="btn btn-amber btn-3d" data-do="STATION">'+te('Sent to station')+'</button>' + end;

  if (k === 'PLANT_RECEIVE') return head +
    '<div class="route-note hub">🔁 <b>'+te('Second check.')+'</b> '+esc(i.firstReceiptLocation||'The hub')+
      ' received '+esc(i.firstReceivedQty||'—')+' ('+esc(i.firstQcResult||'—')+') on '+fmtDT(i.firstReceivedAt)+
      '. Confirm what actually arrived at '+esc(i.primaryLocation || i.plant)+'.</div>'+
    '<div class="row two">'+
      '<label class="field"><span class="field-label">'+te('Quantity received at plant *')+'</span>'+
        '<input class="input" id="aQty" value="'+esc(i.firstReceivedQty || i.quantity)+'"></label>'+
      '<label class="field"><span class="field-label">'+te('Quality *')+'</span>'+
        '<select class="input" id="aQc"><option value="">'+te('Choose…')+'</option>'+
        '<option>'+te('PERFECT')+'</option><option>'+te('PARTIAL')+'</option><option>'+te('DEFECTIVE')+'</option></select></label></div>'+
    '<label class="field"><span class="field-label">'+te('Received at')+'</span>'+
      '<input class="input" id="aLoc" value="'+esc(i.primaryLocation || i.plant)+'"></label>'+
    photoField('receipt', '📸 Photo of the goods at the plant', 'As unloaded at the plant')+
    '<label class="field"><span class="field-label">'+te('Remarks (required if not perfect)')+'</span>'+
      '<textarea class="input" id="aRemarks"></textarea></label>'+
    '<button class="btn btn-emerald btn-3d" data-do="PLANT_RECEIVE">Record plant receipt &amp; check</button>' + end;

  /* A restocking indent closes with a different question, because a
     different thing happened: the goods are on the shelf and the usual
     answer is that they stay there. */
  if (k === 'CONFIRM_REQUEST' && i.restocking) return head + restockClosePanel(i) + end;

  if (k === 'CONFIRM_REQUEST'){
    var askedQ  = i.requestedQty || i.quantity;
    var avail   = (i.availableQty === undefined || i.availableQty === '')
                    ? Number(i.quantity) || 0 : Number(i.availableQty);
    var prefill = Math.min(Number(askedQ) || 0, avail);
    var issuedQ = Number(i.issuedQty) || 0;
    var moreOrdered = String(i.quantity).trim() !== String(askedQ).trim();
    return head +
      '<p class="muted" style="margin-top:0">'+te('Confirm you have physically received this item. That closes the indent.')+'</p>'+
      (issuedQ > 0
        ? '<div class="route-note direct">📦 <b>'+qty(issuedQ)+' '+te(i.unit||'')+'</b> '+
            te('was handed to you at the store.')+
            (avail > issuedQ ? ' ' + te('The rest came in with the delivery.') : '')+
          '</div>'
        : (moreOrdered
          ? '<div class="route-note hub">📦 '+
              te('You asked for')+' <b>'+esc(askedQ)+' '+te(i.unit||'')+'</b>, '+
              te('and')+' <b>'+esc(i.quantity)+'</b> '+te('was ordered so the store could keep some in hand.')+
              '<br>'+te('Tell us what you are taking — the rest stays on the shelf.')+
            '</div>'
          : ''))+
      '<label class="field"><span class="field-label">'+te('How much are you taking? *')+'</span>'+
        '<input class="input" id="aTook" inputmode="decimal" value="'+esc(String(prefill))+'" '+
        'data-max="'+esc(String(avail))+'">'+
        '<span class="muted">'+te('This comes off the store figure, so put in what you really took.')+
        ' '+te('At most')+' '+qty(avail)+' '+te(i.unit||'')+'.</span></label>'+
      '<label class="field"><span class="field-label">'+te('Remarks')+'</span>'+
        '<textarea class="input" id="aRemarks" placeholder="'+te('Anything to note')+'"></textarea></label>'+
      '<button class="btn btn-emerald btn-3d" data-do="CONFIRM">'+te('Yes, received — close indent')+'</button>' + end;
  }

  return '';
}

/* ------------------------------------------------------------------
   Closing a restocking indent
   ------------------------------------------------------------------
   The storekeeper ordered twenty washers to put on the shelf. They are on
   the shelf. So the question is not "how many did you take" — it is
   whether any of them went straight back out to somebody, and that is a
   plain yes or no. No closes the indent and nothing moves.

   Yes is a real issue to a named person. The quantity is deliberately not
   bounded by what this indent ordered — there may have been four on the
   shelf already, and handing out twenty-four is perfectly honest. It IS
   bounded by the shelf, because you cannot give away what is not there.
   ------------------------------------------------------------------ */
function restockClosePanel(i){
  var unit    = i.unit || '';
  var ceiling = Number(i.giveCeiling) || 0;
  var onShelf = Number(i.onShelf) || 0;
  var issuedQ = Number(i.issuedQty) || 0;
  var people  = i.people || { here: [], elsewhere: [] };

  function opt(u){
    return '<option value="'+esc(u.name)+'">'+esc(u.name)+
           ' — '+esc(t(u.role))+(u.allSites ? '' : ' · '+esc(u.site))+'</option>';
  }
  var names = '<option value="">'+te('Choose a name…')+'</option>'+
    (people.here.length
      ? '<optgroup label="'+esc(i.site||'')+'">'+people.here.map(opt).join('')+'</optgroup>' : '')+
    (people.elsewhere.length
      ? '<optgroup label="'+te('Everyone else')+'">'+people.elsewhere.map(opt).join('')+'</optgroup>' : '');

  return '<p class="muted" style="margin-top:0">'+
      te('You raised this to put stock on the shelf, and it is there now.')+'</p>'+
    '<div class="route-note direct">📦 '+
      te('On the shelf at')+' '+esc(i.site||'')+': <b>'+qty(onShelf)+' '+te(unit)+'</b>'+
      (issuedQ ? ' · '+qty(issuedQ)+' '+te('was handed over at the store') : '')+
    '</div>'+
    '<div class="field"><span class="field-label">'+te('Is any of it going to someone? *')+'</span>'+
      '<div class="seg" id="aGiveSeg">'+
        '<button type="button" data-give="0" class="on">'+te('No — it stays on the shelf')+'</button>'+
        '<button type="button" data-give="1">'+te('Yes, give some out')+'</button>'+
      '</div></div>'+
    '<div id="aGiveBox" class="hidden">'+
      '<label class="field"><span class="field-label">'+te('Who is taking it? *')+'</span>'+
        '<select class="input" id="aGiveTo">'+names+'</select>'+
        '<span class="muted">'+te('Their name goes on the item ledger against this quantity.')+'</span></label>'+
      '<label class="field"><span class="field-label">'+te('How much? *')+'</span>'+
        '<input class="input" id="aGiveQty" inputmode="decimal" value="" '+
        'data-max="'+esc(String(ceiling))+'" placeholder="'+te('e.g.')+' '+qty(Math.min(ceiling, Number(i.quantity)||ceiling))+'">'+
        '<span class="muted" id="aGiveNote">'+
          te('It can be more or less than this indent ordered — but never more than the shelf holds.')+
          ' '+te('At most')+' '+qty(ceiling)+' '+te(unit)+'.</span></label>'+
    '</div>'+
    '<label class="field"><span class="field-label">'+te('Remarks')+'</span>'+
      '<textarea class="input" id="aRemarks" placeholder="'+te('Anything to note')+'"></textarea></label>'+
    '<button class="btn btn-emerald btn-3d" data-do="CONFIRM" id="aCloseBtn">'+
      te('Close this indent')+'</button>'+
    '<div class="why" id="aGiveWhy"></div>';
}
