<script>
/* ==================================================================
   INDENT FLOW — client
   ================================================================== */
'use strict';

var S = { token:null, user:null, masters:null, view:'dashboard', cache:{}, drawerId:null,
          version:null, syncedVersion:null, filterKey:'', _selfChange:false, sessionSeq:0 };

/** Anything deferred (a timer, a slow reply) must check that the session it
 *  was started in is still the session we are in. Otherwise a queued redraw
 *  can land on the next person to sign in. */
function sessionGuard(){
  var mine = S.sessionSeq;
  return function(){ return mine === S.sessionSeq; };
}

/* ---------------- server bridge ---------------- */
/* Reads that are already on their way are shared, not sent twice: a screen
   and its background refresh, or start-up asking for the dashboard while the
   menu is still loading, ride on the same round trip. */
var READ_ACTIONS = { dashboard:1, listIndents:1, getIndent:1, masters:1, history:1, pcBoard:1,
  inventory:1, transfers:1, itemRequests:1, listReminders:1, reorderList:1, stockHistory:1,
  itemLedger:1, listUsers:1, listSections:1, telegramStatus:1, tgAdminState:1 };
var _inflight = {};
/* A read that has only just come back (2 s) is handed out again instead of
   asked for again. Anything that changes data, or a new data version, clears it. */
var RECENT_MS = 2000;
function forgetReads(){ _inflight = {}; }
function api(action, payload){
  payload = payload || {};
  if (S.token) payload.token = S.token;
  if (READ_ACTIONS[action]){
    var key = action + '|' + JSON.stringify(payload);
    var hit = _inflight[key];
    if (hit && (!hit.at || Date.now() - hit.at < RECENT_MS)) return hit.p;
    var p = apiSend(action, payload);
    var rec = { p: p, at: 0 };
    _inflight[key] = rec;
    p.then(function(){ rec.at = Date.now(); },
           function(){ if (_inflight[key] === rec) delete _inflight[key]; });
    return p;
  }
  if (action !== 'pulse') forgetReads();
  return apiSend(action, payload);
}
function apiSend(action, payload){
  return new Promise(function(res, rej){
    google.script.run
      .withSuccessHandler(function(raw){
        var r;
        try { r = JSON.parse(raw); }
        catch(e){ return rej(new Error(t('The server sent something unreadable.'))); }
        if (r && r.v) noteVersion(r.v);
        if (r && r.ok) res(r.data);
        else rej(new Error((r && r.error) || 'Something went wrong.'));
      })
      .withFailureHandler(function(e){ rej(new Error(e && e.message ? e.message : String(e))); })
      .api(action, JSON.stringify(payload));
  });
}

/* The server stamps every reply with a data version. S.version is the newest
   the server has told us about; S.syncedVersion is the one the screen actually
   reflects. While those two differ, the screen is out of date and we keep
   trying until they agree — a sync that gets dropped is never simply lost. */
function noteVersion(v){
  if (S.version && String(v) !== String(S.version)) forgetReads();
  S.version = v;
  if (!S.syncedVersion){ S.syncedVersion = v; return; }
  if (String(v) !== String(S.syncedVersion) && !S._selfChange) scheduleSync();
}

/* A blocking overlay for a 200 ms call is just a flash of grey. Only show it
   if the wait is long enough to be worth explaining. */
var _busyDepth = 0, _busyTimer = null;
function busy(on){
  _busyDepth = Math.max(0, _busyDepth + (on ? 1 : -1));
  if (_busyDepth > 0){
    if (!_busyTimer) _busyTimer = setTimeout(function(){
      el('busy').classList.remove('hidden');
    }, 280);
  } else {
    clearTimeout(_busyTimer); _busyTimer = null;
    el('busy').classList.add('hidden');
  }
}

/* ---------------- tiny DOM helpers ---------------- */
function el(id){ return document.getElementById(id); }
/** Swap a container for an identical empty one, dropping every listener
 *  that was attached to it. Used wherever we re-render in place. */
function freshNode(id, tag, cls){
  var old = el(id);
  var n = document.createElement(tag);
  n.id = id; n.className = cls;
  old.parentNode.replaceChild(n, old);
  return n;
}
function h(html){ var d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }
function safeVal(v){ return String(v === null || v === undefined ? '' : v).trim(); }
function esc(s){
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function on(root, sel, ev, fn){
  root.addEventListener(ev, function(e){
    var t = e.target.closest(sel);
    if (t && root.contains(t)) fn(e, t);
  });
}
function toast(msg, kind){
  var t = h('<div class="toast '+(kind||'')+'">'+esc(msg)+'</div>');
  el('toasts').appendChild(t);
  setTimeout(function(){ t.classList.add('out'); setTimeout(function(){ t.remove(); }, 340); }, kind==='err'?5200:3200);
}

/* ---------------- date / duration ---------------- */
var TZ = 'Asia/Kolkata';
function fmtDT(iso){
  if(!iso) return '—';
  var d = new Date(iso); if(isNaN(d)) return '—';
  return d.toLocaleString(localeOf(),{ timeZone:TZ, day:'2-digit', month:'short',
    year:'2-digit', hour:'2-digit', minute:'2-digit', hour12:true });
}
function fmtD(iso){
  if(!iso) return '—';
  var d = new Date(iso); if(isNaN(d)) return '—';
  return d.toLocaleDateString(localeOf(),{ timeZone:TZ, day:'2-digit', month:'short', year:'2-digit' });
}
function fmtDur(mins){
  if(mins === null || mins === undefined || mins === '' || isNaN(mins)) return '—';
  mins = Math.max(0, Math.round(Number(mins)));
  var M = LANG === 'HI' ? 'मि' : 'm', H = LANG === 'HI' ? 'घं' : 'h', D = LANG === 'HI' ? 'दि' : 'd';
  if (mins < 60) return mins + M;
  var h1 = Math.floor(mins/60), m = mins%60;
  if (h1 < 24) return h1 + H + (m ? ' ' + m + M : '');
  var d = Math.floor(h1/24), hh = h1%24;
  return d + D + (hh ? ' ' + hh + H : '');
}
function initials(name){
  var words = String(name||'U').replace(/[^A-Za-z\u0900-\u097F ]/g,' ').trim().split(/\s+/)
                .filter(function(w){ return w.length; });
  if (!words.length) return 'U';
  return words.slice(0,2).map(function(w){ return w[0]; }).join('').toUpperCase();
}

/* ---------------- health / stage helpers ---------------- */
var HEALTH_LABEL = { ON_TIME:'On time', DUE_SOON:'Due soon', DELAYED:'Delayed',
                     CRITICAL:'Critical', CLOSED:'Closed' };
function stage(key){
  var st = (S.masters && S.masters.stages || []).filter(function(s){return s.key===key;})[0];
  return st || { no:0, key:key, name:key, colour:'#64748B', role:'' };
}
function statusLabel(s){
  var raw = String(s||'');
  if (LANG !== 'EN'){
    var hit = t(raw);
    if (hit !== raw) return hit;
  }
  return raw.replace(/_/g,' ').toLowerCase().replace(/\b\w/g, function(c){return c.toUpperCase();});
}
/** History actions are stored in English with data glued on the end
 *  ("Dispatch confirmed: Left Jaipur"). Translate the sentence if we know
 *  it whole, else translate the known opening and leave the data alone. */
var ACTION_PREFIX = ['Dispatch confirmed: ', 'Received & checked at plant: ', 'Direct purchase from ',
  'Bought over the counter at ', 'Follow-up with ', 'Reminder set for ', 'Sent from ',
  'ETA set — routed via ', 'Direct purchase submitted — above the ', 'Store verified — '];
function historyAction(a){
  var s = String(a || '');
  if (LANG === 'EN' || !s) return s;
  var whole = t(s); if (whole !== s) return whole;
  for (var i = 0; i < ACTION_PREFIX.length; i++){
    var p = ACTION_PREFIX[i];
    if (s.indexOf(p) === 0){ var tp = t(p); if (tp !== p) return tp + s.slice(p.length); }
  }
  return s;
}
/** Stage names may carry a location: "Receive & Check at Hub — KOTA DEPOT". */
function stageName(name){
  var n = String(name||'');
  if (LANG === 'EN') return n;
  var i = n.indexOf(' — ');
  if (i === -1) return t(n);
  return t(n.slice(0, i)) + ' — ' + n.slice(i + 3);
}
function healthLabel(h){ return t(HEALTH_LABEL[h] || h); }
function accentFor(row){
  if (row.status === 'COMPLETED') return '#10B981';
  if (row.status === 'CANCELLED' || row.status === 'REJECTED') return '#94A3B8';
  if (row.health === 'CRITICAL') return '#F43F5E';
  if (row.health === 'DELAYED')  return '#F97316';
  if (row.health === 'DUE_SOON') return '#F59E0B';
  return stage(row.currentStage).colour;
}

/* ==================================================================
   Boot & authentication
   ================================================================== */
window.addEventListener('DOMContentLoaded', function(){
  var P = window.PORTAL || {};
  portalLoginLabels(P.info || {});
  var saved = null;
  try { saved = sessionStorage.getItem('if_token'); } catch(e){}
  if (P.boot && P.boot.token){
    // Opened from GGM Portal: already signed in, no login screen.
    S.token = P.boot.token; S.user = P.boot.user;
    try { sessionStorage.setItem('if_token', P.boot.token); } catch(e){}
    setLang(S.user && S.user.lang);
    Promise.resolve().then(start);
  } else if (saved){
    S.token = saved;
    api('me').then(function(d){ S.user = d.user; setLang(d.user && d.user.lang); return start(); })
             .catch(function(){ S.token = null; showLogin(); });
  } else {
    setTimeout(showLogin, 700);
  }
  el('loginForm').addEventListener('submit', doLogin);
  el('refreshBtn').addEventListener('click', function(){
    el('refreshBtn').classList.add('spin');
    render(S.view).then(function(){ el('refreshBtn').classList.remove('spin'); });
  });
  el('menuBtn').addEventListener('click', accountMenu);
  el('userChip').addEventListener('click', accountMenu);
  document.addEventListener('click', function(e){
    var c = e.target.closest('[data-close]');
    if (c) closeOverlay(c.getAttribute('data-close'));
    var b = e.target.closest('.btn');
    if (b) ripple(e, b);
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){ closeOverlay('modal'); closeOverlay('drawer'); }
  });
});

function ripple(e, btn){
  var r = btn.getBoundingClientRect(), s = Math.max(r.width, r.height);
  var sp = document.createElement('span');
  sp.className = 'ripple';
  sp.style.width = sp.style.height = s + 'px';
  sp.style.left = (e.clientX - r.left - s/2) + 'px';
  sp.style.top  = (e.clientY - r.top  - s/2) + 'px';
  btn.appendChild(sp);
  setTimeout(function(){ sp.remove(); }, 620);
}

/* GGM Portal connected: the login form takes the portal username/phone + password. */
function portalLoginLabels(info){
  if (!info.enabled) return;
  // Portal-only OFF: the old User ID + PIN works as well as the portal username + password.
  var both = !info.portalOnly;
  var idLabel = document.querySelector('#loginForm .field-label[data-i18n="User ID"]');
  var pinLabel = document.querySelector('#loginForm .field-label[data-i18n="PIN"]');
  if (idLabel){ idLabel.removeAttribute('data-i18n'); idLabel.textContent = both ? 'User ID or portal username' : 'Username or phone'; }
  if (pinLabel){ pinLabel.removeAttribute('data-i18n'); pinLabel.textContent = both ? 'PIN or portal password' : 'Password'; }
  var id = el('loginId'), pin = el('loginPin');
  if (id){ id.placeholder = both ? '' : 'Your GGM Portal username'; id.setAttribute('autocapitalize', 'none'); }
  if (pin){ pin.removeAttribute('inputmode'); pin.placeholder = ''; }
  var hint = document.querySelector('.login-hint');
  if (hint){
    hint.textContent = both ? 'Your usual User ID and PIN, or your GGM Portal username and password. ' : 'Same username and password as GGM Portal. ';
    if (info.hubLink){
      var a = document.createElement('a'); a.href = info.hubLink; a.target = '_top'; a.textContent = 'Open GGM Portal';
      hint.appendChild(a);
    }
  }
}

function showLogin(){
  el('boot').classList.add('out');
  setTimeout(function(){ el('boot').classList.add('hidden'); }, 520);
  el('loginView').classList.remove('hidden');
  el('app').classList.add('hidden');
  setTimeout(function(){ el('loginId').focus(); }, 620);
}

function doLogin(e){
  e.preventDefault();
  var id = el('loginId').value.trim(), pin = el('loginPin').value;
  var err = el('loginError'); err.classList.add('hidden');
  var btn = el('loginBtn'); btn.disabled = true; btn.querySelector('span').textContent = 'Signing in…';
  api('login', { userId:id, pin:pin }).then(function(d){
    S.token = d.token; S.user = d.user;
    setLang(d.user && d.user.lang);
    try { sessionStorage.setItem('if_token', d.token); } catch(x){}
    el('loginPin').value = '';
    return start();
  }).catch(function(ex){
    err.textContent = ex.message; err.classList.remove('hidden');
    err.style.animation='none'; void err.offsetWidth; err.style.animation='';
  }).then(function(){
    btn.disabled = false; btn.querySelector('span').textContent = 'Sign In';
  });
}

function logout(){
  S.sessionSeq++;
  stopPulse();
  invalidateViews();
  closeOverlay('drawer');
  closeOverlay('modal');
  api('logout').catch(function(){});
  forgetMine();
  try { sessionStorage.removeItem('if_token'); } catch(e){}
  S.token = null; S.user = null;
  el('app').classList.add('hidden');
  el('loginView').classList.remove('hidden');
}

function start(){
  S.sessionSeq++;
  S.version = null; S.syncedVersion = null;
  el('boot').classList.add('out');
  setTimeout(function(){ el('boot').classList.add('hidden'); }, 520);
  el('loginView').classList.add('hidden');
  el('app').classList.remove('hidden');
  invalidateViews();
  startPulse();
  el('avatar').textContent = initials(S.user.name);
  // profile photo from GGM Portal; the chip opens the account menu, so no zoom here
  el('avatar').setAttribute('data-ggm-photo', (S.user.id || '') + '|' + (S.user.name || ''));
  el('avatar').setAttribute('data-ggm-zoom', 'off');
  el('userName').textContent = S.user.name;
  var rp = el('userRole');
  rp.textContent = t(S.user.role); rp.className = 'role-pill role-' + S.user.role;
  applyChrome();
  // A different person may be at a different site, and the shelf may have
  // moved since anybody last looked. The cached item list belonged to the
  // previous session, so it goes with them.
  STOCK.site = ''; STOCK.items = []; STOCK.by = {}; STOCK.units = [];
  // and so do the filters: which site and band the last person was looking
  // at says nothing about this one, who may not even be allowed that site
  stockFilter   = { site:'', q:'', bands:[], section:'', range:'ALL', from:'', to:'' };
  ledgerFilter  = { site:'', code:'', range:'MONTH', from:'', to:'' };
  moveFilter    = { site:'', q:'', range:'MONTH', from:'', to:'' };
  reorderFilter = { site:'' };
  itemReqFilter = { status:'PENDING' };
  trfFilter     = { site:'', q:'' };
  PREFILL = null;
  // Build the menu from the role we already have, before waiting on anything.
  // Otherwise the previous user's menu stays live and clickable for a moment.
  buildNav();
  var first = defaultView();
  // The first screen's data is asked for at the same time as the menus, not after.
  if (first === 'dashboard') api('dashboard').catch(function(){});
  var mp = api('masters').then(function(m){
    S.masters = m;
    el('orgName').textContent = m.orgName;
    keep('if_m_' + S.user.id, m);
    return m;
  });
  // What this person saw last time goes up at once; fresh figures replace it
  // a moment later. Only ever their own, keyed by who they are.
  var oldM = recall('if_m_' + S.user.id);
  var oldDash = recall('if_d_' + S.user.id);
  if (oldM && oldM.stages){
    S.masters = oldM;
    el('orgName').textContent = oldM.orgName || '';
    if (first === 'dashboard' && typeof oldDash === 'string') S.cache[viewKey('dashboard')] = oldDash;
    mp.catch(function(){});
    return render(first);
  }
  return mp.then(function(){ return render(first); })
           .catch(function(e){ toast(e.message, 'err'); });
}

/* Small per-person memory on this device, for an instant first screen. */
function keep(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function recall(k){ try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch(e){ return null; } }
function forgetMine(){
  try { if (S.user){ localStorage.removeItem('if_m_' + S.user.id); localStorage.removeItem('if_d_' + S.user.id); } } catch(e){}
}

/* ==================================================================
   Live sync
   Apps Script has no push, so the browser asks a very cheap question
   every few seconds: "has anything changed?" The answer is one number.
   When it moves, whatever is on screen quietly redraws itself.
   ================================================================== */
var PULSE_MS = 6000;
var _pulse = null, _syncTimer = null, _syncing = false;

function startPulse(){
  stopPulse();
  _pulse = setInterval(function(){
    if (!S.token) return;
    if (document.hidden) return;                 // an unwatched tab costs nothing
    api('pulse').catch(function(){});            // noteVersion does the rest
  }, PULSE_MS);
  document.addEventListener('visibilitychange', onVisible);
  window.addEventListener('focus', onVisible);
}
function stopPulse(){
  if (_pulse){ clearInterval(_pulse); _pulse = null; }
  document.removeEventListener('visibilitychange', onVisible);
  window.removeEventListener('focus', onVisible);
}
function onVisible(){
  if (document.hidden || !S.token) return;
  api('pulse').catch(function(){});              // catch up the moment you look
}

/** Coalesce a burst of changes into a single quiet redraw. */
function scheduleSync(){
  if (_syncTimer) return;
  _syncTimer = setTimeout(function(){
    _syncTimer = null;
    syncNow();
  }, 250);
}

var _syncPending = false;
function syncNow(){
  if (!S.token) return;
  if (_syncing){ _syncPending = true; return; }   // do not drop it — do it after
  _syncing = true;
  var target = S.version;
  invalidateViews();
  var jobs = [render(S.view, { silent:true, fresh:true })];
  if (S.drawerId && !el('drawer').classList.contains('hidden')){
    jobs.push(refreshDrawer(S.drawerId));
  }
  Promise.all(jobs).catch(function(){}).then(function(){
    _syncing = false;
    S.syncedVersion = target;
    flashSynced();
    // anything that landed while we were redrawing gets its own pass
    if (_syncPending || String(S.version) !== String(S.syncedVersion)){
      _syncPending = false;
      scheduleSync();
    }
  });
}

/** A one-second whisper, not a banner: enough to notice, not enough to nag. */
function flashSynced(){
  var n = el('syncFlash');
  if (!n) return;
  n.classList.remove('hidden');
  n.classList.add('show');
  clearTimeout(n._t);
  n._t = setTimeout(function(){
    n.classList.remove('show');
    setTimeout(function(){ n.classList.add('hidden'); }, 300);
  }, 1400);
}

/** Redraw an open drawer in place, keeping the scroll position. */
function refreshDrawer(id){
  return api('getIndent', { indentId:id }).then(function(d){
    rememberDrawer(id, d);
    if (S.drawerId !== id || el('drawer').classList.contains('hidden')) return;
    var old = el('drawerPanel');
    var top = old.scrollTop;
    var html = drawerHtml(d);
    if (old.getAttribute('data-html') === html) return;   // nothing moved
    var panel = freshNode('drawerPanel', 'aside', 'drawer-panel');
    panel.style.animation = 'none';
    panel.setAttribute('data-html', html);
    panel.innerHTML = html;
    panel.scrollTop = top;
    wireDrawer(d);
  }).catch(function(){});
}

var NAV_OVERFLOW = [];
function navTile(i){
  return '<div class="nav-item" data-view="'+i.id+'">'+i.icon+'<span>'+te(i.label)+'</span>'+
         (i.badge ? '<span class="badge hidden" data-badge="'+i.badge+'">0</span>' : '')+'</div>';

function buildNav(){
  var items = navFor(S.user.role);
  // Fresh nodes: buildNav runs on every sign-in, and re-using the old ones
  // would leave the previous session's delegated click handlers attached —
  // one extra copy per login, so a single tap fired N navigations.
  var side   = freshNode('sideNav',   'nav', 'sidenav');
  var bottom_= freshNode('bottomNav', 'nav', 'bottomnav');
  side.innerHTML = items.map(navTile).join('');

  // A phone shows five tiles. If the role has more screens than that, the
  // fifth becomes "More" so nothing (Users, Settings…) is ever unreachable.
  var bottom, overflow = [];
  if (items.length <= 5) {
    bottom = items.slice();
  } else {
    bottom = items.slice(0, 4);
    overflow = items.slice(4);
    bottom.push({ id:'__more', label:'More', icon:ICON.more });
  }
  NAV_OVERFLOW = overflow;
  bottom_.innerHTML = bottom.map(navTile).join('');

  [side, bottom_].forEach(function(nav){
    on(nav, '.nav-item', 'click', function(e, t){
      var v = t.getAttribute('data-view');
      if (v === '__more') return moreMenu();
      clearListFilters();          // a menu tap is a fresh start, not a drill-down
      render(v);
    });
  });

function markNav(v){

  document.querySelectorAll('.nav-item').forEach(function(n){

/* ==================================================================
   Router
   ================================================================== */
function viewJob(view){
  switch(view){
    case 'dashboard': return viewDashboard();
    case 'new':       return viewNew();
    case 'mine':      return viewIndents('MINE');
    case 'all':       return viewIndents('ALL');
    case 'queue':     return viewIndents('MY_QUEUE');
    case 'pcboard':   return viewPCBoard();
    case 'reminders': return viewReminders();
    case 'history':   return viewHistory();
    case 'stock':     return viewStock();
    case 'ledger':    return viewLedger();
    case 'movements': return viewMovements();
    case 'reorder':   return viewReorder();
    case 'itemreq':   return viewItemReq();
    case 'transfers': return viewTransfers();
    case 'vendors':   return viewVendors();
    case 'users':     return viewUsers();
    case 'settings':  return viewSettings();
    case 'notify':    return viewNotify();
    default:          return viewDashboard();
  }
}

/** A key that changes whenever the *content* of a view would change. */
function viewKey(view){
  return view + '|' + JSON.stringify(
    view === 'pcboard' ? pcFilter :
    view === 'history' ? histFilter :
    view === 'stock'   ? stockFilter :
    view === 'ledger'  ? ledgerFilter :
    view === 'movements' ? moveFilter :
    view === 'reorder' ? reorderFilter :
    view === 'itemreq' ? itemReqFilter :
    view === 'transfers' ? trfFilter : listState);
}

var _renderSeq = 0;
/** opts.silent = a background refresh: no spinner, no scroll, no flicker. */
function render(view, opts){
  opts = opts || {};
  var seq = ++_renderSeq;
  S.view = view; markNav(view);
  var key = viewKey(view);

  // Anything we already have for this exact view is put up straight away, so
  // moving between screens is instant. The network catches up behind it.
  var cachedHtml = S.cache[key];
  var painted = false;
  if (cachedHtml && !opts.fresh){
    var m0 = freshNode('main', 'main', 'main');
    m0.innerHTML = cachedHtml;
    wire(view, m0);
    painted = true;
  } else if (!opts.silent){
    busy(true);
  }
  if (!painted && opts.silent) { /* nothing on screen yet: let it load quietly */ }

  return viewJob(view).then(function(html){
    if (seq !== _renderSeq) return;              // the user moved on; drop this
    if (S.cache[key] === html && painted) return; // identical — do not repaint
    S.cache[key] = html;
    if (view === 'dashboard' && S.user) keep('if_d_' + S.user.id, html);
    var m = freshNode('main', 'main', 'main');
    m.innerHTML = html;
    wire(view, m);
    if (!opts.silent && !painted) {
      try { window.scrollTo({ top:0, behavior:'smooth' }); } catch (e) {}
    }
  }).catch(function(e){
    if (seq !== _renderSeq) return;
    if (opts.silent) return;                     // a failed background poll is not news
    var m = freshNode('main', 'main', 'main');
    m.innerHTML = emptyState('😕', t('Could not load this page'), e.message);
  }).then(function(){ if (!painted && !opts.silent) busy(false); });
}

/** Throw away cached screens — after we change something ourselves. */
function invalidateViews(){ S.cache = {}; DRAWER_CACHE = {}; forgetReads(); }

function emptyState(emoji, title, sub){
  return '<div class="empty"><div class="empty-emoji">'+emoji+'</div><h3>'+esc(title)+'</h3><p>'+esc(sub||'')+'</p></div>';
}
function pageHead(title, sub, right){
  return '<div class="page-head"><div><h1 class="page-title">'+esc(title)+'</h1>'+
         (sub ? '<p class="page-sub">'+esc(sub)+'</p>' : '')+'</div>'+(right||'')+'</div>';
}

function viewDashboard(){
  return api('dashboard').then(function(d){
    setBadge('myQueue', d.counts.myQueue);
    setBadge('itemReq', d.counts.itemReq || 0);
    setBadge('transfers', d.counts.transfers || 0);
    var c = d.counts;
    var listView = (d.role === 'USER') ? 'mine' : 'all';
    // [css, number, label, where it takes you]
    var tiles = [
      ['s-indigo',  c.active,    t('Active'),       { view:listView, scope:'ACTIVE' }],
      ['s-rose',    c.delayed,   t('Delayed'),      { view:listView, scope:'ACTIVE', health:'DELAYED' }],
      ['s-amber',   c.dueSoon,   t('Due soon'),     { view:listView, scope:'ACTIVE', health:'DUE_SOON' }],
      ['s-emerald', c.completed, t('Completed'),    { view:listView, scope:'CLOSED', status:'COMPLETED' }],
      ['s-slate',   c.total,     t('Total raised'), { view:listView, scope:'' }]
    ];
    if (d.role !== 'USER') {
      tiles.splice(1, 0, ['s-violet', c.myQueue, t('Waiting on me'), { view:'queue' }]);
    }
    // the shelf, alongside the pipeline — what needs ordering is as urgent
    // as what is stuck, and it never appeared on this screen before
    if (c.reorder !== undefined) {
      tiles.push(['s-orange', c.reorder, t('Needs ordering'), { view:'reorder' }]);
    }
    if (c.itemReq) {
      tiles.push(['s-teal', c.itemReq, t('Item changes waiting'), { view:'itemreq' }]);
    }
    if (c.transfers) {
      tiles.push(['s-sky', c.transfers, t('Goods to count in'), { view:'transfers' }]);
    }
    if (d.role === 'PC') {
      tiles[0][3] = { view:'pcboard' };
      tiles[1][3] = { view:'pcboard', health:'DELAYED' };
      tiles[2][3] = { view:'pcboard', health:'DUE_SOON' };
      tiles.push(['s-violet', d.pc.followupsTotal,   t('Follow-ups'),    { view:'history' }]);
      tiles.push(['s-sky',    d.pc.remindersPending, t('Reminders set'), { view:'reminders' }]);
    }
    var stats = '<div class="grid stats">' + tiles.map(function(t){
      return '<div class="stat '+t[0]+' go" data-tile=\''+esc(JSON.stringify(t[3]))+'\'>'+
             '<div class="n">'+t[1]+'</div><div class="l">'+esc(t[2])+'</div>'+
             '<span class="arrow">→</span></div>';
    }).join('') + '</div>';

    var maxN = Math.max(1, Math.max.apply(null, d.byStage.map(function(s){return s.count;})));
    var flow = '<div class="card"><div style="display:flex;flex-direction:column;gap:11px">' +
      d.byStage.map(function(s){
        var pct = Math.round(s.count / maxN * 100);
        return '<div class="stage-row" style="display:flex;align-items:center;gap:12px" '+
          'data-tile=\''+esc(JSON.stringify({ view: listView, scope:'ACTIVE', stage: s.key }))+'\'>'+
          '<div style="width:26px;height:26px;border-radius:9px;flex:none;display:grid;place-items:center;'+
          'background:'+s.colour+';color:#fff;font-weight:800;font-size:11.5px;'+
          'box-shadow:0 4px 10px '+s.colour+'55">'+s.no+'</div>'+
          '<div style="flex:1;min-width:0">'+
            '<div style="display:flex;justify-content:space-between;font-size:13px;font-weight:650">'+
              '<span>'+esc(stageName(s.name))+'</span>'+
              '<span style="color:#64748B">'+s.count+(s.delayed?' <b style="color:#E11D48">('+s.delayed+' '+te('late')+')</b>':'')+'</span>'+
            '</div>'+
            '<div style="height:9px;border-radius:5px;background:#EDF1F7;margin-top:5px;overflow:hidden">'+
              '<div style="height:100%;width:'+pct+'%;border-radius:5px;background:linear-gradient(90deg,'+
              s.colour+'AA,'+s.colour+');transition:width .8s cubic-bezier(.22,1,.36,1)"></div>'+
            '</div>'+
          '</div></div>';
      }).join('') + '</div></div>';

    return pageHead(t('Hello,') + ' ' + S.user.name.split(' ')[0] + ' 👋',

           (c.myQueue ? '<div style="margin-top:18px"><button class="btn btn-primary btn-3d" data-go="queue">'+
              te('Open my queue')+' ('+c.myQueue+')</button></div>' : '')+
           '<p class="muted" style="margin-top:16px">'+te('Tap any tile or step above to see exactly those indents.')+'</p>';
  });

function indentCard(r){

  var stages = (S.masters.stages || []);

  var closed = ['COMPLETED','CANCELLED','REJECTED'].indexOf(r.status) !== -1;

function siteChip(r){
  var site = esc(r.site || r.plant || '');

  return '<span class="chip plant">'+site+'</span>'+
         (r.section ? '<span class="chip section">'+esc(r.section)+'</span>' : '');

function siteTree(){ return (S.masters && S.masters.siteTree) || []; }

/* ------------------------------------------------------------------
   Live stock under the item box.
   The list is loaded once per site, so typing costs nothing; the exact
   figure is confirmed from the server when a known item is matched.
   ------------------------------------------------------------------ */
var STOCK = { site:'', items:[], by:{}, units:[] };

/** The standard units, plus whatever this site's own item list actually
 *  uses — your sheet says "Ltr" and "Pcs", and those have to be offered
 *  or an item could never carry its real unit through to the indent. */
var BASE_UNITS = ['PIECE','NOS','SET','METER','FEET','KG','LITRE','DRUM','BAG','BOTTLE','ROLL','BOX'];
function unitChoices(){
  var seen = {}, out = [];
  BASE_UNITS.concat(STOCK.units || []).forEach(function(u){
    var k = String(u||'').trim(); if (!k) return;
    var key = k.toUpperCase();
    if (seen[key]) return;
    seen[key] = true; out.push(k);
  });
  return out;
}
function unitOptions(chosen){
  return unitChoices().map(function(u){
    var on = String(chosen||'').toUpperCase() === u.toUpperCase();
    return '<option value="'+esc(u)+'"'+(on?' selected':'')+'>'+te(u)+'</option>';
  }).join('');
}
/** Point a unit dropdown at a unit, adding the option if it is not there. */
function selectUnit(sel, unit){
  if (!sel || !unit) return;
  var want = String(unit).trim();
  for (var i = 0; i < sel.options.length; i++){
    if (sel.options[i].value.toUpperCase() === want.toUpperCase()){ sel.selectedIndex = i; return; }
  }
  var o = document.createElement('option');
  o.value = want; o.textContent = t(want);
  sel.appendChild(o);
  sel.selectedIndex = sel.options.length - 1;
}

function loadStock(site, force){
  if (!site) return Promise.resolve(STOCK);
  if (STOCK.site === site && !force) return Promise.resolve(STOCK);
  return api('inventory', { site: site }).then(function(d){
    STOCK.site = d.site; STOCK.items = d.items || []; STOCK.by = {}; STOCK.units = [];
    var seen = {};
    STOCK.items.forEach(function(i){
      STOCK.by[i.name.toLowerCase()] = i;
      var u = String(i.unit||'').trim();
      if (u && !seen[u.toUpperCase()]){ seen[u.toUpperCase()] = true; STOCK.units.push(u); }
    });
    return STOCK;
  }).catch(function(){
    STOCK.site = site; STOCK.items = []; STOCK.by = {}; STOCK.units = []; return STOCK;
  });
}

/** The section the form is currently pointed at, or '' for the whole site. */
function formSection(){
  var sel = el('sectionSel');
  return sel ? String(sel.value || '').trim() : '';
}

/** The items a requester may pick from right now. A section narrows it to
 *  what that section actually keeps; with no section chosen the whole site
 *  is offered, because plenty of things belong to the site itself. */
function itemsInScope(){
  var sec = formSection().toUpperCase();
  if (!sec) return STOCK.items;
  var hit = STOCK.items.filter(function(i){
    return String(i.section || '').toUpperCase() === sec;
  });
  // a section nobody has filed anything under would otherwise offer nothing
  return hit.length ? hit : STOCK.items;
}

/** Both dropdowns, rebuilt from whatever is in scope. */
function fillItemList(){
  var scope = itemsInScope();
  var names = el('itemList'), parts = el('partList');
  if (names) names.innerHTML = scope.map(function(i){
    return '<option value="'+esc(i.name)+'">'+esc(qty(i.stock)+' '+i.unit+
           (i.partNumber ? ' · '+i.partNumber : '')+
           (i.section ? ' · '+i.section : ''))+'</option>';
  }).join('');
  if (parts) parts.innerHTML = scope.filter(function(i){ return i.partNumber; })
    .map(function(i){
      return '<option value="'+esc(i.partNumber)+'">'+esc(i.name)+'</option>';
    }).join('');

  var hint = el('sectionHint');
  if (hint && formSection()){
    hint.textContent = scope.length + ' ' + t(scope.length === 1 ? 'item' : 'items') + ' ' +
                       t('in this section');
  }
}

/** Find an item by either of the two things a person might know it by. */
function itemByName(name){
  var k = String(name || '').trim().toLowerCase();
  return k ? (STOCK.by[k] || null) : null;
}
function itemByPart(part){
  var k = String(part || '').trim().toLowerCase();
  if (!k) return null;
  var hit = null;
  STOCK.items.forEach(function(i){
    if (!hit && String(i.partNumber || '').trim().toLowerCase() === k) hit = i;
  });
  return hit;
}

/* ------------------------------------------------------------------
   The two boxes are two names for the same thing.
   ------------------------------------------------------------------
   A fitter knows "Bearing 6205"; the storekeeper knows "6205-2RS". Fill
   in either and the other appears, along with the unit and the section
   the item is actually filed under — so what reaches the store is one
   item, identified the same way whoever typed it.
   ------------------------------------------------------------------ */
function itemSync(source){
  var nameBox = el('partName'), partBox = el('partNumber');
  if (!nameBox) return;

  /* A box we filled in ourselves is marked `auto`. When the box that was
     driving stops matching anything, that mirrored value is wiped — else
     changing the name to something unlisted would leave the old item's
     part number sitting underneath it, and the indent would claim to be
     for a part it is not. A value the person typed is never touched. */
  function mirror(box, value){
    if (!box || box.dataset.touched) return;
    box.value = value || '';
    box.dataset.auto = value ? '1' : '';
  }

  var it = null;
  if (source === 'part'){
    it = itemByPart(partBox && partBox.value);
    if (it) mirror(nameBox, it.name);
    else if (nameBox && nameBox.dataset.auto) mirror(nameBox, '');
  } else {
    it = itemByName(nameBox.value);
    if (it) mirror(partBox, it.partNumber);
    else if (partBox && partBox.dataset.auto) mirror(partBox, '');
  }
  // whichever way round it was found, the other box may now agree
  if (!it) it = itemByName(nameBox.value) || itemByPart(partBox && partBox.value);

  if (it){
    // the item's own section wins — it is where the thing actually lives
    var sec = el('sectionSel');
    if (it.section && sec && !sec.dataset.touched){
      for (var i = 0; i < sec.options.length; i++){
        if (sec.options[i].value.toUpperCase() === String(it.section).toUpperCase()){
          sec.selectedIndex = i; break;
        }
      }
    }
    var u = el('unitSel');
    if (u && !u.dataset.touched){
      selectUnit(u, it.unit);
      var uh = el('unitHint');
      if (uh) uh.textContent = t('From the stock list — change it if you need to');
    }
  }
  var ph = el('partHint');
  if (ph) ph.textContent = it && it.partNumber ? t('Matched on the stock list') : '';
  stockHint(it);
}

/** The live shelf figure under the item box, for whatever is typed in it. */
function stockHint(known){
  var box = el('stockHint'), input = el('partName');
  if (!box || !input) return;
  var name = String(input.value||'').trim();
  var partBox = el('partNumber');
  var part = partBox ? String(partBox.value||'').trim() : '';
  if (!name && !part){ box.className = 'stock-hint'; box.textContent = ''; return; }

  var it = known !== undefined ? known : (itemByName(name) || itemByPart(part));
  if (!it){
    box.className = 'stock-hint new';
    box.textContent = t('Not on the stock list yet — the store will add it');
    var uh = el('unitHint'); if (uh) uh.textContent = '';
    return;
  }

  if (it.stock <= 0){
    box.className = 'stock-hint out';
    box.textContent = t('None in stock at') + ' ' + STOCK.site;
  } else if (it.band === 'CRITICAL' || it.band === 'LOW'){
    box.className = 'stock-hint low';
    box.textContent = t('In stock:') + ' ' + qty(it.stock) + ' ' + t(it.unit) + ' · ' +
                      t(it.band === 'CRITICAL' ? 'below the safety buffer' : 'at the reorder point');
  } else {
    box.className = 'stock-hint ok';
    box.textContent = t('In stock:') + ' ' + qty(it.stock) + ' ' + t(it.unit) +
                      (it.section ? ' · ' + it.section : '');
  }
  if (it.maxOrderQty){
    box.textContent += ' · ' + t('most that may be bought without approval:') + ' ' + it.maxOrderQty;
  }
}

  CRITICAL : { pill:'h-CRITICAL', word:'Critical', label:'Critical',     tile:'s-rose'   },

  WATCH    : { pill:'h-DELAYED',  word:'Watch',    label:'Watch',        tile:'s-sky'    },
  HEALTHY  : { pill:'h-ON_TIME',  word:'Healthy',  label:'Healthy',      tile:'s-emerald'}
};
function bandOf(b){ return BANDS[b] || BANDS.HEALTHY; }
function bandPill(b){
  var d = bandOf(b);
  return '<span class="pill '+d.pill+'">'+te(d.word)+'</span>';
}

function stockBandOn(l){ return stockFilter.bands.indexOf(l) !== -1; }
function toggleStockBand(l){
  var i = stockFilter.bands.indexOf(l);
  if (i === -1) stockFilter.bands.push(l); else stockFilter.bands.splice(i, 1);
}

/** 1.8 stays 1.8, 0.26865671641791045 becomes 0.27, 20 stays 20. */
function qty(n){
  var v = Number(n);
  if (!isFinite(v)) return '—';
  return String(Math.round(v * 100) / 100);
}
/** Blank cells read better as a dash than as a zero nobody set. */
function qtyOr(n, dash){
  var v = Number(n);
  if (!isFinite(v) || v === 0) return '<span class="muted">'+(dash||'—')+'</span>';
  return qty(v);
}

/* ------------------------------------------------------------------
   The pieces every stock screen shares: a site picker and a date range
   ------------------------------------------------------------------ */

/** One button per site the reader may see. A store person sees one name
    and no buttons, because there is nothing to choose. */
function sitePicker(sites, current, attr){
  if (!sites || sites.length < 2){
    return '<span class="site-badge lg">'+esc(current || (sites && sites[0]) || '')+'</span>';
  }
  return '<div class="seg">'+ sites.map(function(s){
    return '<button '+attr+'="'+esc(s)+'" class="'+(s===current?'on':'')+'">'+esc(s)+'</button>';
  }).join('') +'</div>';
}

/** What to send the server for a range. A half-finished custom span is
 *  not a question the server can answer, so until both ends are picked the
 *  screen quietly stays on all time rather than throwing an error page. */
function rangeParam(state){
  if (state.range === 'CUSTOM' && !(state.from && state.to)) return 'ALL';
  return state.range;
}

/** Today / This month / This year / All time, then a custom span. */
function rangeBar(presets, state, attr){
  var list = presets || [{key:'TODAY',label:'Today'},{key:'MONTH',label:'This month'},
                         {key:'YEAR',label:'This year'},{key:'ALL',label:'All time'}];
  var seg = '<div class="seg">'+ list.map(function(p){
      return '<button '+attr+'="'+esc(p.key)+'" class="'+(state.range===p.key?'on':'')+'">'+
             te(p.label)+'</button>';
    }).join('') +
    '<button '+attr+'="CUSTOM" class="'+(state.range==='CUSTOM'?'on':'')+'">'+te('Pick dates')+'</button></div>';

  if (state.range !== 'CUSTOM') return seg;
  return seg + '<div class="toolbar" style="margin-top:8px">'+
    '<input class="input input-sm" type="date" data-rangefrom="'+esc(attr)+'" value="'+esc(state.from||'')+'">'+
    '<span class="muted">'+te('to')+'</span>'+
    '<input class="input input-sm" type="date" data-rangeto="'+esc(attr)+'" value="'+esc(state.to||'')+'">'+
    (state.from && state.to ? '' :
      '<span class="muted">'+te('Pick both ends and the screen fills in.')+'</span>')+
  '</div>';
}

/** The words under a heading that say which slice of time is on screen. */
function rangeNote(r){
  if (!r) return '';
  return r.all ? t('All time')
               : t(r.label) + ' · ' + r.days + ' ' + t(r.days === 1 ? 'day' : 'days');
}

/* ==================================================================
   Stock — the item list for one site
   ================================================================== */
function viewStock(){
  var wanted = stockFilter.site || mySite();
  return api('inventory', { site: wanted, q: stockFilter.q, bands: stockFilter.bands,
                            section: stockFilter.section,
                            range: rangeParam(stockFilter), from: stockFilter.from, to: stockFilter.to })
    .then(function(d){
      stockFilter.site = d.site;
      var filtering = stockFilter.bands.length > 0;
      var ranged = !!(d.range && d.range.key !== 'ALL');

      // keep the shared cache warm so the indent form offers this site's units
      if (!stockFilter.q && !filtering && !stockFilter.section){
        STOCK.site = d.site; STOCK.items = d.items; STOCK.by = {}; STOCK.units = [];
        var seenU = {};
        d.items.forEach(function(i){
          STOCK.by[i.name.toLowerCase()] = i;
          var u = String(i.unit||'').trim();
          if (u && !seenU[u.toUpperCase()]){ seenU[u.toUpperCase()] = true; STOCK.units.push(u); }
        });
      }

      // [css, number, label, which band this tile stands for]
      var tiles = [
        ['s-indigo',  d.counts.total,    t('Items on the list'),  ''],
        ['s-slate',   d.counts.reorder,  t('Needs ordering'),     'REORDER'],
        ['s-rose',    d.counts.out,      t('Out of stock'),       'OUT'],
        ['s-orange',  d.counts.critical, t('Below safety'),       'CRITICAL'],
        ['s-amber',   d.counts.low,      t('Running low'),        'LOW']
      ];
      var stats = '<div class="grid stats">' + tiles.map(function(x){
        var on = x[3] ? stockBandOn(x[3]) : !filtering;
        return '<div class="stat '+x[0]+' go'+(on && x[3] ? ' picked' : '')+'" '+
               'data-band="'+esc(x[3])+'" role="button" tabindex="0">'+
               '<div class="n">'+x[1]+'</div><div class="l">'+esc(x[2])+'</div>'+
               '<span class="arrow">'+(on && x[3] ? '✓' : '→')+'</span></div>';
      }).join('') + '</div>';

      var chips = '';
      if (filtering || stockFilter.section){
        chips = '<div class="toolbar" style="margin-bottom:12px">'+
          stockFilter.bands.map(function(b){
            var w = b === 'REORDER' ? t('Needs ordering') : t(bandOf(b).label);
            return '<span class="filter-chip">'+esc(w)+
                   '<button data-unband="'+esc(b)+'" title="'+te('Remove')+'">&times;</button></span>';
          }).join('')+
          (stockFilter.section ? '<span class="filter-chip">'+esc(stockFilter.section)+
             '<button data-unband="__section" title="'+te('Remove')+'">&times;</button></span>' : '')+
          '<span class="muted">'+d.shown+' '+te(d.shown === 1 ? 'item' : 'items')+'</span>'+
          '<button class="btn btn-ghost btn-sm" data-unband="all">'+te('Clear all')+'</button></div>';
      }

      var secSel = (d.sections && d.sections.length)
        ? '<select class="input input-sm" id="sSection"><option value="">'+te('Every section')+'</option>'+
          d.sections.map(function(s){
            return '<option value="'+esc(s)+'"'+(s===stockFilter.section?' selected':'')+'>'+esc(s)+'</option>';
          }).join('')+'</select>' : '';

      var bar = '<div class="toolbar">'+ sitePicker(d.sites, d.site, 'data-stocksite') + secSel +
        '<div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>'+
        '<input id="sq" placeholder="'+te('Search by name or part number…')+'" value="'+esc(stockFilter.q)+'"></div></div>'+
        '<div class="toolbar" style="margin-top:8px">'+ rangeBar(null, stockFilter, 'data-stockrange') +
        (ranged ? '<span class="muted">'+esc(rangeNote(d.range))+' — '+
                  te('opening, in and out are for this period only')+'</span>' : '')+
        '</div>' + chips;

      var body = d.items.length
        ? '<div class="tablewrap"><table><thead><tr>'+
            '<th>'+te('Code')+'</th><th>'+te('Item')+'</th><th>'+te('Part number')+'</th>'+
            '<th>'+te('Section')+'</th><th>'+te('Unit')+'</th>'+
            '<th>'+te('Opening')+'</th><th>'+te('In')+'</th><th>'+te('Out')+'</th>'+
            '<th>'+te('In stock')+'</th>'+
            '<th>'+te('Daily use')+'</th><th>'+te('Lead days')+'</th><th>'+te('Safety')+'</th>'+
            '<th>'+te('Reorder at')+'</th><th>'+te('Min order')+'</th><th>'+te('Max order')+'</th>'+
            (d.canEdit ? '<th></th>' : '')+
          '</tr></thead><tbody>'+
          d.items.map(function(i){
            return '<tr>'+
              '<td class="mono">'+esc(i.code)+'</td>'+
              '<td><b>'+esc(i.name)+'</b></td>'+
              '<td>'+esc(i.partNumber||'—')+'</td>'+
              '<td>'+(i.section ? esc(i.section) : '<span class="muted">'+te('site main')+'</span>')+'</td>'+
              '<td>'+te(i.unit)+'</td>'+
              '<td>'+qty(i.openingStock)+'</td>'+
              '<td class="pos">'+qtyOr(i.rangeIn, '0')+'</td>'+
              '<td class="neg">'+qtyOr(i.rangeOut, '0')+'</td>'+
              '<td><b>'+qty(i.stock)+'</b> '+bandPill(i.band)+'</td>'+
              '<td>'+qtyOr(i.rangeAdc)+'</td>'+
              '<td>'+qtyOr(i.leadDays)+'</td>'+
              '<td>'+qtyOr(i.safetyStock)+'</td>'+
              '<td>'+qtyOr(i.reorderPoint)+(i.ropOverride !== '' ? ' <span class="pill h-CLOSED">'+te('set')+'</span>' : '')+'</td>'+
              '<td>'+qtyOr(i.minOrderQty)+'</td>'+
              '<td>'+(i.maxOrderQty ? qty(i.maxOrderQty) : '<span class="muted">'+te('no ceiling')+'</span>')+'</td>'+
              (d.canEdit ? '<td><button class="btn btn-ghost btn-sm" data-edititem=\'' +
                esc(JSON.stringify(i)) + '\'>'+te('Edit')+'</button></td>' : '')+
            '</tr>';
          }).join('') +'</tbody></table></div>'
        : emptyState('📦',
            filtering ? t('Nothing in that band') :
              (stockFilter.q ? t('No item matches that') : t('Nothing on the list yet')),
            filtering ? t('Everything on this list is above its reorder point.') :
              (stockFilter.q ? t('Try a shorter word, or part of the part number.') :
                (d.canEdit ? t('Add your first item — it needs a name, a part number and a section.')
                           : t('The store team has not added any items for this site yet.'))));

      var add = d.canEdit
        ? '<button class="btn btn-primary btn-3d" id="addItemBtn">'+te('+ Add item')+'</button>' : '';

      return pageHead(t('Stock'),
        t('Every item this site keeps, what moved, and where each one stands against its own reorder point.'),
        add) + stats +
        '<p class="muted" style="margin:14px 0">'+
          te('Tap a tile to list just those items. Stock is worked out from the ledger, so it always matches what was actually moved.')+
        '</p>' + bar + body;
  });
}

/* ------------------------------------------------------------------
   Adding and editing an item
   ------------------------------------------------------------------ */
function itemDialog(item){
  var editing = !!item;
  var site = stockFilter.site || mySite();
  var isAdmin = S.user.role === 'ADMIN';
  function v(k){ return editing && item[k] !== '' && item[k] !== undefined ? String(item[k]) : ''; }

  var openingField = (!editing || isAdmin)
    ? '<label class="field"><span class="field-label">'+te('Opening stock')+'</span>'+
        '<input class="input" id="iOpen" inputmode="decimal" value="'+esc(v('initialStock'))+'" '+
        'placeholder="'+te('What was on the shelf before any movement was recorded')+'">'+
        '<span class="muted">'+te('Everything in and out is added to this. The live figure is never typed in.')+'</span></label>'
    : '<div class="field"><span class="field-label">'+te('Opening stock')+'</span>'+
        '<div class="readout">'+qty(item.initialStock)+' '+te(item.unit)+'</div>'+
        '<span class="muted">'+te('Only an administrator can restate an opening balance.')+'</span></div>';

  var c = showModal('<h3 class="modal-title">'+te(editing ? 'Edit item' : 'Add an item')+'</h3>'+
    '<p class="modal-sub">'+esc(site)+(editing ? ' · '+esc(item.code) : '')+'</p>'+
    (editing
      ? '<div class="readout-row"><span>'+te('In stock now')+'</span><b>'+qty(item.stock)+' '+te(item.unit)+
        '</b> '+bandPill(item.band)+'</div>' : '')+
    '<label class="field"><span class="field-label">'+te('Item name *')+'</span>'+
      '<input class="input" id="iName" value="'+esc(v('name'))+'" '+
      'placeholder="'+te('e.g. Bearing 6205')+'"></label>'+
    '<div class="row two">'+
      '<label class="field"><span class="field-label">'+te('Part number *')+'</span>'+
        '<input class="input" id="iPart" value="'+esc(v('partNumber'))+'"></label>'+
      '<label class="field"><span class="field-label">'+te('Unit')+'</span>'+
        '<select class="input" id="iUnit">'+ unitOptions(editing ? item.unit : '') +'</select></label>'+
    '</div>'+
    '<label class="field"><span class="field-label">'+te('Section *')+'</span>'+
      '<select class="input" id="iSection">'+sectionOptions(site, editing?item.section:'')+'</select></label>'+
    openingField +
    '<div class="section-title" style="margin-top:14px">'+te('When to order again')+'</div>'+
    '<div class="row two">'+
      '<label class="field"><span class="field-label">'+te('Lead time (days)')+'</span>'+
        '<input class="input" id="iLead" inputmode="decimal" value="'+esc(v('leadDays'))+'">'+
        '<span class="muted">'+te('How long it takes to arrive after you order.')+'</span></label>'+
      '<label class="field"><span class="field-label">'+te('Safety stock')+'</span>'+
        '<input class="input" id="iSafety" inputmode="decimal" value="'+esc(v('safetyStock'))+'">'+
        '<span class="muted">'+te('The buffer you never want to dip into, in units.')+'</span></label>'+
    '</div>'+
    '<div class="readout-row" id="iRop"></div>'+
    '<label class="field"><span class="field-label">'+te('Reorder point — set it yourself')+'</span>'+
      '<input class="input" id="iRopOv" inputmode="decimal" value="'+esc(v('ropOverride'))+'" '+
      'placeholder="'+te('Leave blank to let the system work it out')+'"></label>'+
    '<div class="row two">'+
      '<label class="field"><span class="field-label">'+te('Minimum order quantity')+'</span>'+
        '<input class="input" id="iMin" inputmode="decimal" value="'+esc(v('minOrderQty'))+'">'+
        '<span class="muted">'+te('The smallest the vendor will sell.')+'</span></label>'+
      '<label class="field"><span class="field-label">'+te('Maximum order quantity')+'</span>'+
        '<input class="input" id="iMax" inputmode="decimal" value="'+esc(v('maxOrderQty'))+'">'+
        '<span class="muted">'+te('Above this an indent needs the administrator. Blank means no ceiling.')+'</span></label>'+
    '</div>'+
    '<label class="field"><span class="field-label">'+te('Notes')+'</span>'+
      '<input class="input" id="iNotes" value="'+esc(v('notes'))+'"></label>'+
    (isAdmin ? '' :
      '<p class="muted" style="margin:4px 0 12px">'+
        te('The administrator sees this before it reaches the list.')+'</p>')+
    '<button class="btn btn-primary btn-block btn-3d" id="iSave">'+te('Save item')+'</button>');

  function redrawRop(){
    var lead   = Number(c.querySelector('#iLead').value) || 0;
    var safety = Number(c.querySelector('#iSafety').value) || 0;
    var adc    = editing ? Number(item.adc) || 0 : 0;
    var ov     = c.querySelector('#iRopOv').value.trim();
    var box = c.querySelector('#iRop');
    if (ov !== ''){
      box.innerHTML = '<span>'+te('Reorder point')+'</span><b>'+qty(ov)+'</b> '+
                      '<span class="muted">'+te('your own figure')+'</span>';
      return;
    }
    var rop = Math.round(((adc * lead) + safety) * 100) / 100;
    box.innerHTML = '<span>'+te('Reorder point')+'</span><b>'+qty(rop)+'</b> '+
      '<span class="muted">'+qty(adc)+' '+te('a day')+' × '+qty(lead)+' '+te('days')+' + '+
      qty(safety)+' '+te('buffer')+'</span>';
  }
  ['#iLead','#iSafety','#iRopOv'].forEach(function(sel){
    c.querySelector(sel).addEventListener('input', redrawRop);
  });
  redrawRop();

  c.querySelector('#iSave').addEventListener('click', function(){
    var p = {
      site       : site,
      name       : c.querySelector('#iName').value.trim(),
      partNumber : c.querySelector('#iPart').value.trim(),
      unit       : c.querySelector('#iUnit').value,
      section    : c.querySelector('#iSection').value,
      leadDays   : c.querySelector('#iLead').value.trim() || 0,
      safetyStock: c.querySelector('#iSafety').value.trim() || 0,
      ropOverride: c.querySelector('#iRopOv').value.trim(),
      minOrderQty: c.querySelector('#iMin').value.trim() || 0,
      maxOrderQty: c.querySelector('#iMax').value.trim() || 0,
      notes      : c.querySelector('#iNotes').value.trim()
    };
    var openBox = c.querySelector('#iOpen');
    if (openBox) p.initialStock = openBox.value.trim() || 0;
    if (editing) p.code = item.code;
    busy(true);
    api(editing ? 'updateItem' : 'addItem', p).then(function(r){
      busy(false); closeOverlay('modal');
      if (r && r.pending) toast(r.message || t('Sent to the administrator to approve.'), 'ok');
      else toast(t(editing ? 'Item updated' : 'Item added'), 'ok');
      STOCK.site = '';                       // force the indent form to re-read
      invalidateViews();
      render('stock', { fresh:true });
    }).catch(function(e){ busy(false); toast(e.message, 'err'); });
  });
}

              '<td>'+(r.issuedTo ? esc(r.issuedTo) : '<span class="muted">—</span>')+'</td>'+
              '<td>'+(r.indentId ? '<button class="btn btn-ghost btn-sm" data-open="'+esc(r.indentId)+'">'+
                      esc(r.indentId)+'</button>' : '<span class="muted">'+te('manual')+'</span>')+'</td>'+
            '</tr>';
          }).join('') +'</tbody></table></div>'
        : emptyState('🚚', t('Nothing moved in this period'),
            t('No goods came in or went out of this site between those dates.'));

      var more = (d.total > d.shown
        ? '<p class="muted" style="margin-top:10px">'+
          te('Showing the newest')+' '+d.shown+' '+te('of')+' '+d.total+' — '+
          te('narrow the dates or search to see the rest.')+'</p>' : '')+
        (d.rows.some(function(r){ return r.moves === false; })
          ? '<p class="muted" style="margin-top:10px">'+
            te('Greyed rows are goods in transit — counted at a hub or bought over a counter. They are on the record but have not reached the shelf, so they are not in the two totals.')+
            '</p>' : '');

      return pageHead(t('Goods movement'),
          esc(d.site) + ' · ' + esc(rangeNote(d.range))) + bar + head + body + more;
  });
}

/* ==================================================================
   Site transfer — goods moving between two of the four sites
   ------------------------------------------------------------------
   No indent, no purchase, no approval. One storekeeper puts something
   on a lorry and another counts it off. The screen is two lists: what
   is waiting for you to receive, and everything else that has moved.
   ================================================================== */
var trfFilter = { site:'', q:'' };

var TRF_STATUS = {
  IN_TRANSIT   : { pill:'h-DUE_SOON', word:'On the way' },
  AWAITING_ITEM: { pill:'h-DELAYED',  word:'Waiting on the administrator' },
  RECEIVED     : { pill:'h-ON_TIME',  word:'Received' },
  CANCELLED    : { pill:'h-CLOSED',   word:'Cancelled' }
};
function trfStatus(s){ return TRF_STATUS[s] || TRF_STATUS.RECEIVED; }

function viewTransfers(){
  return api('transfers', { site: trfFilter.site, q: trfFilter.q }).then(function(d){
    setBadge('transfers', d.counts.incoming);

    var picker = (!d.isStore && d.sites.length > 1)
      ? '<div class="seg"><button data-trfsite="" class="'+(trfFilter.site?'':'on')+'">'+
          te('All sites')+'</button>'+ d.sites.map(function(s){
            return '<button data-trfsite="'+esc(s)+'" class="'+(trfFilter.site===s?'on':'')+'">'+
                   esc(s)+'</button>';
          }).join('') +'</div>'
      : '<span class="site-badge lg">'+esc(d.site)+'</span>';

    var bar = '<div class="toolbar">'+ picker +
      '<div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>'+
      '<input id="tq" placeholder="'+te('Item, part number, person or transfer no…')+'" value="'+esc(trfFilter.q)+'"></div></div>';

    var send = d.canSend
      ? '<button class="btn btn-primary btn-3d" id="sendTrfBtn">'+te('+ Send to another site')+'</button>' : '';

    var incoming = d.incoming.length
      ? '<div class="section-title">'+te('Waiting for you to count in')+' · '+d.incoming.length+'</div>'+
        '<div class="grid cards">'+ d.incoming.map(function(t){
          return '<div class="card q-card trf-in">'+ trfHead(t) +
            '<div class="q-lines">'+
              trfLine('Coming from', esc(t.fromSite) + ' · ' + esc(t.sentBy))+
              trfLine('Sent', fmtDT(t.sentAt))+
              trfLine('Quantity', '<b>'+qty(t.quantity)+' '+te(t.unit)+'</b>')+
              (t.sentRemarks ? trfLine('Their note', esc(t.sentRemarks)) : '')+
            '</div>'+
            trfShots(t)+
            '<div class="modal-actions" style="margin-top:12px">'+
              '<button class="btn btn-emerald btn-3d btn-block" data-receivetrf=\''+
                esc(JSON.stringify({ id:t.id, name:t.name, partNumber:t.partNumber,
                                     unit:t.unit, quantity:t.quantity,
                                     fromSite:t.fromSite, sentBy:t.sentBy }))+'\'>'+
                te('Count it in')+'</button>'+
            '</div></div>';
        }).join('') +'</div>'
      : '';

    var body = d.rows.length
      ? '<div class="section-title">'+te('Every transfer')+'</div>'+
        '<div class="tablewrap"><table><thead><tr>'+
          '<th>'+te('Transfer')+'</th><th>'+te('Item')+'</th><th>'+te('Part number')+'</th>'+
          '<th>'+te('From')+'</th><th>'+te('To')+'</th><th>'+te('Quantity')+'</th>'+
          '<th>'+te('Sent')+'</th><th>'+te('Status')+'</th>'+(d.canCancel ? '<th></th>' : '')+
        '</tr></thead><tbody>'+
        d.rows.map(function(t){
          var st = trfStatus(t.status);
          return '<tr>'+
            '<td class="mono">'+esc(t.id)+'</td>'+
            '<td><b>'+esc(t.name)+'</b></td>'+
            '<td>'+esc(t.partNumber||'—')+'</td>'+
            '<td><span class="site-badge">'+esc(t.fromSite)+'</span></td>'+
            '<td><span class="site-badge">'+esc(t.toSite)+'</span></td>'+
            '<td><b>'+qty(t.quantity)+'</b> '+te(t.unit)+'</td>'+
            '<td>'+fmtDT(t.sentAt)+'<div class="muted">'+esc(t.sentBy)+'</div></td>'+
            '<td><span class="pill '+st.pill+'">'+te(st.word)+'</span>'+
              (t.cancelReason ? '<div class="muted">'+esc(t.cancelReason)+'</div>' : '')+
              (t.receivedBy ? '<div class="muted">'+esc(t.receivedBy)+' · '+fmtDT(t.receivedAt)+'</div>' : '')+
            '</td>'+
            (d.canCancel
              ? '<td>'+(t.status === 'IN_TRANSIT' || t.status === 'AWAITING_ITEM'
                  ? '<button class="btn btn-ghost btn-sm" data-canceltrf="'+esc(t.id)+'">'+
                    te('Cancel')+'</button>' : '')+'</td>'
              : '')+
          '</tr>';
        }).join('') +'</tbody></table></div>'
      : emptyState('🚚',
          trfFilter.q ? t('No transfer matches that') : t('Nothing has moved between sites yet'),
          trfFilter.q ? t('Try a shorter word, or part of the transfer number.')
            : (d.canSend
                ? t('When you send something to another site it appears here, and on their screen to be counted in.')
                : t('Transfers between the four sites show up here as the store teams make them.')));

    var tiles = '<div class="grid stats">'+
      [['s-amber',  d.counts.incoming,  t('Waiting on you')],
       ['s-sky',    d.counts.inTransit, t('On the way')],
       ['s-violet', d.counts.awaiting,  t('Waiting on the administrator')],
       ['s-emerald',d.counts.received,  t('Received')]].map(function(x){
        return '<div class="stat '+x[0]+'"><div class="n">'+x[1]+'</div>'+
               '<div class="l">'+esc(x[2])+'</div></div>';
      }).join('')+'</div>';

    return pageHead(t('Site transfer'),
        t('Goods moving between two sites. No indent, no purchase — one store sends, the other counts it in.'),
        send) + tiles + bar + incoming + body;
  });
}

function trfHead(t2){
  var st = trfStatus(t2.status);
  return '<div class="q-head"><div><b>'+esc(t2.name)+'</b>'+
    (t2.partNumber ? ' <span class="muted">· '+esc(t2.partNumber)+'</span>' : '')+
    '<div class="muted">'+esc(t2.id)+' · '+esc(t2.fromSite)+' → '+esc(t2.toSite)+'</div>'+
    '</div><span class="pill '+st.pill+'">'+te(st.word)+'</span></div>';
}
function trfLine(label, value){
  return '<div class="q-line"><span>'+te(label)+'</span><b>'+value+'</b></div>';
}
/** The photographs on a transfer, both ends of it. */
function trfShots(t2){
  if (!t2.photos || !t2.photos.length) return '';
  return '<div class="gallery" style="margin-top:11px">'+ t2.photos.map(function(a){
    return '<a class="shot" href="'+esc(a.url)+'" target="_blank" rel="noopener">'+
      '<div class="shot-kind">'+esc(t(a.label))+'</div>'+
      '<div class="shot-meta">'+esc(a.by)+'</div>'+
      '<span class="shot-open">'+te('Open ↗')+'</span></a>';
  }).join('') +'</div>';
}

/* ------------------------------------------------------------------
   Sending
   ------------------------------------------------------------------ */
function sendTransferDialog(d){
  var site = d.site;
  var items = STOCK.site === site ? STOCK.items : [];

  function build(list){
    return '<option value="">'+te('Choose an item…')+'</option>'+ list.map(function(i){
      return '<option value="'+esc(i.code)+'" data-stock="'+esc(String(i.stock))+'" '+
             'data-unit="'+esc(i.unit)+'" data-name="'+esc(i.name)+'" '+
             'data-part="'+esc(i.partNumber||'')+'">'+
             esc(i.name)+(i.partNumber ? ' · '+esc(i.partNumber) : '')+
             ' — '+qty(i.stock)+' '+esc(i.unit)+'</option>';
    }).join('');
  }

  var c = showModal('<h3 class="modal-title">'+te('Send to another site')+'</h3>'+
    '<p class="modal-sub">'+te('From')+' '+esc(site)+'</p>'+
    '<p class="muted" style="margin-top:0">'+
      te('It comes off this shelf the moment you send it, and lands on theirs when they count it in. In between it is on a lorry and on neither.')+
    '</p>'+
    '<label class="field"><span class="field-label">'+te('Item *')+'</span>'+
      '<select class="input" id="tItem">'+build(items)+'</select>'+
      '<span class="muted" id="tShelf"></span></label>'+
    '<div class="row two">'+
      '<label class="field"><span class="field-label">'+te('Quantity *')+'</span>'+
        '<input class="input" id="tQty" inputmode="decimal" value="" data-max="0"></label>'+
      '<label class="field"><span class="field-label">'+te('Sending it to *')+'</span>'+
        '<select class="input" id="tTo"><option value="">'+te('Choose a site…')+'</option>'+
        (d.targets||[]).map(function(s){ return '<option>'+esc(s)+'</option>'; }).join('')+
        '</select></label>'+
    '</div>'+
    '<div class="section-title" style="margin-top:6px">'+te('Photos of the material *')+'</div>'+
    '<p class="muted" style="margin:-6px 0 12px">'+
      te('This is what the other site checks against when it arrives. At least one.')+'</p>'+
    '<div class="row three">'+
      photoField('trf1', '📷 '+t('Photo 1'), '')+
      photoField('trf2', '📷 '+t('Photo 2'), '')+
      photoField('trf3', '📷 '+t('Photo 3'), '')+
    '</div>'+
    '<label class="field"><span class="field-label">'+te('Remarks')+'</span>'+
      '<input class="input" id="tNote" placeholder="'+te('Anything the other store should know')+'"></label>'+
    '<button class="btn btn-primary btn-block btn-3d" id="tGo">'+te('Send it')+'</button>'+
    '<div class="why" id="tWhy"></div>');

  wirePhotos(c);

  var sel = c.querySelector('#tItem'), qtyBox = c.querySelector('#tQty');
  var shelf = c.querySelector('#tShelf'), why = c.querySelector('#tWhy');
  var go = c.querySelector('#tGo'), toSel = c.querySelector('#tTo');

  function check(){
    var o = sel.options[sel.selectedIndex];
    var have = o && o.value ? Number(o.getAttribute('data-stock')) || 0 : 0;
    var unit = o && o.value ? o.getAttribute('data-unit') : '';
    qtyBox.setAttribute('data-max', String(have));
    shelf.textContent = o && o.value
      ? (t('On the shelf') + ': ' + qty(have) + ' ' + t(unit))
      : '';

    var raw = String(qtyBox.value).trim();
    var n = raw === '' ? NaN : Number(raw);
    var stop = '';
    if (!sel.value)                      stop = t('Choose the item you are sending.');
    else if (!toSel.value)               stop = t('Choose the site you are sending it to.');
    else if (raw === '')                 stop = t('How much are you sending? Enter a number.');
    else if (isNaN(n) || !isFinite(n))   stop = t('The quantity must be a number.');
    else if (n <= 0)                     stop = t('The quantity must be more than zero.');
    else if (n > have)                   stop = t('There is only') + ' ' + qty(have) + ' ' +
                                                t(unit) + ' ' + t('on the shelf. You cannot send') +
                                                ' ' + qty(n) + '.';
    else if (!['trf1','trf2','trf3'].some(photo))
                                         stop = t('Attach at least one photo of the material.');
    go.disabled = !!stop;
    go.classList.toggle('is-off', !!stop);
    why.textContent = stop;
    why.classList.toggle('show', !!stop);
    if (!stop && o && o.value){
      shelf.textContent = t('On the shelf') + ': ' + qty(have) + ' ' + t(unit) + ' · ' +
                          qty(have - n) + ' ' + t('would be left here');
    }
  }
  ['change','input'].forEach(function(ev){
    sel.addEventListener(ev, check); qtyBox.addEventListener(ev, check); toSel.addEventListener(ev, check);
  });
  // a photo landing is not an input event on anything, so poll while the dialog is up
  var tick = setInterval(check, 400);
  c.addEventListener('DOMNodeRemoved', function(){ clearInterval(tick); });
  check();

  go.addEventListener('click', function(){
    var o = sel.options[sel.selectedIndex];
    busy(true);
    api('sendTransfer', {
      toSite: toSel.value, code: sel.value,
      name: o.getAttribute('data-name'), partNumber: o.getAttribute('data-part'),
      quantity: qtyBox.value.trim(), remarks: c.querySelector('#tNote').value.trim(),
      photos: ['trf1','trf2','trf3'].map(photo).filter(Boolean)
    }).then(function(r){
      busy(false); clearInterval(tick); closeOverlay('modal');
      toast(qty(r.quantity) + ' ' + t(r.unit) + ' ' + t('on the way to') + ' ' + r.toSite, 'ok');
      STOCK.site = '';
      invalidateViews();
      render('transfers', { fresh:true });
    }).catch(function(e){ busy(false); toast(e.message, 'err'); });
  });
}

/* ------------------------------------------------------------------
   Receiving
   ------------------------------------------------------------------ */
function receiveTransferDialog(t2){
  var c = showModal('<h3 class="modal-title">'+te('Count it in')+'</h3>'+
    '<p class="modal-sub">'+esc(t2.id)+' · '+te('from')+' '+esc(t2.fromSite)+'</p>'+
    '<div class="readout-row"><span>'+esc(t2.name)+
      (t2.partNumber ? ' · '+esc(t2.partNumber) : '')+'</span>'+
      '<b>'+qty(t2.quantity)+' '+te(t2.unit)+'</b>'+
      '<span class="muted">'+te('sent by')+' '+esc(t2.sentBy)+'</span></div>'+
    '<label class="field"><span class="field-label">'+te('How much came off the vehicle? *')+'</span>'+
      '<input class="input" id="rQty" inputmode="decimal" value="" '+
      'placeholder="'+te('Count it, do not copy it')+'">'+
      '<span class="muted" id="rNote">'+
        te('It has to match what they sent. If it does not, sort it out with them before receiving it — something has gone missing.')+
      '</span></label>'+
    '<div class="section-title" style="margin-top:6px">'+te('Photos of what arrived *')+'</div>'+
    '<div class="row three">'+
      photoField('rcv1', '📷 '+t('Photo 1'), '')+
      photoField('rcv2', '📷 '+t('Photo 2'), '')+
      photoField('rcv3', '📷 '+t('Photo 3'), '')+
    '</div>'+
    '<label class="field"><span class="field-label">'+te('Remarks')+'</span>'+
      '<input class="input" id="rNoteTxt" placeholder="'+te('Condition, damage, anything odd')+'"></label>'+
    '<button class="btn btn-emerald btn-block btn-3d" id="rGo2">'+te('Receive it')+'</button>'+
    '<div class="why" id="rWhy"></div>');

  wirePhotos(c);

  var box = c.querySelector('#rQty'), why = c.querySelector('#rWhy');
  var note = c.querySelector('#rNote'), go = c.querySelector('#rGo2');
  var sent = Number(t2.quantity) || 0;

  function check(){
    var raw = String(box.value).trim();
    var n = raw === '' ? NaN : Number(raw);
    var stop = '';
    if (raw === '')                    stop = t('Count what came off the vehicle and enter it.');
    else if (isNaN(n) || !isFinite(n)) stop = t('The quantity must be a number.');
    else if (n !== sent)               stop = esc(t2.fromSite) + ' ' + t('sent') + ' ' + qty(sent) +
                                              ' ' + t(t2.unit) + ' ' + t('and you have counted') +
                                              ' ' + qty(n) + '. ' +
                                              t('Sort out the difference before receiving it.');
    else if (!['rcv1','rcv2','rcv3'].some(photo))
                                       stop = t('Attach at least one photo of what you received.');
    go.disabled = !!stop;
    go.classList.toggle('is-off', !!stop);
    why.textContent = stop;
    why.classList.toggle('show', !!stop);
    note.textContent = (!isNaN(n) && n === sent)
      ? t('That matches what they sent.')
      : t('It has to match what they sent. If it does not, sort it out with them before receiving it — something has gone missing.');
  }
  ['input','change'].forEach(function(ev){ box.addEventListener(ev, check); });
  var tick = setInterval(check, 400);
  check();

  go.addEventListener('click', function(){
    busy(true);
    api('receiveTransfer', {
      transferId: t2.id, receivedQty: box.value.trim(),
      remarks: c.querySelector('#rNoteTxt').value.trim(),
      photos: ['rcv1','rcv2','rcv3'].map(photo).filter(Boolean)
    }).then(function(r){
      busy(false); clearInterval(tick); closeOverlay('modal');
      toast(r.listed
        ? (qty(r.receivedQty) + ' ' + t(t2.unit) + ' ' + t('are on your shelf now'))
        : (r.message || t('Sent to the administrator to approve.')), 'ok');
      STOCK.site = '';
      invalidateViews();
      render('transfers', { fresh:true });
    }).catch(function(e){ busy(false); toast(e.message, 'err'); });
  });
}

      }).join('') +'</div></div>';

      return pageHead(t('Item changes'), t('Nothing reaches the item list without the administrator.')) +
        bar + emptyState('🗂️',
          itemReqFilter.status === 'PENDING' ? t('Nothing is waiting') : t('Nothing here'),
          itemReqFilter.status === 'PENDING'
            ? t('Every item change has been decided.')
            : t('No request has that status yet.'));
    }

    var cards = rows.map(function(r){
      var head = '<div class="q-head"><div>'+
        '<b>'+esc(r.name || t('an item'))+'</b>'+
        (r.partNumber ? ' <span class="muted">· '+esc(r.partNumber)+'</span>' : '')+
        '<div class="muted">'+esc(r.id)+' · '+esc(r.site)+' · '+
          te(r.kind === 'ADD' ? 'New item' : 'Change to an existing item')+'</div>'+
        '</div><span class="pill '+
          (r.status==='PENDING' ? 'h-DUE_SOON' : r.status==='APPROVED' ? 'h-ON_TIME' : 'h-CRITICAL')+'">'+
          te(r.status === 'PENDING' ? 'Waiting' : r.status === 'APPROVED' ? 'Approved' : 'Turned down')+
        '</span></div>';

      var adding = r.kind === 'ADD';
      var fields = r.fields.length
        ? '<div class="q-lines">'+ r.fields.map(function(f){
            var to = f.to ? esc(f.to) : '<span class="muted">'+te('blank')+'</span>';
            // a brand-new item has no "before", so there is nothing to show one
            return '<div class="q-line"><span>'+te(f.label)+'</span><b>'+
              (adding ? to
                      : (f.from ? esc(f.from) : '<span class="muted">'+te('blank')+'</span>') +
                        ' <span class="muted">→</span> ' + to)+
            '</b></div>';
          }).join('') +'</div>' : '';

      var foot = '<div class="muted" style="margin-top:8px">'+
        te('Asked by')+' '+esc(r.by)+' · '+fmtDT(r.at)+
        (r.indentId ? ' · <button class="btn btn-ghost btn-sm" data-open="'+esc(r.indentId)+'">'+
                      esc(r.indentId)+'</button>' : '')+
        (r.decidedBy ? '<br>'+te(r.status === 'APPROVED' ? 'Approved by' : 'Turned down by')+' '+
                       esc(r.decidedBy)+' · '+fmtDT(r.decidedAt)+
                       (r.note ? ' · ' + esc(r.note) : '') : '')+
      '</div>';

      var acts = (isAdmin && r.status === 'PENDING')
        ? '<div class="modal-actions" style="margin-top:12px">'+
            '<button class="btn btn-ghost" data-rejectitem="'+esc(r.id)+'">'+te('Turn down')+'</button>'+
            '<button class="btn btn-primary btn-3d" data-approveitem="'+esc(r.id)+'">'+te('Approve')+'</button>'+
          '</div>' : '';

      return '<div class="card q-card">'+head+fields+foot+acts+'</div>';
    }).join('');

    return pageHead(t('Item changes'),
        isAdmin ? t('Approve or turn down what the store wants on the item list.')
                : t('What you have sent the administrator, and what came of it.')) +
      bar + '<div class="grid cards">'+cards+'</div>';
  });
}

function decideItemDialog(id, approve){
  var c = showModal('<h3 class="modal-title">'+
      te(approve ? 'Approve this change?' : 'Turn this change down?')+'</h3>'+
    '<p class="modal-sub">'+esc(id)+'</p>'+
    '<label class="field"><span class="field-label">'+
      te(approve ? 'Note (optional)' : 'Why? *')+'</span>'+
      '<textarea class="input" id="dNote" rows="3" placeholder="'+
      te(approve ? 'Anything the store should know.' : 'The store sees this, so say what is wrong.')+
      '"></textarea></label>'+
    '<div class="modal-actions">'+
      '<button class="btn btn-ghost" data-close="modal">'+te('Cancel')+'</button>'+
      '<button class="btn '+(approve?'btn-primary':'btn-rose')+' btn-3d" id="dGo">'+
        te(approve ? 'Approve' : 'Turn it down')+'</button>'+
    '</div>');
  c.querySelector('#dGo').addEventListener('click', function(){
    var note = c.querySelector('#dNote').value.trim();
    if (!approve && !note) return toast(t('Say why you are turning it down, so the store knows.'), 'err');
    busy(true);
    api('decideItem', { requestId:id, decision: approve ? 'APPROVE' : 'REJECT', note:note })
      .then(function(){
        busy(false); closeOverlay('modal');
        toast(t(approve ? 'Approved — it is on the list now' : 'Turned down'), 'ok');
        STOCK.site = '';
        invalidateViews(); render('itemreq', { fresh:true });
      }).catch(function(e){ busy(false); toast(e.message, 'err'); });
  });
}

        '<span class="diag-ico">'+(c.ok?'✓':'✕')+'</span>'+
        '<div><b>'+te(c.label)+'</b>'+

    (d.pending && d.pending.length
      ? '<div class="section-title">'+te('Waiting at Telegram right now')+'</div>'+

function wireDiag(root){
  var rw = (root || document).querySelector('#tgRewind');
  if (!rw || rw._wired) return;
  rw._wired = true;
  rw.addEventListener('click', function(){
    busy(true);
    api('tgRewind').then(function(r){
      busy(false);
      toast('Re-read '+r.handled+' message(s)','ok');
      S.diag = null;
      invalidateViews(); render('notify', { fresh:true });
    }).catch(function(e){ busy(false); toast(e.message,'err'); });
  });
}

var _tgPoll = null;
function wireNotify(root){
  if (_tgPoll){ clearInterval(_tgPoll); _tgPoll = null; }

  var connect = root.querySelector('#tgConnect');
  if (connect) connect.addEventListener('click', function(){
    busy(true);
    api('telegramLink').then(function(l){
      busy(false);
      root.querySelector('#tgStep2').classList.remove('hidden');
      root.querySelector('#tgCode').textContent = '/start ' + l.code;
      root.querySelector('#tgBot').textContent = '@' + l.botUsername;
      try { window.open(l.url, '_blank', 'noopener'); } catch(e){}
      connect.textContent = 'Open Telegram again';
      // watch for the link happening, then refresh by itself
      var tries = 0;
      _tgPoll = setInterval(function(){
        if (++tries > 40){ clearInterval(_tgPoll); _tgPoll = null; return; }
        api('telegramStatus').then(function(st){
          if (st.linked){
            clearInterval(_tgPoll); _tgPoll = null;
            celebrate(t('Telegram connected'), 'You will be notified the moment work reaches you');
            invalidateViews();
            var still2 = sessionGuard();
            setTimeout(function(){ if (still2()) render('notify', { fresh:true }); }, 900);
          }
        }).catch(function(){});
      }, 3000);
    }).catch(function(e){ busy(false); toast(e.message,'err'); });
  });

  var copy = root.querySelector('#tgCopy');
  if (copy) copy.addEventListener('click', function(){
    var txt = root.querySelector('#tgCode').textContent;
    try {
      if (navigator.clipboard) navigator.clipboard.writeText(txt);
      else {
        var ta = document.createElement('textarea');
        ta.value = txt; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove();
      }
      toast(t('Copied — paste it into the bot chat'),'ok');
    } catch(e){ toast(t('Select the line and copy it manually'),'warn'); }
  });

  var check = root.querySelector('#tgCheck');
  if (check) check.addEventListener('click', function(){
    busy(true);
    api('telegramCheckNow').then(function(r){
      busy(false);
      if (r.linked){
        celebrate(t('Telegram connected'), 'You will be notified the moment work reaches you');
        invalidateViews();
        var still3 = sessionGuard();

        toast(t('Nothing from Telegram yet — send the line above to the bot, then tap this again'), 'warn');

  var diag = root.querySelector('#tgDiag');

      // look the target up live: a background redraw may have replaced the pane

  var test = root.querySelector('#tgTest');
  if (test) test.addEventListener('click', function(){
    busy(true);
    api('telegramTest').then(function(){ busy(false); toast(t('Sent — check Telegram'),'ok'); })
