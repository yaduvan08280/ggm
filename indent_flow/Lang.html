/* ------------------------------------------------------------------ */
var LANG = 'EN';
function setLang(code){ LANG = (code === 'HI') ? 'HI' : 'EN'; }
function localeOf(){ return LANG === 'HI' ? 'hi-IN' : 'en-IN'; }

/** Translate. Unknown phrases fall back to the English they were written in. */
function t(phrase){
  if (LANG === 'EN') return phrase;
  var d = I18N[LANG];
  if (!d) return phrase;
  var hit = d[phrase];
  return hit === undefined ? phrase : hit;
}
/** Translate and HTML-escape in one go. */
function te(phrase){ return esc(t(phrase)); }
