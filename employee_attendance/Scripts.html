<script>
/* =====================================================================
   Attendance — client
   Speed: the last copy of every screen is kept on the phone and drawn the
   instant the app opens; one server call (bootstrap) then brings it up to
   date. Opened from a GGM Portal tile, even that call is already in the page.
   ===================================================================== */

let CFG = { refreshSeconds: 30, scope: [], allSites: [] };
let VIEW = null, ENTERED = false;
let ACTIVE_SITE = 'ALL';
let VERIFY_FILTER = 'pending', VERIFY_QUERY = '';
let STAFF_SITE = 'ALL', STAFF_FILTER = 'all', STAFF_QUERY = '';
let USERS_FILTER = 'all', USERS_QUERY = '';
let MARK_DATA = null, MARK_FILTER = 'all', MARK_QUERY = '';
let MARK_BUSY = {}, PENDING_MARKS = {};

const TOKEN_KEY = 'ggm_att_token';
const SNAP_KEY = 'att_snap_v2';

/* ---------------- icons (line icons, the hub's style) ---------------- */

const ICON = {

  pct: '<path d="M19 5L5 19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/>',
  down: '<path d="M3 7l6 6 4-4 8 8"/><path d="M14 17h7v-7"/>',
  folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  camera: '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
  image: '<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
  print: '<path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/>'
};
function ic(name) { return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">' + (ICON[name] || '') + '</svg>'; }
function paintIcons(root) {
  (root || document).querySelectorAll('[data-ic]').forEach(el => { if (!el.dataset.icDone) { el.insertAdjacentHTML('afterbegin', ic(el.dataset.ic)); el.dataset.icDone = 1; } });
}

/* ---------------- plumbing ---------------- */

function call(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn].apply(null, args);
  });
}
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
/** A value for a JS string inside an onclick="…" attribute. */
function js(s) { return esc(String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/'/g, "\\'")); }
function $(id) { return document.getElementById(id); }
function fmt(n) { return typeof n === 'number' ? n.toLocaleString('en-IN') : esc(n); }
function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
function initials(name) {
  const p = String(name || '?').trim().split(/\s+/);
  return ((p[0] || '?')[0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
}
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function debounce(key, fn, ms) { clearTimeout(TIMERS[key]); TIMERS[key] = setTimeout(fn, ms || 80); }

function toast(msg, kind) {
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  el.innerHTML = (kind === 'ok' ? ic('check') : kind === 'bad' ? ic('alert') : '') + '<span>' + esc(msg) + '</span>';
  $('toasts').appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 320); }, 2600);
}
function handleError(err) {
  const msg = String((err && err.message) || err || 'Something went wrong');
  if (msg.indexOf('SESSION_EXPIRED') !== -1) { forceSignOut('Your sign-in has ended. Please sign in again.'); return; }
  $('liveDot') && $('liveDot').classList.add('stale');
  toast(msg.replace(/^Error:\s*/, ''), 'bad');
}
function skeleton(n) { return new Array(n || 3).fill('<div class="skel"></div>').join(''); }
function empty(icon, title, text) {
  return `<div class="empty"><div class="e-ic">${ic(icon)}</div><b>${esc(title)}</b><p>${text || ''}</p></div>`;
}

/* ---------------- the phone's copy of every screen ---------------- */

const STORE = {}, INFLIGHT = {};
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
function lsJson(k) { try { return JSON.parse(lsGet(k) || 'null'); } catch (e) { return null; } }
function skey(k) { return 'att_d_' + (SESSION ? SESSION.username + '_' + SESSION.role + '_' + (SESSION.site || '') : '') + '_' + k; }
/** The newest copy we have (memory, else the phone) — never yesterday's. */
function got(k) {
  if (!STORE[k]) { const v = lsJson(skey(k)); if (v && v.date === todayStr()) STORE[k] = v; }
  return STORE[k] ? STORE[k].d : null;
}
function put(k, d) { STORE[k] = { d: d, at: Date.now(), date: todayStr() }; lsSet(skey(k), JSON.stringify(STORE[k])); return d; }
function save(k) { if (STORE[k]) lsSet(skey(k), JSON.stringify(STORE[k])); }
function age(k) { return STORE[k] && STORE[k].at ? Date.now() - STORE[k].at : Infinity; }
/** One request per screen at a time; the answer becomes the new copy. */
function fetchStore(k, fn) {
  if (INFLIGHT[k]) return INFLIGHT[k];
  const args = Array.prototype.slice.call(arguments, 2);
  const p = call.apply(null, [fn].concat(args)).then(d => {
    delete INFLIGHT[k];
    $('liveDot') && $('liveDot').classList.remove('stale');
    return put(k, d);
  }, err => { delete INFLIGHT[k]; throw err; });
  return (INFLIGHT[k] = p);
}
function ensureToday() { return got('today') ? Promise.resolve(got('today')) : fetchStore('today', 'getTodayRows', SESSION.token, 'ALL'); }

/* ---------------- employee photos ----------------
   Every avatar is <div class="emp-av" data-pid="ID">; paintPhotos() fills those that have a
   photo (thumbs fetched once, only for people on screen, then kept on the phone). Tapping an
   avatar opens the photo sheet: see it big, take one with the camera, or pick from the gallery. */

const PH = { idx: lsJson('att_phidx') || {}, thumbs: {}, want: new Set() };

/** Avatar for an employee: their photo, else initials with a camera badge. */
function av(site, id, name, cls) {
  return `<div class="emp-av ${cls || ''}" data-pid="${esc(id)}" onclick="photoTap(event,'${js(site)}','${js(id)}','${js(name)}')">${esc(initials(name))}<span class="cam">${ic('camera')}</span></div>`;
}
function thumbOf(id) {
  const v = PH.idx[id];
  if (!v) return null;
  if (PH.thumbs[id] && PH.thumbs[id].v === v) return PH.thumbs[id].t;
  const c = lsGet('att_pt_' + id);
  if (c && c.slice(0, c.indexOf('|')) === String(v)) { PH.thumbs[id] = { v: v, t: c.slice(c.indexOf('|') + 1) }; return PH.thumbs[id].t; }
  return null;
}
function paintPhotos() {
  document.querySelectorAll('[data-pid]').forEach(el => {
    const id = el.dataset.pid, t = thumbOf(id);
    if (t) {
      if (el.dataset.ph !== String(PH.idx[id])) { el.style.backgroundImage = 'url("' + t + '")'; el.classList.add('has-ph'); el.dataset.ph = String(PH.idx[id]); }
    } else {
      if (el.dataset.ph) { el.style.backgroundImage = ''; el.classList.remove('has-ph'); delete el.dataset.ph; }
      if (PH.idx[id]) PH.want.add(id);
    }
  });
  if (PH.want.size) debounce('thumbs', fetchThumbs, 120);
}
function fetchThumbs() {
  if (!SESSION) return;
  const ids = Array.from(PH.want).slice(0, 150);
  ids.forEach(id => PH.want.delete(id));
  call('getPhotoThumbs', SESSION.token, ids).then(got => {
    Object.keys(got || {}).forEach(id => {
      PH.thumbs[id] = { v: PH.idx[id], t: got[id] };
      lsSet('att_pt_' + id, PH.idx[id] + '|' + got[id]);
    });
    paintPhotos();
  }).catch(() => {});
}
function loadPhotoIndex() {
  if (!SESSION) return;
  call('getPhotoIndex', SESSION.token).then(idx => { PH.idx = idx || {}; lsSet('att_phidx', JSON.stringify(PH.idx)); paintPhotos(); }).catch(() => {});
}
new MutationObserver(() => debounce('paintph', paintPhotos, 60)).observe(document.documentElement, { childList: true, subtree: true });

function photoTap(ev, site, id, name) {
  ev.stopPropagation();
  openPhotoSheet(site, id, name);
}

/* --- taking / picking a picture: any size in, a small clear face out --- */

let SHOT = null;   // the picture waiting to be saved: { thumb, photo }
function photoPickers(prefix) {
  return `<div class="ph-pick">
      <label class="btn btn-ghost btn-sm">${ic('camera')}Take photo<input type="file" accept="image/*" capture="environment" onchange="pickedPhoto(this,'${prefix}')"></label>
      <label class="btn btn-ghost btn-sm">${ic('image')}From gallery<input type="file" accept="image/*" onchange="pickedPhoto(this,'${prefix}')"></label>
    </div>`;
}
function loadImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('That file is not a picture this phone can read.')); };
    img.src = url;
  });
}
/** Photo: longest side ≤ 480 px, JPEG, under a sheet cell's limit. Thumb: 120 px square from the centre. */
function shrinkPhoto(img) {
  const c = document.createElement('canvas'), x = c.getContext('2d');
  let side = 480, q = 0.82, out = '';
  for (let i = 0; i < 12; i++) {
    const k = Math.min(1, side / Math.max(img.naturalWidth, img.naturalHeight));
    c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
    x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
    x.drawImage(img, 0, 0, c.width, c.height);
    out = c.toDataURL('image/jpeg', q);
    if (out.length <= 46000) break;
    if (q > 0.5) q -= 0.08; else side = Math.round(side * 0.85);
  }
  const t = document.createElement('canvas'), tx = t.getContext('2d'), s = Math.min(img.naturalWidth, img.naturalHeight);
  t.width = t.height = 120;
  tx.drawImage(img, (img.naturalWidth - s) / 2, Math.max(0, (img.naturalHeight - s) / 3), s, s, 0, 0, 120, 120);
  return { photo: out, thumb: t.toDataURL('image/jpeg', 0.72) };
}
function pickedPhoto(input, prefix) {
  const f = input.files && input.files[0];
  input.value = '';
  if (!f) return;
  const box = $(prefix + 'Prev');
  if (box) box.innerHTML = '<div class="skel" style="height:100%;margin:0"></div>';
  loadImage(f).then(img => {
    SHOT = shrinkPhoto(img);
    if (box) { box.innerHTML = ''; box.style.backgroundImage = 'url("' + SHOT.photo + '")'; box.classList.add('has-ph'); }
    const save = $(prefix + 'Save'); if (save) save.classList.remove('hidden');
    const kb = $(prefix + 'Size'); if (kb) kb.textContent = 'Ready · ' + Math.round(f.size / 1024) + ' KB picture made ' + Math.round(SHOT.photo.length * 0.75 / 1024) + ' KB';
  }).catch(err => { if (box) box.innerHTML = ''; toast(err.message, 'bad'); });
}
function savePhoto(site, id, then) {
  if (!SHOT) return Promise.resolve(false);
  const shot = SHOT;
  return call('setEmployeePhoto', SESSION.token, site, id, shot.thumb, shot.photo).then(res => {
    if (!res.ok) { toast(res.error, 'bad'); return false; }
    PH.idx[id] = res.ver; lsSet('att_phidx', JSON.stringify(PH.idx));
    PH.thumbs[id] = { v: res.ver, t: shot.thumb }; lsSet('att_pt_' + id, res.ver + '|' + shot.thumb);
    BIG[id] = shot.photo;
    SHOT = null; paintPhotos();
    return true;
  });
}

const BIG = {};
function openPhotoSheet(site, id, name) {
  SHOT = null;
  const has = !!PH.idx[id];
  openSheet(`<h3>${esc(name)}</h3><p class="sheet-sub">${esc(id)} · ${esc(site)}</p>
    <div class="ph-big" id="phPrev">${has ? '' : `<div class="ph-none">${ic('camera')}<span>No photo yet</span></div>`}</div>
    <div id="phSize" class="listcount" style="text-align:center;margin-top:8px"></div>
    ${photoPickers('ph')}
    <button class="btn btn-primary hidden" id="phSave" onclick="savePhotoSheet('${js(site)}','${js(id)}','${js(name)}')">${ic('check')}Save photo</button>`);
  if (!has) return;
  const box = $('phPrev'), t = thumbOf(id);
  if (t) box.style.backgroundImage = 'url("' + t + '")';
  box.classList.add('has-ph');
  if (BIG[id]) { box.style.backgroundImage = 'url("' + BIG[id] + '")'; return; }
  call('getEmployeePhoto', SESSION.token, id).then(p => {
    if (!p) return;
    BIG[id] = p;
    if ($('phPrev') && !SHOT) $('phPrev').style.backgroundImage = 'url("' + p + '")';
  }).catch(() => {});
}
function savePhotoSheet(site, id, name) {
  const b = $('phSave'); b.disabled = true;
  savePhoto(site, id).then(ok => { b.disabled = false; if (ok) { toast('Photo saved for ' + name, 'ok'); closeSheet(); } })
    .catch(err => { b.disabled = false; handleError(err); });
}

/* ---------------- boot ---------------- */

document.addEventListener('DOMContentLoaded', boot);

function boot() {
  paintIcons(document);
  $('refreshBtn').innerHTML = ic('refresh');
  $('acctBtn').innerHTML = ic('dots');
  ['loginUser', 'loginPass'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); }));
  document.addEventListener('visibilitychange', () => { if (!document.hidden && SESSION) refreshNow(false); });

  const B = window.ATT_BOOT;
  if (B && B.session && B.session.ok) { adopt({ session: B.session, cfg: B.cfg, first: B.first }); return; }   // from a portal tile
  if (B && B.error) $('loginError').textContent = B.error;

  const tok = lsGet(TOKEN_KEY);
  if (!tok) return;
  const snap = lsJson(SNAP_KEY);
  if (snap && snap.session && snap.session.token === tok) { SESSION = snap.session; CFG = snap.cfg || CFG; enterApp(); }   // instant: last copy
  else $('loginBtn').textContent = 'Resuming…';
  call('bootstrap', tok).then(res => {
    if (res && res.ok) return adopt(res);
    lsDel(TOKEN_KEY); lsDel(SNAP_KEY);
    if (ENTERED) forceSignOut('Your sign-in has ended. Please sign in again.');
    else $('loginBtn').textContent = 'Sign in';
  }).catch(() => {
    if (!ENTERED) $('loginBtn').textContent = 'Sign in';
    else $('liveDot').classList.add('stale');
  });
}

/** A session (+ first screen) from the server. */
function adopt(res) {
  SESSION = res.session; CFG = res.cfg || CFG;
  lsSet(TOKEN_KEY, SESSION.token);
  lsSet(SNAP_KEY, JSON.stringify({ session: SESSION, cfg: CFG }));
  const f = res.first || {};
  if (f.mark) put('mark', f.mark);
  if (f.today) put('today', f.today);
  if (f.overview) put('overview', f.overview);
  if (!ENTERED) enterApp();
  else { paintWho(); startPolling(); loadView(VIEW, false); }
  loadPhotoIndex();
  if (f.error) toast(f.error, 'bad');
}

function doLogin() {
  const u = $('loginUser').value.trim(), p = $('loginPass').value;
  if (!u || !p) { $('loginError').textContent = 'Enter your username and password.'; return; }
  $('loginError').textContent = '';
  $('loginBtn').disabled = true; $('loginBtn').textContent = 'Signing in…';
  call('loginAndLoad', u, p).then(res => {
    $('loginBtn').disabled = false; $('loginBtn').textContent = 'Sign in';
    if (!res.ok) { $('loginError').textContent = res.error; return; }
    $('loginPass').value = '';
    adopt(res);
  }).catch(err => {
    $('loginBtn').disabled = false; $('loginBtn').textContent = 'Sign in';
    $('loginError').textContent = String((err && err.message) || err);
  });
}

function paintWho() {
  const av = $('avatar');
  av.textContent = initials(SESSION.name);
  av.setAttribute('data-ggm-photo', SESSION.username + '|' + (SESSION.name || ''));
  $('whoName').textContent = SESSION.name || SESSION.username;
  $('whoMeta').textContent = SESSION.role + ' · ' + (SESSION.scope.length > 1 ? 'all ' + SESSION.scope.length + ' sites' : SESSION.scope[0] || '—');
}

function enterApp() {
  ENTERED = true;
  $('loginView').classList.add('hidden');
  $('appShell').classList.remove('hidden');
  paintWho();

/* ---------------- search ---------------- */

/**
 * How well "q" matches this person. Higher is better, 0 means no match.
 * An ID match beats a name match, the start of a word beats the middle,
 * and a loose letter-by-letter match still gets you on the list.
 */
function matchScore(q, name, id) {
  if (!q) return 1;
  const n = String(name == null ? '' : name).toLowerCase();
  const i = String(id == null ? '' : id).toLowerCase();
  if (i === q || n === q) return 1000;
  if (i.indexOf(q) === 0) return 900;
  if (n.indexOf(q) === 0) return 880;
  const words = n.split(/\s+/);
  for (let w = 1; w < words.length; w++) if (words[w].indexOf(q) === 0) return 830 - w;
  if (words.map(w => w.charAt(0)).join('').indexOf(q) === 0) return 800;
  const ni = n.indexOf(q);
  if (ni > 0) return 700 - Math.min(ni, 60);
  const ii = i.indexOf(q);
  if (ii > 0) return 660 - Math.min(ii, 60);
  // digits typed alone find the number part of an ID: "14" → TNK-014
  const digits = q.replace(/\D/g, '');
  if (digits && digits === q && i.replace(/\D/g, '').replace(/^0+/, '') === digits.replace(/^0+/, '')) return 860;
  if (q.length >= 3) {
    const sn = subseqScore(q, n); if (sn) return 300 + sn;
    const si = subseqScore(q, i); if (si) return 240 + si;
  }
  return 0;
}
/** Letters in order but not next to each other — "rmsh" finds "Ramesh". */
function subseqScore(q, s) {
  let from = 0, gaps = 0, first = -1;
  for (let k = 0; k < q.length; k++) {
    const at = s.indexOf(q.charAt(k), from);
    if (at < 0) return 0;
    if (first < 0) first = at; else gaps += at - from;
    from = at + 1;
  }
  return Math.max(1, 120 - gaps * 4 - Math.min(first, 20));
}
/** Best matches first; extra(row) can add other fields (supervisor, designation…). */
function rank(rows, q, nameOf, idOf, extra) {
  if (!q) return rows;
  return rows.map((r, i) => {
    let s = matchScore(q, nameOf(r), idOf(r));
    if (!s && extra) { const x = String(extra(r) || '').toLowerCase(); if (x.indexOf(q) > -1) s = x.indexOf(q) === 0 ? 500 : 400; }
    return { r: r, i: i, s: s };
  }).filter(x => x.s > 0).sort((a, b) => (b.s - a.s) || (a.i - b.i)).map(x => x.r);
}
/** Escapes, then wraps the matched run in a highlight. */
function hl(text, q) {
  const t = String(text == null ? '' : text);
  if (!q) return esc(t);
  const i = t.toLowerCase().indexOf(q);
  if (i < 0) return esc(t);
  return esc(t.slice(0, i)) + '<mark class="hl">' + esc(t.slice(i, i + q.length)) + '</mark>' + esc(t.slice(i + q.length));
}
function statusClass(status, prefix) {
  if (status === 'Full Day') return prefix + 'full';
  if (status === 'Half Day') return prefix + 'half';
  if (status === 'Absent') return prefix + 'absent';
  return '';
}
function statusStamp(st) { return st ? `<span class="stamp ${statusClass(st, 's-')}">${esc(st)}</span>` : '<span class="stamp s-muted">Not marked</span>'; }
function approvalStamp(st, ap) {
  if (!st) return '';
  if (ap === 'Approved') return `<span class="stamp s-correct">${ic('check')}HR approved</span>`;
  if (ap === 'SentBack') return `<span class="stamp s-wait">${ic('undo')}Sent back</span>`;
  return '<span class="stamp s-muted">Awaiting check</span>';
}

}
function onQ(view) {
  const raw = $('q_' + view).value || '';

}
function clearQ(view) { $('q_' + view).value = ''; Q[view] = ''; $('qx_' + view).classList.add('hidden'); paintQ(view); $('q_' + view).focus(); }
function paintQ(view) {

function openEmployee(site, id, y, m) {

/** HR / Admin buttons for today's record: only the ones that make sense for its state. */
function empActions(site, id, r) {
  if (SESSION.role === 'Supervisor') return '';
  if (!r.st) return `<button class="btn btn-ghost" onclick="openOverride('${js(site)}','${js(id)}','${js(r.n)}','Full Day',true)">${ic('edit')}Set today's status</button>`;

function empMonth(step) {
  if (!EMP) return;

function loadEmpMonth() {

function renderEmpMonth(d) {

  return fetchStore('mark', 'getSupervisorEmployees', SESSION.token).then(renderMark).catch(handleError);

/** Taps still on their way to the server stay lit, whatever a poll says. */
function applyPending(d) {
  Object.keys(PENDING_MARKS).forEach(id => {
    const e = d.employees.filter(x => x.id === id)[0];
    if (e) { e.status = PENDING_MARKS[id]; e.approval = 'Pending'; e.sentBack = false; e.locked = true; }
  });
  const c = { full: 0, half: 0, absent: 0, unmarked: 0 };
  d.employees.forEach(e => {
    if (e.status === 'Full Day') c.full++; else if (e.status === 'Half Day') c.half++;
    else if (e.status === 'Absent') c.absent++; else c.unmarked++;
  });
  d.counts = c; d.done = c.full + c.half + c.absent; d.total = d.employees.length;
}

let MARK_SIG = '';
function renderMark(d) {
  MARK_DATA = d;

  $('markSite').textContent = d.site;
  $('markDate').textContent = d.dateLabel;
  const clock = $('markClock');
  if (d.windowOpen) {
    const h = Math.floor(d.minutesLeft / 60), m = d.minutesLeft % 60;

  } else clock.innerHTML = ic('lock') + 'Closed at ' + esc(d.closingTime);
  refreshRing(); renderMarkBanner(); renderMarkKpis(); renderMarkFilters();
  const sig = JSON.stringify([d.windowOpen, d.employees.map(e => [e.id, e.name, e.status, e.approval, e.locked])]);

function renderMarkBanner() {
  const d = MARK_DATA, banner = $('markBanner');

function renderMarkKpis() {

function markVisible() {
  if (!MARK_DATA) return [];
  const rows = MARK_DATA.employees.filter(e => {
    if (MARK_FILTER === 'all') return true;
    if (MARK_FILTER === 'unmarked') return !e.status;
    return e.status === MARK_FILTER;
  });
  return rank(rows, MARK_QUERY, e => e.name, e => e.id, e => e.designation);

function unassignedTag(e) { return e.unassigned ? '<span class="stamp s-wait">Shared with the other supervisors</span>' : ''; }
function approvalTag(e) { return approvalStamp(e.status, e.approval); }

function renderMarkList() {
  const d = MARK_DATA, list = $('markList');
  if (!d) return;
  if (!d.employees.length) {
    $('markCount').textContent = '';
    list.innerHTML = empty('users', 'No one on your list yet', 'Add your workers with the button above, or ask HR.');
    return;
  }
  const rows = markVisible();
  const filtered = MARK_FILTER !== 'all' || !!MARK_QUERY;
  $('markCount').textContent = filtered ? 'Showing ' + rows.length + ' of ' + d.employees.length : d.employees.length + ' on the roll';
  if (!rows.length) {
    list.innerHTML = empty('search', 'Nobody matches', MARK_QUERY ? 'No name or ID like “' + esc(MARK_QUERY) + '”.' : 'No one in this group right now.');
    return;
  }
  list.innerHTML = rows.map(e => {
    const picks = [{ k: 'Full Day', i: 'sun', s: 'Full' }, { k: 'Half Day', i: 'half', s: 'Half' }, { k: 'Absent', i: 'absent', s: 'Absent' }].map(p => {
      const on = e.status === p.k ? ' on' : '';
      const dis = (e.locked || !d.windowOpen) ? ' disabled' : '';
      return `<button class="pick${on}" data-k="${p.k}"${dis} onclick="mark('${js(e.id)}','${p.k}',this)">${ic(p.i)}${p.s}</button>`;
    }).join('');
    const tags = unassignedTag(e) + approvalTag(e);
    return `<div class="emp ${statusClass(e.status, 'is-')} ${e.sentBack ? 'is-rejected' : ''}" id="emp_${esc(e.id)}">
      <div class="emp-head tap" onclick="openEmployee('${js(d.site)}','${js(e.id)}')">
        ${av(d.site, e.id, e.name)}
        <div class="emp-id-name"><b>${hl(e.name, MARK_QUERY)}</b><small>${hl(e.id, MARK_QUERY)}${e.designation ? ' · ' + hl(e.designation, MARK_QUERY) : ''}</small></div>
        ${e.status ? `<span class="stamp ${statusClass(e.status, 's-')}">${esc(e.status)}</span>` : ''}
      </div>
      <div class="emp-tags">${tags}</div>
      <div class="picker">${picks}</div>
      ${e.sentBack ? `<div class="emp-note">${ic('undo')}HR sent this back — mark it again correctly.</div>` : ''}
    </div>`;
  }).join('');
}

function mark(id, status, btn) {
  if (MARK_BUSY[id]) return;
  MARK_BUSY[id] = true;
  PENDING_MARKS[id] = status;
  const card = $('emp_' + id);
  btn.parentElement.querySelectorAll('.pick').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  if (card) {
    card.classList.remove('is-full', 'is-half', 'is-absent', 'is-rejected');
    card.classList.add(statusClass(status, 'is-'), 'just-marked');
    setTimeout(() => card.classList.remove('just-marked'), 600);
  }
  if (navigator.vibrate) navigator.vibrate(12);
  applyLocalMark(id, status);

  call('submitAttendance', SESSION.token, id, status).then(res => {
    MARK_BUSY[id] = false; delete PENDING_MARKS[id];
    if (!res.ok) { toast(res.error, 'bad'); loadMark(true); return; }
    lockCard(id, status);
    save('mark');
    toast(status + ' saved', 'ok');
  }).catch(err => { MARK_BUSY[id] = false; delete PENDING_MARKS[id]; handleError(err); loadMark(true); });
}

/** Keep the in-memory copy, the tiles and the ring in step without a round trip. */
function applyLocalMark(id, status) {
  if (!MARK_DATA) return;
  applyPending(MARK_DATA);
  refreshRing(); renderMarkBanner(); renderMarkKpis();
  const filtered = MARK_FILTER !== 'all' || !!MARK_QUERY;
  $('markCount').textContent = filtered ? 'Showing ' + markVisible().length + ' of ' + MARK_DATA.employees.length : MARK_DATA.employees.length + ' on the roll';
  if (MARK_FILTER !== 'all') setTimeout(renderMarkList, 700);   // let the stamp play first
}

function lockCard(id, status) {
  const card = $('emp_' + id);
  if (!card) return;
  card.classList.remove('is-rejected');
  const note = card.querySelector('.emp-note'); if (note) note.remove();
  const head = card.querySelector('.emp-head');
  let stamp = head.querySelector('.stamp');
  if (!stamp) { stamp = document.createElement('span'); head.appendChild(stamp); }
  stamp.className = 'stamp ' + statusClass(status, 's-');
  stamp.textContent = status;
  const tags = card.querySelector('.emp-tags');
  if (tags) tags.innerHTML = '<span class="stamp s-muted">Awaiting check</span>';
  card.querySelectorAll('.pick').forEach(b => { b.disabled = true; });
}

function siteRows(d) { return !d ? [] : ACTIVE_SITE === 'ALL' ? d.rows : d.rows.filter(r => r.s === ACTIVE_SITE); }
function kpisOf(rows) {
  const k = { total: rows.length, filled: 0, full: 0, half: 0, absent: 0, approved: 0, sentBack: 0, waiting: 0 };
  rows.forEach(r => {
    if (!r.st) return;
    k.filled++;
    if (r.st === 'Full Day') k.full++; else if (r.st === 'Half Day') k.half++; else k.absent++;
    if (r.ap === 'Approved') k.approved++; else if (r.ap === 'SentBack') k.sentBack++; else k.waiting++;
  });
  k.pending = k.total - k.filled;
  k.attPct = k.total ? Math.round(((k.full + k.half * 0.5) / k.total) * 1000) / 10 : 0;
  k.compPct = pct(k.filled, k.total);
  return k;
}
function pickTodaySite(s) { ACTIVE_SITE = s; renderToday(got('today')); }

function loadToday(force) {
  const d = got('today');
  if (d) renderToday(d); else if (!$('todayKpis').innerHTML) $('todayKpis').innerHTML = skeleton(2);
  if (!force && age('today') < 4000) return Promise.resolve();
  return fetchStore('today', 'getTodayRows', SESSION.token, 'ALL').then(renderToday).catch(handleError);
}

function renderToday(d) {
  if (!d) return;
  renderChips('todayChips', ACTIVE_SITE, 'pickTodaySite', countBySite(d.rows));
  const k = kpisOf(siteRows(d));
  $('todayHead').innerHTML = `<div class="pagehead"><div><h1>Today</h1><p>${esc(d.dateLabel)}${ACTIVE_SITE !== 'ALL' ? ' · ' + esc(ACTIVE_SITE) : ''}</p></div>
    <span class="when">updated ${esc(d.updatedAt)}</span></div>`;
  $('todayKpis').innerHTML =
    (k.waiting ? `<div class="banner banner-warn go" onclick="openVerifyFor('pending')"><span class="bi">${ic('shield')}</span><div>${k.waiting} marked record${k.waiting === 1 ? ' is' : 's are'} waiting for your check. Tap to verify.</div></div>` : '') +
    `<div class="kpi-grid">
      ${tile({ cls: 'k-ok', n: k.filled, lbl: 'Attendance filled', sub: k.compPct + '% of roll', icon: 'check', go: "openTodayList('filled')" })}
      ${tile({ cls: 'k-amber', n: k.pending, lbl: 'Still pending', sub: 'not marked yet', icon: 'clock', go: "openTodayList('pending')" })}
      ${tile({ cls: 'k-ok', n: k.full, lbl: 'Full day', sub: '', icon: 'sun', go: "openTodayList('Full Day')" })}
      ${tile({ cls: 'k-half', n: k.half, lbl: 'Half day', sub: '', icon: 'half', go: "openTodayList('Half Day')" })}
      ${tile({ cls: 'k-bad', n: k.absent, lbl: 'Absent', sub: '', icon: 'absent', go: "openTodayList('Absent')" })}
      ${tile({ cls: 'k-blue', n: k.total, lbl: 'On the roll', sub: k.attPct + '% attendance', icon: 'users', go: "openTodayList('all')" })}
    </div>`;
  const bySite = {};
  d.rows.forEach(r => { (bySite[r.s] = bySite[r.s] || []).push(r); });
  $('todaySites').innerHTML = d.sites.map(s => {
    const kk = kpisOf(bySite[s.site] || []);
    return `<div class="row tap site-row" style="--sc:${siteColor(s.site)}" onclick="openSiteToday('${js(s.site)}')">
      <div class="rmain"><b>${esc(s.site)}</b>
        <small>${kk.filled}/${kk.total} marked · ${s.windowOpen ? 'closes ' : 'closed at '}${esc(s.closingTime)}</small>
        <div class="rtags"><span class="stamp s-full">${kk.full} full</span><span class="stamp s-half">${kk.half} half</span><span class="stamp s-absent">${kk.absent} absent</span>
          ${kk.waiting ? `<span class="stamp s-wait">${kk.waiting} to check</span>` : ''}</div></div>
      <div class="rnum"><b class="num">${kk.compPct}%</b><small>filled</small></div><span class="go">›</span></div>`;
  }).join('');
  paintQ('today');
}

function openSiteToday(site) { ACTIVE_SITE = site; renderToday(got('today')); window.scrollTo({ top: 0, behavior: 'smooth' }); }

/** The list after the search box. */
function verifyVisible() { return rank(verifyRows(), VERIFY_QUERY, r => r.n, r => r.id, r => r.sup); }
function renderVerify() { paintVerify(); }
function renderUnmarked() { VERIFY_FILTER = 'unmarked'; paintVerify(); }

function verifyRows() {
  const rows = siteRows(got('today'));
  return rows.filter(r => VERIFY_FILTER === 'unmarked' ? !r.st : VERIFY_FILTER === 'pending' ? (r.st && r.ap === 'Pending')
    : VERIFY_FILTER === 'sentback' ? (r.st && r.ap === 'SentBack') : !!r.st);
}

function paintVerify() {
  const d = got('today');
  if (!d) return;
  renderChips('verifyChips', ACTIVE_SITE, 'pickVerifySite', countBySite(d.rows));
  const all = siteRows(d);
  const n = { pending: all.filter(r => r.st && r.ap === 'Pending').length, unmarked: all.filter(r => !r.st).length,
              all: all.filter(r => r.st).length, sentback: all.filter(r => r.st && r.ap === 'SentBack').length };
  $('verifyFilters').innerHTML = [['pending', 'Awaiting check'], ['unmarked', 'Not marked'], ['all', 'Everything'], ['sentback', 'Sent back']]
    .map(f => `<button class="chip ${VERIFY_FILTER === f[0] ? 'active' : ''}" onclick="pickVerifyFilter('${f[0]}')">${f[1]}<span class="n">${n[f[0]]}</span></button>`).join('');
  $('verifyActions').innerHTML = VERIFY_FILTER === 'pending' && n.pending
    ? `<button class="btn btn-ghost" style="margin-bottom:12px" onclick="approveAll()">${ic('check')}Approve all ${n.pending} waiting${ACTIVE_SITE === 'ALL' ? '' : ' at ' + esc(ACTIVE_SITE)}</button>` : '';

  const base = verifyRows();
  const rows = verifyVisible();
  const el = $('verifyList');
  $('verifyCount').textContent = base.length ? (VERIFY_QUERY ? 'Showing ' + rows.length + ' of ' + base.length : base.length + ' in this list') : '';
  if (!base.length) {
    el.innerHTML = VERIFY_FILTER === 'unmarked' ? empty('check', 'Everyone is marked', "No one is missing from today's attendance.")
      : empty('shield', 'Nothing here', VERIFY_FILTER === 'pending' ? 'Every submission has been checked.' : 'No records match this filter.');
    return;
  }
  if (!rows.length) { el.innerHTML = empty('search', 'Nobody matches', 'No name, ID or supervisor like “' + esc(VERIFY_QUERY) + '”.'); return; }
  const multi = SESSION.scope.length > 1 && ACTIVE_SITE === 'ALL';
  const shown = rows.slice(0, 400);
  el.innerHTML = shown.map(r => {
    const who = `<div class="rmain" onclick="openEmployee('${js(r.s)}','${js(r.id)}')" style="cursor:pointer"><b>${hl(r.n, VERIFY_QUERY)}</b>
        <small>${hl(r.id, VERIFY_QUERY)}${multi ? ' · ' + esc(r.s) : ''}${r.sup ? ' · ' + hl(r.sup, VERIFY_QUERY) : ''}</small>
        <div class="rtags">${statusStamp(r.st)}${approvalStamp(r.st, r.ap)}</div></div>`;
    const acts = r.st
      ? `<button class="act act-ok" title="Approve" onclick="verify('${js(r.s)}','${js(r.id)}','Approved')">${ic('check')}</button>
         <button class="act act-no" title="Send back for correction" onclick="verify('${js(r.s)}','${js(r.id)}','SentBack')">${ic('undo')}</button>
         <button class="act act-edit" title="Change status" onclick="openOverride('${js(r.s)}','${js(r.id)}','${js(r.n)}','${js(r.st)}')">${ic('edit')}</button>`
      : `<button class="act act-edit" title="Set status" onclick="openOverride('${js(r.s)}','${js(r.id)}','${js(r.n)}','Full Day',true)">${ic('edit')}</button>`;
    return `<div class="row">${av(r.s, r.id, r.n)}${who}<div class="racts">${acts}</div></div>`;
  }).join('') + (rows.length > 400 ? '<div class="listcount">Search to find the rest.</div>' : '');
}

/** Change today's copy on the phone, then tell the server; a refusal puts the server's state back. */
function patchToday(site, id, st, ap) {
  const d = got('today');
  if (d) {
    d.rows.forEach(r => { if (r.s === site && r.id === id) { r.st = st; r.ap = ap; } });
    save('today');
  }
  repaintHr();
}
function repaintHr() {
  if (VIEW === 'verify') paintVerify();
  else if (VIEW === 'today') renderToday(got('today'));
  else if (VIEW === 'overview') renderOverview();
  else if (VIEW === 'record') paintRecord();
}
/** Today's status changed: move one day in this month's Record rows on the phone too. */
function patchRecordLocal(site, id, oldSt, newSt) {
  const k = { 'Full Day': 'f', 'Half Day': 'h', 'Absent': 'a' }, ym = ymNow();
  Object.keys(STORE).forEach(key => {
    const p = key.split(':');
    if (p[0] !== 'rec' || p[2] !== ym || (p[1] !== 'ALL' && p[1] !== site) || !STORE[key].d || !STORE[key].d.rows) return;
    const d = STORE[key].d;
    d.rows.forEach(r => {
      if (r.s !== site || r.id !== id) return;
      if (k[oldSt]) r[k[oldSt]] = Math.max(0, r[k[oldSt]] - 1);
      if (k[newSt]) r[k[newSt]]++;
      r.u = r.off ? 0 : Math.max(0, d.daysCounted - r.f - r.h - r.a);
    });
    save(key);
  });
  Object.keys(MONTHS).forEach(key => { if (key.indexOf(site + '|' + id + '|') === 0) delete MONTHS[key]; });
}
/** After a change made from someone's sheet, show that sheet again with the new state. */
function afterChange(site, id) {
  if (EMP && EMP.site === site && EMP.id === id) openEmployee(site, id, EMP.y, EMP.m);
  else closeSheet();
}

function verify(site, id, decision) {
  if (navigator.vibrate) navigator.vibrate(10);
  const r = findPerson(site, id);
  patchToday(site, id, r.st, decision);
  if ($('sheet').classList.contains('open')) afterChange(site, id);
  call('verifyRecord', SESSION.token, site, id, decision).then(res => {
    if (!res.ok) { toast(res.error, 'bad'); loadView(VIEW, true); return; }
    toast(decision === 'Approved' ? 'Approved' : 'Sent back for correction', 'ok');
  }).catch(err => { handleError(err); loadView(VIEW, true); });
}

function approveAll() {
  const sites = ACTIVE_SITE === 'ALL' ? SESSION.scope : [ACTIVE_SITE];
  if (!confirm('Approve every unchecked record at ' + (ACTIVE_SITE === 'ALL' ? 'all sites' : ACTIVE_SITE) + '?')) return;
  const d = got('today');
  d.rows.forEach(r => { if (sites.indexOf(r.s) > -1 && r.st && r.ap === 'Pending') r.ap = 'Approved'; });
  save('today'); repaintHr();
  Promise.all(sites.map(s => call('verifyAllPending', SESSION.token, s))).then(results => {
    const n = results.reduce((a, r) => a + ((r && r.count) || 0), 0);
    toast(n + ' record' + (n === 1 ? '' : 's') + ' approved', 'ok');
    loadView(VIEW, true);
  }).catch(err => { handleError(err); loadView(VIEW, true); });
}

function openOverride(site, id, name, current, unmarked) {
  openSheet(`
    <h3>${unmarked ? "Set today's status" : 'Change status'}</h3>
    <p class="sheet-sub">${esc(name)} · ${esc(id)} · ${esc(site)}. What you set here counts as approved.</p>
    <label class="fld"><span>Today's status</span>
      <select id="ovStatus">${['Full Day', 'Half Day', 'Absent'].map(s => `<option ${current === s ? 'selected' : ''}>${s}</option>`).join('')}</select></label>
    <button class="btn btn-primary" onclick="saveOverride('${js(site)}','${js(id)}')">Save and approve</button>
    ${unmarked ? '' : `<button class="btn btn-danger" onclick="clearRecord('${js(site)}','${js(id)}')">Clear it — let the supervisor redo</button>`}
  `);
}
function saveOverride(site, id) {
  const status = $('ovStatus').value, before = findPerson(site, id).st;
  patchToday(site, id, status, 'Approved');
  patchRecordLocal(site, id, before, status);
  repaintHr();
  afterChange(site, id);
  call('hrSetAttendance', SESSION.token, site, id, status).then(res => {
    if (!res.ok) { toast(res.error, 'bad'); loadView(VIEW, true); return; }
    toast('Set to ' + status, 'ok');
  }).catch(err => { handleError(err); loadView(VIEW, true); });
}
function clearRecord(site, id) {
  const before = findPerson(site, id).st;
  patchToday(site, id, '', 'Pending');
  patchRecordLocal(site, id, before, '');
  repaintHr();
  afterChange(site, id);
  call('hrSetAttendance', SESSION.token, site, id, '').then(res => {
    if (!res.ok) { toast(res.error, 'bad'); loadView(VIEW, true); return; }
    toast('Cleared — the supervisor can mark it again', 'ok');
  }).catch(err => { handleError(err); loadView(VIEW, true); });
}

let REC_SORT = { k: 'n', dir: 1 }, REC_QUERY = '';
const REC_COLS = [
  { k: 'n', label: 'Employee' }, { k: 's', label: 'Site' }, { k: 'f', label: 'Present', sm: 'P' }, { k: 'h', label: 'Half day', sm: 'H' },
  { k: 'a', label: 'Absent', sm: 'A' }, { k: 'u', label: 'Not marked', sm: 'NM' }, { k: 'md', label: 'Man-days', sm: 'MD' }
];
function ymNow() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function recKey() { return 'rec:' + $('recSite').value + ':' + $('recMonth').value; }

function loadRecord(force) {
  const siteSel = $('recSite');
  if (!siteSel.options.length) {
    siteSel.innerHTML = (SESSION.scope.length > 1 ? '<option value="ALL">All sites</option>' : '') +
      SESSION.scope.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
    $('recMonth').value = ymNow();
    $('recMonth').max = ymNow();
  }
  const k = recKey(), d = got(k);
  if (d) paintRecord(); else $('recTable').innerHTML = skeleton(4);
  if (!force && d && age(k) < 120000) return Promise.resolve();
  const [y, m] = $('recMonth').value.split('-').map(Number);
  return fetchStore(k, 'getMonthRecord', SESSION.token, $('recSite').value, y, m).then(r => {
    if (!r.ok) { $('recTable').innerHTML = empty('calendar', 'No record', esc(r.error)); return; }
    if (recKey() === k) paintRecord();
  }).catch(handleError);
}
function pickRecordFilter() { if (!$('recMonth').value) $('recMonth').value = ymNow(); loadRecord(false); }
function onRecSearch() {
  const raw = $('recSearch').value || '';
  $('recClear').classList.toggle('hidden', !raw);
  debounce('rec', () => { REC_QUERY = raw.trim().toLowerCase(); paintRecord(); });
}
function clearRecSearch() { $('recSearch').value = ''; REC_QUERY = ''; $('recClear').classList.add('hidden'); paintRecord(); $('recSearch').focus(); }
function sortRecord(k) { REC_SORT = REC_SORT.k === k ? { k: k, dir: -REC_SORT.dir } : { k: k, dir: (k === 'n' || k === 's') ? 1 : -1 }; paintRecord(); }

/** The rows on screen = the rows printed: filters, search and sort all applied. */
function recordRows() {
  const d = got(recKey());
  if (!d || !d.rows) return [];
  let rows = d.rows.map(r => Object.assign({}, r, { md: r.f + r.h * 0.5 }));
  if ($('recHideZero').checked) rows = rows.filter(r => r.f + r.h > 0);
  if (REC_QUERY) rows = rank(rows, REC_QUERY, r => r.n, r => r.id);
  const k = REC_SORT.k, dir = REC_SORT.dir;
  if (!REC_QUERY || k !== 'n') rows.sort((a, b) => {
    const x = a[k], y = b[k];
    return (typeof x === 'number' ? (x - y) : String(x).localeCompare(String(y))) * dir || a.n.localeCompare(b.n);
  });
  return rows;
}
function recordTotals(rows) {
  const t = { f: 0, h: 0, a: 0, u: 0, md: 0 };
  rows.forEach(r => { t.f += r.f; t.h += r.h; t.a += r.a; t.u += r.u; t.md += r.md; });
  return t;
}

function paintRecord() {
  const d = got(recKey());
  if (!d || !d.rows) return;
  const multi = $('recSite').value === 'ALL';
  const all = d.rows.length, rows = recordRows(), t = recordTotals(rows);
  $('recSub').textContent = d.label + ' · ' + (multi ? 'all sites' : $('recSite').value) + ' · ' + d.daysCounted + ' day' + (d.daysCounted === 1 ? '' : 's') + (d.current ? ' so far' : '');
  $('recKpis').innerHTML = `<div class="kpi-grid four">
    ${tile({ cls: 'k-blue', n: rows.length, lbl: 'People', sub: rows.length !== all ? 'of ' + all : 'on the record', icon: 'users', sel: REC_SORT.k === 'n', go: "sortRecord('n')" })}
    ${tile({ cls: 'k-ok', n: t.f, lbl: 'Present days', sub: 'most first', icon: 'sun', sel: REC_SORT.k === 'f', go: "sortRecord('f')" })}
    ${tile({ cls: 'k-half', n: t.h, lbl: 'Half days', sub: 'most first', icon: 'half', sel: REC_SORT.k === 'h', go: "sortRecord('h')" })}
    ${tile({ cls: 'k-bad', n: t.a, lbl: 'Absent days', sub: 'most first', icon: 'absent', sel: REC_SORT.k === 'a', go: "sortRecord('a')" })}
  </div>`;
  $('recCount').textContent = (rows.length === all ? all + ' people' : 'Showing ' + rows.length + ' of ' + all) + ' · as of ' + d.updatedAt + ' · tap a column to sort';
  if (!rows.length) { $('recTable').innerHTML = empty('search', 'Nobody matches', REC_QUERY ? 'No name or ID like “' + esc(REC_QUERY) + '”.' : 'Nobody with present days this month.'); return; }
  const cols = REC_COLS.filter(c => multi || c.k !== 's');
  const arrow = k => REC_SORT.k === k ? (REC_SORT.dir > 0 ? ' ▲' : ' ▼') : '';
  const shown = rows.slice(0, 1000);
  $('recTable').innerHTML = `<div class="tbl-wrap"><table class="tbl rec">
    <thead><tr><th>#</th>${cols.map(c => `<th class="sort ${c.k}" onclick="sortRecord('${c.k}')">${c.sm ? `<span class="lg">${c.label}</span><span class="sm">${c.sm}</span>` : c.label}${arrow(c.k)}</th>`).join('')}</tr></thead>
    <tbody>${shown.map((r, i) => `<tr class="tap${r.off ? ' off' : ''}" onclick="openEmployee('${js(r.s)}','${js(r.id)}',${d.year},${d.month})">
      <td class="i">${i + 1}</td>
      <td class="who"><div class="who-in">${av(r.s, r.id, r.n, 'av-sm')}<div><b>${hl(r.n, REC_QUERY)}</b><small>${hl(r.id, REC_QUERY)}${multi ? `<span class="site-sm"> · <span class="sdot" style="--sc:${siteColor(r.s)}"></span>${esc(r.s)}</span>` : ''}${r.off ? ' · switched off' : ''}</small></div></div></td>
      ${multi ? `<td class="site"><span class="sdot" style="--sc:${siteColor(r.s)}"></span>${esc(r.s)}</td>` : ''}
      <td class="n f">${r.f}</td><td class="n h">${r.h}</td><td class="n a">${r.a}</td><td class="n u">${r.u}</td><td class="n md">${fmt(r.md)}</td></tr>`).join('')}
    </tbody>
    <tfoot><tr><td class="i"></td><td><b>Total</b></td>${multi ? '<td class="site"></td>' : ''}<td class="n f">${t.f}</td><td class="n h">${t.h}</td><td class="n a">${t.a}</td><td class="n u">${t.u}</td><td class="n md">${fmt(t.md)}</td></tr></tfoot>
  </table></div><div class="listcount legend">P present · H half day · A absent · NM not marked · MD man-days</div>` + (rows.length > 1000 ? '<div class="listcount">Search or filter to see the rest (the PDF has everyone).</div>' : '');
}

/* ---- Print list: a PDF of exactly what is on screen (the PDF tools load only now) ---- */
function loadScriptOnce(src) {
  return new Promise((res, rej) => {
    if (document.querySelector('script[src="' + src + '"]')) return res();
    const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s);
  });
}
function printRecord() {
  const d = got(recKey());
  if (!d || !d.rows) return toast('The list is still loading', 'bad');
  const rows = recordRows(), t = recordTotals(rows), multi = $('recSite').value === 'ALL';
  if (!rows.length) return toast('Nothing to print with these filters', 'bad');
  const btn = $('recPrint'); btn.disabled = true;
  loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')
    .then(() => loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'))
    .then(() => {
      const site = multi ? 'All sites' : $('recSite').value;
      const doc = new window.jspdf.jsPDF({ orientation: 'portrait', unit: 'pt', format: 'a4' });
      const W = doc.internal.pageSize.getWidth();
      doc.setFillColor(35, 34, 32); doc.rect(0, 0, W, 64, 'F');
      doc.setFillColor(242, 193, 78); doc.roundedRect(36, 20, 24, 24, 5, 5, 'F');
      doc.setTextColor(246, 242, 231); doc.setFont('helvetica', 'bold'); doc.setFontSize(15);
      doc.text('Attendance record — ' + site + ' — ' + d.label, 70, 37);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(180, 174, 159);
      const notes = [d.daysCounted + ' day' + (d.daysCounted === 1 ? '' : 's') + (d.current ? ' so far' : ''), rows.length + ' people',
        $('recHideZero').checked ? 'people with 0 present days left out' : '', REC_QUERY ? 'search: "' + REC_QUERY + '"' : '', 'as of ' + d.updatedAt].filter(Boolean);
      doc.text(notes.join('  ·  '), 70, 51);
      const head = ['#', 'Employee', 'ID'].concat(multi ? ['Site'] : [], ['Present', 'Half day', 'Absent', 'Not marked', 'Man-days']);
      const body = rows.map((r, i) => [i + 1, r.n, r.id].concat(multi ? [r.s] : [], [r.f, r.h, r.a, r.u, r.md]));
      const foot = [['', 'Total', ''].concat(multi ? [''] : [], [t.f, t.h, t.a, t.u, t.md])];
      const numFrom = multi ? 4 : 3, colStyles = {};
      for (let c = numFrom; c < head.length; c++) colStyles[c] = { halign: 'right' };
      colStyles[0] = { halign: 'right', cellWidth: 24, textColor: [154, 150, 139] };
      doc.autoTable({
        head: [head], body: body, foot: foot, startY: 80, margin: { left: 36, right: 36 },
        styles: { font: 'helvetica', fontSize: 8.5, cellPadding: 4, textColor: [27, 26, 23], lineColor: [232, 227, 214], lineWidth: 0.4 },
        headStyles: { fillColor: [35, 34, 32], textColor: [242, 193, 78], fontStyle: 'bold' },
        footStyles: { fillColor: [251, 239, 203], textColor: [27, 26, 23], fontStyle: 'bold' },
        alternateRowStyles: { fillColor: [250, 248, 242] }, columnStyles: colStyles, showFoot: 'lastPage',
        didParseCell: c => {
          if (c.section !== 'body') return;
          const k = c.column.index - numFrom;
          if (k === 0 && c.cell.raw > 0) c.cell.styles.textColor = [56, 125, 80];
          if (k === 2 && c.cell.raw > 0) c.cell.styles.textColor = [190, 64, 38];
        },
        didDrawPage: () => {
          const p = doc.internal.getNumberOfPages(), H = doc.internal.pageSize.getHeight();
          doc.setFontSize(8); doc.setTextColor(154, 150, 139);
          doc.text('GGM Portal · Attendance · page ' + p, 36, H - 18);
        }
      });
      doc.save(('Attendance ' + site + ' ' + d.label).replace(/[^\w\- ]+/g, '').replace(/\s+/g, '-') + '.pdf');
      toast('PDF downloaded', 'ok');
    })
    .catch(() => { toast('Could not load the PDF tools — printing the page instead', 'bad'); window.print(); })
    .finally(() => { btn.disabled = false; });
}

/* =====================================================================
   PUNCH REPORT — the punching machine's report against the marks
   The file is read here on the phone (any size); only first / last punch
   and the count per person per day go to the server, which turns every
   mark that does not fit bright red in the site sheets.
   ===================================================================== */

let PUNCH = null, PUNCH_RESULT = null;
function openPunchUpload() {
  PUNCH = null;
  openSheet(`<h3>Punch report</h3>
    <p class="sheet-sub">Upload the <b>Daily Punch Report</b> (.xlsx) from the punching machine. Each marked day is checked against the punches;
      a mark that does not fit turns <b style="color:#e00">bright red</b> in the site sheet, one that fits goes back to black.</p>
    <label class="btn btn-amber pick-file">${ic('folder')}Choose the report file<input type="file" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" onchange="readPunchFile(this)"></label>
    <div id="punchInfo"></div>
    ${PUNCH_RESULT ? `<button class="btn btn-ghost" onclick="showPunchResult()">${ic('list')}See the last check (${PUNCH_RESULT.different} different)</button>` : ''}`);
}

function readPunchFile(input) {
  const f = input.files && input.files[0];
  input.value = '';
  if (!f) return;
  $('punchInfo').innerHTML = skeleton(1);
  Promise.all([loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'), f.arrayBuffer()]).then(([, buf]) => {
    const wb = XLSX.read(buf, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    PUNCH = parsePunchRows(XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' }), f.name);
    const withPunch = PUNCH.rows.reduce((a, r) => a + r.d.filter(Boolean).length, 0);
    $('punchInfo').innerHTML = `<div class="banner banner-ok"><span class="bi">${ic('check')}</span><div><b>${esc(f.name)}</b><br>
        ${PUNCH.rows.length} people · ${PUNCH.dates.length} days (${esc(PUNCH.dates[0])} to ${esc(PUNCH.dates[PUNCH.dates.length - 1])}) · ${withPunch} punched days</div></div>
      <button class="btn btn-primary" id="punchGo" onclick="sendPunch()">${ic('shield')}Check and mark differences red</button>`;
  }).catch(err => { $('punchInfo').innerHTML = ''; toast(String((err && err.message) || err || 'Could not read that file'), 'bad'); });
}

/** Header row: "Employee ID", "Employee Name", …, then one column per date ("01-09-2026 Tuesday"). */
function parsePunchRows(grid, fileName) {
  const h = grid.findIndex(r => r.some(c => /employee\s*id/i.test(String(c))));
  if (h < 0) throw new Error('No "Employee ID" column found. Is this the Daily Punch Report?');
  const head = grid[h], idCol = head.findIndex(c => /employee\s*id/i.test(String(c)));
  const dateCols = [];
  head.forEach((c, i) => {
    const m = String(c).match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/);
    if (m) dateCols.push({ i: i, iso: m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0') });
  });
  if (!dateCols.length) throw new Error('No date columns (like 01-09-2026) in the header row.');
  const rows = [];
  grid.slice(h + 1).forEach(r => {
    const id = String(r[idCol] == null ? '' : r[idCol]).trim().replace(/\.0+$/, '');
    if (!id) return;
    rows.push({ id: id, d: dateCols.map(dc => punchOf(r[dc.i])) });
  });
  return { file: fileName, dates: dateCols.map(d => d.iso), rows: rows };
}

/** "09:20 AM\n06:00 PM" → "560,1080,2" (first punch, last punch in minutes, how many). */
function punchOf(cell) {
  const mins = [];
  String(cell == null ? '' : cell).replace(/(\d{1,2}):(\d{2})(?::\d{2})?\s*([AaPp][Mm])?/g, (all, h, m, ap) => {
    let hh = Number(h) % 24;
    if (ap) { hh = Number(h) % 12; if (/p/i.test(ap)) hh += 12; }
    mins.push(hh * 60 + Number(m));
    return all;
  });
  if (!mins.length) return '';
  mins.sort((a, b) => a - b);
  return mins[0] + ',' + mins[mins.length - 1] + ',' + mins.length;
}

function sendPunch() {
  if (!PUNCH) return;
  const b = $('punchGo'); b.disabled = true; b.innerHTML = ic('refresh') + 'Checking…';
  call('uploadPunchReport', SESSION.token, PUNCH).then(res => {
    b.disabled = false; b.innerHTML = ic('shield') + 'Check and mark differences red';
    if (!res.ok) return toast(res.error, 'bad');
    PUNCH_RESULT = res;
    toast(res.different ? res.different + ' marks differ — now red in the sheet' : 'Every mark fits the punches', res.different ? 'bad' : 'ok');
    showPunchResult();
  }).catch(err => { b.disabled = false; b.innerHTML = ic('shield') + 'Check and mark differences red'; handleError(err); });
}

function showPunchResult() {
  const r = PUNCH_RESULT;
  if (!r) return;
  const top = `<div class="kpi-grid four" style="margin-bottom:10px">
      ${tile({ cls: 'k-blue', n: r.compared, lbl: 'Marks checked', icon: 'list', go: '' })}
      ${tile({ cls: 'k-bad', n: r.different, lbl: 'Different (red)', icon: 'alert', go: '' })}
      ${tile({ cls: 'k-amber', n: r.notMarked, lbl: 'Punched, not marked', icon: 'clock', go: '' })}
      ${tile({ cls: 'k-faint', n: r.notOnAttendance, lbl: 'Not on attendance', icon: 'users', go: '' })}
    </div>`;
  const rows = r.list.slice().sort((a, b) => b.date.localeCompare(a.date) || a.n.localeCompare(b.n));
  openList('Punch check', esc(r.file) + ' · ' + esc(r.dateFrom) + ' to ' + esc(r.dateTo) + ' · these marks are now red in the sheet', rows,
    x => `<div class="row tap" onclick="openEmployee('${js(x.s)}','${js(x.id)}',${Number(x.date.slice(0, 4))},${Number(x.date.slice(5, 7))})">${av(x.s, x.id, x.n)}
      <div class="rmain"><b>${hl(x.n, LIST.q)}</b><small>${hl(x.id, LIST.q)} · ${esc(x.s)} · ${esc(new Date(x.date + 'T00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', weekday: 'short' }))}</small>
        <div class="rtags"><span class="stamp ${statusClass(x.marked, 's-')}">Marked ${esc(x.marked)}</span><span class="stamp s-muted">${ic('clock')}${esc(x.punch)}</span></div></div></div>`, top);
}

   ===================================================================== */

function pickStaffSite(s) { STAFF_SITE = s; renderStaff(); }
function pickStaffFilter(f) { STAFF_FILTER = STAFF_FILTER === f && f !== 'all' ? 'all' : f; renderStaff(); }

function loadStaff(force) {
  const d = got('staff');
  if (d) renderStaff(); else if (!$('staffList').innerHTML) $('staffList').innerHTML = skeleton(4);
  if (!force && age('staff') < 60000) return Promise.resolve();
  return fetchStore('staff', 'getStaffData', SESSION.token).then(renderStaff).catch(handleError);
}

function onStaffSearch() {
  const raw = $('staffSearch').value || '';
  $('staffClear').classList.toggle('hidden', !raw);
  debounce('staff', () => { STAFF_QUERY = raw.trim().toLowerCase(); renderStaff(); });
}
function clearStaffSearch() { $('staffSearch').value = ''; STAFF_QUERY = ''; $('staffClear').classList.add('hidden'); renderStaff(); $('staffSearch').focus(); }

function renderStaff() {
  const d = got('staff');
  if (!d) return;
  const inSite = d.employees.filter(e => STAFF_SITE === 'ALL' || e.site === STAFF_SITE);
  const cnt = { ALL: d.employees.length };
  d.employees.forEach(e => { cnt[e.site] = (cnt[e.site] || 0) + 1; });
  renderChips('staffChips', STAFF_SITE, 'pickStaffSite', cnt);
  const k = { all: inSite.length, active: inSite.filter(e => e.active).length, off: inSite.filter(e => !e.active).length, nosup: inSite.filter(e => e.active && !e.supervisor).length };
  $('staffKpis').innerHTML = `<div class="kpi-grid four">
    ${tile({ cls: 'k-blue', n: k.all, lbl: 'On file', icon: 'folder', sel: STAFF_FILTER === 'all', go: "pickStaffFilter('all')" })}
    ${tile({ cls: 'k-ok', n: k.active, lbl: 'Active', icon: 'check', sel: STAFF_FILTER === 'active', go: "pickStaffFilter('active')" })}
    ${tile({ cls: 'k-faint', n: k.off, lbl: 'Switched off', icon: 'lock', sel: STAFF_FILTER === 'off', go: "pickStaffFilter('off')" })}
    ${tile({ cls: 'k-amber', n: k.nosup, lbl: 'No supervisor', sub: 'every supervisor at the site sees them', icon: 'alert', sel: STAFF_FILTER === 'nosup', go: "pickStaffFilter('nosup')" })}
  </div>`;
  const base = inSite.filter(e => STAFF_FILTER === 'all' || (STAFF_FILTER === 'active' && e.active) || (STAFF_FILTER === 'off' && !e.active) || (STAFF_FILTER === 'nosup' && e.active && !e.supervisor));
  const rows = rank(base, STAFF_QUERY, e => e.name, e => e.id, e => e.designation + ' ' + e.supervisor);
  $('staffCount').textContent = STAFF_QUERY || STAFF_FILTER !== 'all' ? 'Showing ' + rows.length + ' of ' + inSite.length : inSite.length + ' on file';
  const el = $('staffList');
  if (!d.employees.length) { el.innerHTML = empty('users', 'No employees yet', 'Add your first one with the button above.'); return; }
  if (!rows.length) { el.innerHTML = empty('search', 'Nobody matches', ''); return; }
  el.innerHTML = rows.slice(0, 400).map((e, i) => `<div class="row tap ${e.active ? '' : 'is-off'}" onclick="openEditEmployee(${d.employees.indexOf(e)})">
      ${av(e.site, e.id, e.name)}
      <div class="rmain"><b>${hl(e.name, STAFF_QUERY)}</b>
        <small>${hl(e.id, STAFF_QUERY)} · ${esc(e.site)}${e.designation ? ' · ' + hl(e.designation, STAFF_QUERY) : ''}</small>
        <div class="rtags"><span class="stamp ${e.active ? 's-full' : 's-muted'}">${e.active ? 'Active' : 'Switched off'}</span>
          <span class="stamp ${e.supervisor ? 's-muted' : 's-wait'}">${e.supervisor ? hl(e.supervisor, STAFF_QUERY) : 'No supervisor'}</span></div></div>
      <span class="go">›</span></div>`).join('') + (rows.length > 400 ? '<div class="listcount">Search to find the rest.</div>' : '');
}

function supervisorOptions(site, selected) {
  const sups = (got('staff') || { supervisors: [] }).supervisors.filter(s => !site || s.site === site);
  const sel = String(selected || '').toLowerCase();
  const known = sups.some(s => s.username.toLowerCase() === sel);
  return `<option value="" ${!selected ? 'selected' : ''}>Unassigned — every supervisor at the site sees them</option>` +
    sups.map(s => `<option value="${esc(s.username)}" ${s.username.toLowerCase() === sel ? 'selected' : ''}>${esc(s.name)} (${esc(s.username)})</option>`).join('') +
    (selected && !known ? `<option value="${esc(selected)}" selected>${esc(selected)} — no longer a supervisor here</option>` : '');
}
function siteOptions(selected, list) {
  return (list || SESSION.scope).map(s => `<option ${s === selected ? 'selected' : ''}>${esc(s)}</option>`).join('');
}
function onEmpSiteChange(isNew) {
  const site = $('eSite').value;
  $('eSup').innerHTML = supervisorOptions(site, $('eSup').value);
  const next = ((got('staff') || {}).nextIds || {})[site];
  if (isNew && $('eId').dataset.auto === '1' && next) $('eId').value = next;
}

function openAddEmployee() {

  const next = ((got('staff') || {}).nextIds || {})[site] || '';

    <label class="fld"><span>Site</span><select id="eSite" onchange="onEmpSiteChange(true)">${siteOptions(site)}</select></label>
    <label class="fld"><span>Employee ID</span><input id="eId" value="${esc(next)}" data-auto="1" oninput="this.dataset.auto='0'" placeholder="e.g. TNK-014"></label>

function saveNewEmployee() {
  const id = $('eId').value.trim(), name = $('eName').value.trim();
  if (!id || !name) return toast('ID and name are both needed', 'bad');
  $('eBtn').disabled = true;
  call('addEmployee', SESSION.token, id, name, $('eSite').value, $('eSup').value, $('eDesig').value.trim()).then(res => {
    if (!res.ok) { $('eBtn').disabled = false; return toast(res.error, 'bad'); }
    const site = $('eSite').value;
    if (SHOT) savePhoto(site, id).then(ok => { if (!ok) toast('Added, but the photo did not save — tap their picture to try again', 'bad'); }).catch(handleError);
    closeSheet(); toast(name + ' added', 'ok'); loadStaff(true); STORE.today && (STORE.today.at = 0);
  }).catch(err => { $('eBtn').disabled = false; handleError(err); });
}

function openEditEmployee(i) {
  const e = got('staff').employees[i];
  if (!e) return;
  openSheet(`
    <h3>${esc(e.name)}</h3>
    <p class="sheet-sub">${esc(e.id)} · ${esc(e.site)}</p>
    <button class="btn btn-ghost" onclick="openEmployee('${js(e.site)}','${js(e.id)}')">${ic('calendar')}See their attendance</button>
    <label class="fld"><span>Employee ID</span><input id="eId" value="${esc(e.id)}"></label>
    <label class="fld"><span>Full name</span><input id="eName" value="${esc(e.name)}"></label>
    <label class="fld"><span>Site</span><select id="eSite" onchange="onEmpSiteChange(false)">${siteOptions(e.site)}</select></label>
    <label class="fld"><span>Supervisor</span><select id="eSup">${supervisorOptions(e.site, e.supervisor)}</select></label>
    <label class="fld"><span>Designation</span><input id="eDesig" value="${esc(e.designation || '')}"></label>
    <label class="fld"><span>Status</span><select id="eActive">
      <option value="1" ${e.active ? 'selected' : ''}>Active</option><option value="0" ${!e.active ? 'selected' : ''}>Switched off</option></select></label>
    <button class="btn btn-primary" onclick="saveEditEmployee(${e.row})">Save changes</button>
    ${e.active ? `<button class="btn btn-ghost" onclick="deactivateEmployee(${e.row}, '${js(e.name)}')">Switch off — keep the history</button>` : ''}

}

function saveEditEmployee(row) {
  call('editEmployee', SESSION.token, row, $('eId').value.trim(), $('eName').value.trim(),
       $('eSite').value, $('eSup').value, $('eDesig').value.trim(), $('eActive').value === '1').then(res => {
    if (!res.ok) return toast(res.error, 'bad');
    closeSheet(); toast('Saved', 'ok'); loadStaff(true); STORE.today && (STORE.today.at = 0);
  }).catch(handleError);
}
function deactivateEmployee(row, name) {
  if (!confirm('Switch ' + name + ' off? Their row goes grey on the site sheet and all past attendance is kept.')) return;
  call('removeEmployee', SESSION.token, row).then(res => {
    if (!res.ok) return toast(res.error, 'bad');
    closeSheet(); toast(name + ' switched off', 'ok'); loadStaff(true);
  }).catch(handleError);
}
/** The only thing that takes a row off the site sheets. Admin only. */
function deleteEmployeeForGood(row, name) {
  if (!confirm('Delete ' + name + ' completely?\n\nTheir row and every day they were ever marked will be removed from the site sheets. This cannot be undone.')) return;
  call('deleteEmployeePermanently', SESSION.token, row).then(res => {
    if (!res.ok) return toast(res.error, 'bad');

/* Chart.js loads only when Trends is opened — every other screen opens without it. */
let chartJs = null;
function loadChartJs() {
  if (window.Chart) return Promise.resolve();
  if (chartJs) return chartJs;
  chartJs = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js';
    s.onload = res; s.onerror = () => { chartJs = null; rej(); };
    document.head.appendChild(s);
  });
  return chartJs;
}
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

function drawTrendCharts(d) {
  const ok = cssVar('--ok'), half = cssVar('--amber'), bad = cssVar('--bad'), ink = cssVar('--ink-soft'), line = cssVar('--line');
  Chart.defaults.font.family = "'Inter', system-ui, sans-serif";
  Chart.defaults.font.weight = '600';
  Chart.defaults.color = ink;
  const sites = d.sites;
  drawChart('chartSite', { type: 'bar', data: { labels: sites, datasets: [
    { label: 'Full day', backgroundColor: ok, data: sites.map(s => d.bySite[s].full), borderRadius: 6 },
    { label: 'Half day', backgroundColor: half, data: sites.map(s => d.bySite[s].half), borderRadius: 6 },
    { label: 'Absent', backgroundColor: bad, data: sites.map(s => d.bySite[s].absent), borderRadius: 6 }] }, options: barOpts(true, line) });
  drawChart('chartMonth', { type: 'line', data: { labels: d.months, datasets: [
    { label: 'Full day', borderColor: ok, backgroundColor: ok + '22', fill: true, tension: .35, data: d.months.map(m => d.byMonth[m].full) },
    { label: 'Half day', borderColor: half, backgroundColor: half + '22', fill: true, tension: .35, data: d.months.map(m => d.byMonth[m].half) },
    { label: 'Absent', borderColor: bad, backgroundColor: bad + '22', fill: true, tension: .35, data: d.months.map(m => d.byMonth[m].absent) }] }, options: barOpts(false, line) });
  const rates = sites.map(s => { const b = d.bySite[s], rec = b.full + b.half + b.absent; return rec ? Math.round(((b.full + b.half * 0.5) / rec) * 1000) / 10 : 0; });
  drawChart('chartRate', { type: 'bar', data: { labels: sites, datasets: [{ label: 'Attendance rate %', data: rates, borderRadius: 8, backgroundColor: cssVar('--amber') }] },
    options: Object.assign(barOpts(false, line), { indexAxis: window.innerWidth < 600 ? 'y' : 'x', plugins: { legend: { display: false } } }) });
}
function barOpts(stacked, grid) {
  return { responsive: true, maintainAspectRatio: false,
    plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, boxHeight: 12, padding: 14, usePointStyle: true } } },
    scales: { x: { stacked: !!stacked, grid: { display: false } }, y: { stacked: !!stacked, beginAtZero: true, grid: { color: grid }, ticks: { precision: 0 } } } };
}
function drawChart(id, cfg) {
  if (CHARTS[id]) CHARTS[id].destroy();
  CHARTS[id] = new Chart(document.getElementById(id), cfg);
}
